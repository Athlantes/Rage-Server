<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repo Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tracker-container">
        <div id="tracker-header">
            <div id="header-icon">◈</div>
            <div id="header-text">
                <div id="header-title">VEHICLE TRACKER</div>
                <div id="header-sub">SIGNAL ACTIVE</div>
            </div>
            <div id="signal-dot"></div>
        </div>

        <div id="radar-wrap">
            <canvas id="radar-canvas" width="220" height="220"></canvas>
            <div id="radar-center-dot"></div>
            <div class="ring-label" id="ring-far">FAR</div>
            <div class="ring-label" id="ring-mid">MID</div>
            <div class="ring-label" id="ring-close">CLOSE</div>
        </div>

        <div id="distance-panel">
            <div id="distance-label">DISTANCE</div>
            <div id="distance-value">---</div>
            <div id="distance-unit">METERS</div>
        </div>

        <div id="bars-panel">
            <div class="bar" id="bar-1"></div>
            <div class="bar" id="bar-2"></div>
            <div class="bar" id="bar-3"></div>
            <div class="bar" id="bar-4"></div>
            <div class="bar" id="bar-5"></div>
        </div>

        <div id="status-line">
            <span id="status-icon">▶</span>
            <span id="status-text">TRACKING TARGET</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
