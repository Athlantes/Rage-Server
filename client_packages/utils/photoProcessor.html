<html>
<body>
<script>
    let uploadInterval = null;

    function processPhoto(filename) {
        mp.trigger('client:photo:log', 'Processor: Loading ' + filename);

        const img = new Image();
        img.crossOrigin = "Anonymous"; 
        
        img.onload = function() {
            try {
                // 1. OPTIMIZATION: Resize image
                const MAX_WIDTH = 800; // Limit width to 800px (Good for phone gallery)
                let width = img.naturalWidth;
                let height = img.naturalHeight;

                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // 2. COMPRESSION: Use JPEG with 0.5 quality (Huge size reduction)
                const dataURL = canvas.toDataURL('image/jpeg', 0.5);
                const base64 = dataURL.split(',')[1];
                
                // 3. CHUNKING
                const CHUNK_SIZE = 4096; // 4KB is safe for RAGE
                const totalChunks = Math.ceil(base64.length / CHUNK_SIZE);
                
                mp.trigger('client:photo:startUpload', totalChunks);

                // 4. THROTTLING: Send chunks slowly (prevents freezing/crashing)
                let currentChunk = 0;
                
                if (uploadInterval) clearInterval(uploadInterval);

                uploadInterval = setInterval(() => {
                    if (currentChunk >= totalChunks) {
                        clearInterval(uploadInterval);
                        mp.trigger('client:photo:complete'); // Notify client we are done
                        return;
                    }

                    const start = currentChunk * CHUNK_SIZE;
                    const end = start + CHUNK_SIZE;
                    const chunk = base64.substring(start, end);

                    mp.trigger('client:photo:sendChunk', chunk, currentChunk);
                    currentChunk++;

                }, 15); // Wait 15ms between packets to let the game breathe

            } catch (e) {
                mp.trigger('client:photo:error', 'Canvas Error: ' + e.message);
            }
        };

        img.onerror = function() {
            mp.trigger('client:photo:error', 'Failed to load screenshot from disk.');
        };

        img.src = 'http://screenshots/' + filename; 
    }
</script>
</body>
</html>
