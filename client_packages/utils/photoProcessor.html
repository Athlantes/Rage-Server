<html>
<body>
<script>
    let uploadInterval = null;

    function processPhoto(filename) {
        mp.trigger('client:photo:log', 'Processor: Loading ' + filename);

        const img = new Image();
        img.crossOrigin = "Anonymous"; 
        
        img.onload = function() {
            try {
                // --- 1. SETTINGS FOR CLARITY ---
                const MAX_WIDTH = 1366; // 1366px = HD Quality (Good balance)
                const IMG_QUALITY = 0.85; // 0.85 = High Clarity
                
                let width = img.naturalWidth;
                let height = img.naturalHeight;

                // Resize aspect ratio
                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                // Apply Filters for "Realism" (Removes fog/washout)
                ctx.filter = 'contrast(1.15) saturate(1.1)'; 
                ctx.drawImage(img, 0, 0, width, height);
                ctx.filter = 'none';
                
                // Convert
                const dataURL = canvas.toDataURL('image/jpeg', IMG_QUALITY);
                const base64 = dataURL.split(',')[1];
                
                // --- 2. FAST UPLOAD (BURST MODE) ---
                const CHUNK_SIZE = 4096; // 4KB (Safe Limit)
                const BURST_SIZE = 8;    // Send 8 chunks at once (Speed Boost)
                const BURST_WAIT = 10;   // Wait 10ms between bursts
                
                const totalChunks = Math.ceil(base64.length / CHUNK_SIZE);
                mp.trigger('client:photo:startUpload', totalChunks);

                let currentChunk = 0;
                
                if (uploadInterval) clearInterval(uploadInterval);

                uploadInterval = setInterval(() => {
                    // Send a "Burst" of packets
                    for (let i = 0; i < BURST_SIZE; i++) {
                        if (currentChunk >= totalChunks) {
                            clearInterval(uploadInterval);
                            mp.trigger('client:photo:complete'); 
                            return;
                        }

                        const start = currentChunk * CHUNK_SIZE;
                        const end = start + CHUNK_SIZE;
                        const chunk = base64.substring(start, end);

                        // Send chunk
                        mp.trigger('client:photo:sendChunk', chunk, currentChunk);
                        currentChunk++;
                    }
                }, BURST_WAIT); // Wait briefly before next burst

            } catch (e) {
                mp.trigger('client:photo:error', 'Canvas Error: ' + e.message);
            }
        };

        img.onerror = function() {
            mp.trigger('client:photo:error', 'Disk Read Error. File not found.');
        };

        img.src = 'http://screenshots/' + filename; 
    }
</script>
</body>
</html>
