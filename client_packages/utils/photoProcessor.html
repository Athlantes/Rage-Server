<html>
<body>
    <script>
        function processPhoto(filename) {
            mp.trigger('client:photo:log', 'Processor: Loading ' + filename);

            const img = new Image();
            img.crossOrigin = "Anonymous"; 
            
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth; // Use natural dimensions
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    const dataURL = canvas.toDataURL('image/png', 0.8); // 0.8 quality to save space
                    const base64 = dataURL.split(',')[1];
                    
                    // --- CHUNKING LOGIC ---
                    const CHUNK_SIZE = 50000; // 50KB chunks
                    const totalChunks = Math.ceil(base64.length / CHUNK_SIZE);
                    
                    mp.trigger('client:photo:log', `Processor: Splitting image into ${totalChunks} chunks.`);
                    mp.trigger('client:photo:startUpload', totalChunks, filename);

                    for (let i = 0; i < totalChunks; i++) {
                        const start = i * CHUNK_SIZE;
                        const end = start + CHUNK_SIZE;
                        const chunk = base64.substring(start, end);
                        mp.trigger('client:photo:sendChunk', chunk);
                    }
                    
                } catch (e) {
                    mp.trigger('client:photo:error', 'Canvas Error: ' + e.message);
                }
            };

            img.onerror = function() {
                mp.trigger('client:photo:error', 'Failed to load screenshot from disk.');
            };

            img.src = 'http://screenshots/' + filename; 
        }
    </script>
</body>
</html>
