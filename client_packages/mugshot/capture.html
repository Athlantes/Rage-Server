<!DOCTYPE html>
<html>
<head>
    <title>Mugshot Capture (RAGE.MP)</title>
</head>
<body>
<script>
    var canvas  = document.createElement("canvas");
    document.body.appendChild(canvas);
    canvas.style.display = 'none';
    var context = canvas.getContext("2d");
    let uploadInterval = null;

    const DBG = (...args) => mp.trigger('client:mugshot:log', '[capture.html] ' + args.join(' '));

    // Updated function signature to accept headX and headY
    function recieveHeadshotImage(imgURL, screenResolutionStr, headX, headY) {
        DBG(`>> Processing Image. Head Pos: ${headX}, ${headY}`);

        var image = new Image();
        image.crossOrigin = 'Anonymous';
        
        image.onload = function () {
            // 1. Define the size of the final mugshot (e.g. 300x300 pixels)
            const targetSize = 300; 
            
            canvas.width  = targetSize;
            canvas.height = targetSize;

            // 2. Calculate where to start cutting (Cropping)
            // headX/Y are 0.0 to 1.0, so multiply by actual image size
            let centerX = headX * image.naturalWidth;
            let centerY = headY * image.naturalHeight;

            // We want the head to be in the center, so subtract half the target size
            // Adjust '- 30' or similar if you want the head slightly higher/lower
            let srcX = centerX - (targetSize / 2);
            let srcY = centerY - (targetSize / 2);

            // 3. Draw ONLY the cropped part
            context.drawImage(image, srcX, srcY, targetSize, targetSize, 0, 0, targetSize, targetSize);

            // 4. Convert to Base64
            var base64Full = canvas.toDataURL("image/jpeg", 0.9);
            var base64Body = base64Full.replace(/^data:image\/\w+;base64,/, '');

            // 5. Start Upload (Keep your existing chunk logic)
            startUpload(base64Body);
        };

        image.src = imgURL + '?t=' + Date.now();
    }

    function startUpload(base64Body) {
        if (!base64Body) return;
        
        const CHUNK_SIZE = 4096;
        const BURST_SIZE = 10; 
        const totalChunks = Math.ceil(base64Body.length / CHUNK_SIZE);

        mp.trigger("client:mugshot:startUpload", totalChunks);

        let currentChunk = 0;
        if (uploadInterval) clearInterval(uploadInterval);

        uploadInterval = setInterval(() => {
            for (let i = 0; i < BURST_SIZE; i++) {
                if (currentChunk >= totalChunks) {
                    clearInterval(uploadInterval);
                    mp.trigger("client:mugshot:uploadComplete");
                    return;
                }
                const start = currentChunk * CHUNK_SIZE;
                const end   = start + CHUNK_SIZE;
                const chunk = base64Body.substring(start, end);
                mp.trigger("client:mugshot:sendChunk", chunk, currentChunk);
                currentChunk++;
            }
        }, 20);
    }
</script>
</body>
</html>
