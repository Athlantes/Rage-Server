<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RPGOS Mobile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div id="app"></div>

  <!--
    Load order:
      1. Vue 3 global build
      2. Components (each defines a global const, no modules)
      3. app.js — creates & mounts the Vue app
  -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <!-- System / Shell -->
  <script src="components/ConfirmModal.js"></script>
  <script src="components/ToastShell.js"></script>
  <script src="components/LockScreen.js"></script>
  <script src="components/HomeScreen.js"></script>

  <!-- Phone App -->
  <script src="components/PhoneApp.js"></script>
  <script src="components/ChatThread.js"></script>
  <script src="components/ContactEdit.js"></script>

  <!-- Other Apps -->
  <script src="components/MailApp.js"></script>
  <script src="components/MailDetail.js"></script>
  <script src="components/VehiclesApp.js"></script>
  <script src="components/VehicleDetail.js"></script>
  <script src="components/BankApp.js"></script>
  <script src="components/SettingsApp.js"></script>
  <script src="components/WallpaperPicker.js"></script>
  <script src="components/GalleryApp.js"></script>
  <script src="components/PhotoDetail.js"></script>
  <script src="components/QuickEatsApp.js"></script>
  <script src="components/EScootrApp.js"></script>

  <script src="app.js"></script>

</body>
</html>
