<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPGOS Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>
    
    <!-- Vue 3 from CDN -->
    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
    
    <!-- Main App Script -->
    <script src="app.js"></script>
    
    <!-- Debug initialization -->
    <script>
        console.log('Phone UI loaded');
        console.log('Vue available:', typeof Vue !== 'undefined');
        console.log('App mounted:', document.getElementById('app').innerHTML !== '');
        
        // Test function for debugging
        window.testPhone = function() {
            console.log('Testing phone...');
            if (typeof openPhone === 'function') {
                openPhone();
                console.log('openPhone() called');
            } else {
                console.error('openPhone() not defined!');
            }
        };
    </script>
</body>
</html>
