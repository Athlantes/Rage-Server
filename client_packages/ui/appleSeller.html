<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            background: rgba(0, 0, 0, 0.8);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            color: white;
        }

        .container {
            background: #2b1d1d;
            border-top: 5px solid #6b8c42; /* Green for farming */
            padding: 0;
            width: 500px;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            text-align: center;
        }
        .header h2 { margin: 0; color: #8fbc5a; text-transform: uppercase; letter-spacing: 2px; }
        .header .subtitle { font-size: 12px; color: #aaaaaa; text-transform: uppercase; margin-top: 5px; }

        .item-list {
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .item-row {
            background: rgba(255,255,255,0.05);
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .item-row:hover { background: rgba(255,255,255,0.08); }

        .item-info { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; font-size: 16px; color: #eee; }
        .item-stock { font-size: 12px; color: #888; }
        
        .item-price { color: #8fbc5a; font-weight: bold; margin-right: 15px; }

        .actions { display: flex; gap: 5px; }
        
        input {
            width: 60px; padding: 8px; background: rgba(0,0,0,0.3); border: 1px solid #444;
            color: white; text-align: center; border-radius: 4px; outline: none;
        }
        
        button {
            border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px;
            font-weight: bold; text-transform: uppercase; font-size: 11px;
        }

        .btn-sell { background: #6b8c42; color: white; }
        .btn-sell:hover { background: #7ca34c; }
        .btn-sell:active { transform: scale(0.98); }

        .btn-all { background: #444; color: #ccc; }
        .btn-all:hover { background: #555; color: white; }

        .footer {
            padding: 15px;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }
        .btn-close {
            background: transparent; color: #888; border: none; font-size: 12px;
        }
        .btn-close:hover { color: white; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Farm Wholesaler</h2>
            <div class="subtitle">Fresh Produce Market</div>
        </div>

        <div class="item-list" id="list">
            <div style="text-align:center; padding: 20px; color:#666;">Loading items...</div>
        </div>

        <div class="footer">
            <button class="btn-close" onclick="closeUI()">Close Market</button>
        </div>
    </div>

    <script>
        function notifyReady() {
            if (window.mp) {
                mp.trigger("client:farmer:browserReady");
            } else {
                setTimeout(notifyReady, 50);
            }
        }
        document.addEventListener("DOMContentLoaded", notifyReady);

        function loadItems(jsonString) {
            const list = document.getElementById('list');
            list.innerHTML = '';

            try {
                const items = JSON.parse(jsonString);

                if(items.length === 0) {
                    list.innerHTML = '<div style="text-align:center; padding: 20px; color:#666;">We are not buying anything right now.</div>';
                    return;
                }

                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'item-row';
                    
                    div.innerHTML = `
                        <div class="item-info">
                            <span class="item-name">${item.label}</span>
                            <span class="item-stock">Available: ${item.count}</span>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <span class="item-price">$${item.price}</span>
                            <div class="actions">
                                <input type="number" id="inp-${item.id}" value="1" min="1" max="${item.count}">
                                <button class="btn-sell" onclick="sell('${item.id}')">Sell</button>
                                <button class="btn-all" onclick="sellAll('${item.id}', ${item.count})">All</button>
                            </div>
                        </div>
                    `;
                    list.appendChild(div);
                });

            } catch(e) {
                console.error("Error parsing items", e);
                list.innerHTML = '<div style="color:red; text-align:center;">Error loading market data.</div>';
            }
        }

        function sell(id) {
            const inp = document.getElementById('inp-' + id);
            const val = parseInt(inp.value);
            if(val > 0 && 'mp' in window) {
                mp.trigger('client:farmer:sellAction', id, val);
            }
        }

        function sellAll(id, max) {
            if(max > 0 && 'mp' in window) {
                mp.trigger('client:farmer:sellAction', id, max);
            }
        }

        function closeUI() {
            if('mp' in window) mp.trigger('client:farmer:closeMenu');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeUI();
        });
    </script>
</body>
</html>
