<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            background: rgba(0, 0, 0, 0.85);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            color: white;
        }

        .container {
            background: #1a0f0f;
            border-top: 4px solid #ff4d4d;
            padding: 30px;
            width: 380px;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            text-align: center;
        }

        h2 { color: #ff4d4d; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { font-size: 11px; color: #aaaaaa; text-transform: uppercase; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }

        .stats { display: flex; justify-content: space-between; margin-bottom: 15px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 4px; font-size: 13px; }
        .highlight { color: #ff4d4d; font-weight: bold; }

        input {
            width: 100%; box-sizing: border-box; padding: 15px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            color: white; font-size: 24px; font-weight: bold; text-align: center;
            margin-bottom: 20px; outline: none; border-radius: 4px;
        }
        input:focus { border-color: #ff4d4d; }

        .btn-confirm {
            width: 100%; background: #ff4d4d; color: white; border: none;
            padding: 14px; font-size: 14px; font-weight: 800; text-transform: uppercase;
            border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        .btn-confirm:hover { background: #ff6666; }
        
        .btn-close {
            background: transparent; color: #aaaaaa; border: none;
            margin-top: 15px; font-size: 11px; text-transform: uppercase; cursor: pointer;
        }
        .btn-close:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 32px; margin-bottom: 10px;">🍎</div>
        <h2>Orchard Wholesaler</h2>
        <div class="subtitle">Sell your fresh harvest</div>

        <div class="stats">
            <div>Inventory: <span id="max-count" class="highlight">0</span></div>
            <div>Price: <span class="highlight">$<span id="price">0</span></span></div>
        </div>

        <input type="number" id="amount" placeholder="0" min="1">

        <button class="btn-confirm" onclick="submit()">SELL APPLES</button>
        <button class="btn-close" onclick="closeUI()">Cancel</button>
    </div>

    <script>
        function notifyReady() {
            if (window.mp) {
                mp.trigger("client:farmer:browserReady");
            } else {
                // If RAGE isn't injected yet, try again in 20ms
                setTimeout(notifyReady, 20);
            }
        }
    
        // Start checking as soon as the page loads
        document.addEventListener("DOMContentLoaded", notifyReady);
        
        function updateInfo(max, price) {
            document.getElementById('max-count').innerText = max;
            document.getElementById('price').innerText = price;
            document.getElementById('amount').value = max; // Auto-fill max
            document.getElementById('amount').focus();
        }

        function submit() {
            const val = document.getElementById('amount').value;
            if(val > 0 && 'mp' in window) {
                mp.trigger('client:submitAppleSale', val);
            }
        }

        function closeUI() {
            if('mp' in window) mp.trigger('client:closeAppleBrowser');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submit();
            if (e.key === 'Escape') closeUI();
        });
    </script>
</body>
</html>
