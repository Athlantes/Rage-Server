<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Workbench</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
    --primary:#f39c12;--danger:#ff4757;--success:#2ecc71;
    --bg:rgba(10,12,18,.96);--border:rgba(255,255,255,.08);
    --text:#e8e8e8;--text-dim:#8a8fa6;--glass:rgba(255,255,255,.03);
    --r-common:#a0a0a0;--r-uncommon:#2ecc71;--r-rare:#3498db;--r-epic:#9b59b6;--r-legendary:#f1c40f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:transparent;color:var(--text);overflow:hidden;width:100vw;height:100vh;user-select:none}

/* ── LAYOUT ── */
.wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1000px;height:640px;display:flex;gap:16px}

/* Left column: tabs + list */
.left{width:310px;display:flex;flex-direction:column;gap:10px}

/* Category tabs */
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--glass);color:var(--text-dim);transition:.15s}
.tab:hover{background:rgba(255,255,255,.06)}
.tab.active{background:rgba(243,156,18,.15);border-color:var(--primary);color:var(--primary)}

/* Recipe list */
.list-panel{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.list-search{padding:10px 12px;border-bottom:1px solid var(--border)}
.list-search input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-size:12px;outline:none;font-family:inherit}
.list-search input::placeholder{color:var(--text-dim)}
.recipe-list{flex:1;overflow-y:auto;padding:6px}
.recipe-list::-webkit-scrollbar{width:3px}
.recipe-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.recipe-btn{padding:10px 12px;border-radius:7px;background:var(--glass);border:1px solid transparent;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.recipe-btn:hover{background:rgba(255,255,255,.05)}
.recipe-btn.active{background:rgba(243,156,18,.12);border-color:var(--primary)}
.rb-left{display:flex;flex-direction:column;gap:1px}
.rb-name{font-size:12px;font-weight:600;color:#fff}
.rb-sub{font-size:10px;color:var(--text-dim)}
.rb-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15);flex-shrink:0}
.rb-dot.ready{background:var(--success);box-shadow:0 0 6px var(--success)}

/* Right column: detail */
.right{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:0;position:relative;overflow:hidden}
.no-sel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-dim)}
.no-sel-icon{font-size:36px;opacity:.3}
.no-sel-text{font-size:13px;font-style:italic}

/* Detail header */
.detail-header{margin-bottom:18px}
.d-name{font-size:22px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px}
.d-rarity-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px}
.d-desc{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.5}

/* Requirements */
.req-box{background:rgba(0,0,0,.25);border-radius:8px;padding:14px 16px;border:1px solid var(--border);margin-bottom:16px}
.req-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:10px}
.req-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12px}
.req-row:last-child{margin-bottom:0}
.req-item-name{color:#fff;display:flex;align-items:center;gap:8px}
.req-item-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.req-val{font-weight:700}
.req-val.ok{color:var(--success)}
.req-val.bad{color:var(--danger)}
.cost-sep{border-top:1px solid var(--border);margin:10px 0 8px}
.cost-row{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.cost-val{color:var(--primary)}
.cost-val.bad{color:var(--danger)}

/* Chance + boost */
.meta-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:8px 12px;background:var(--glass);border-radius:6px;margin-bottom:10px}
.meta-label{color:var(--text-dim)}
.meta-val{font-weight:700}
.boost-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-dim);cursor:pointer;margin-bottom:16px}
.boost-row input{cursor:pointer;accent-color:var(--primary)}
.boost-extra{margin-left:auto;color:var(--primary);font-size:10px;font-weight:700}

/* Actions */
.actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.prog-wrap{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;opacity:0;transition:opacity .3s}
.prog-bar{height:100%;width:0%;background:var(--primary);border-radius:3px;transition:width .1s linear;box-shadow:0 0 8px var(--primary)}
.craft-btn{width:100%;padding:13px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-family:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.8px;font-size:13px;cursor:pointer;transition:.2s}
.craft-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.craft-btn:active{transform:translateY(0)}
.craft-btn:disabled{background:#2a2a2a;color:#555;cursor:not-allowed;transform:none;filter:none}

/* Toast */
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.92);border:1px solid var(--border);padding:12px 22px;border-radius:8px;font-size:12px;display:none;text-align:center;white-space:pre-line;z-index:100;min-width:240px}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.fail{border-color:var(--danger);color:var(--danger)}

/* Rarity colours */
.rarity-common{color:var(--r-common)}.rarity-uncommon{color:var(--r-uncommon)}
.rarity-rare{color:var(--r-rare)}.rarity-epic{color:var(--r-epic)}.rarity-legendary{color:var(--r-legendary)}
.bg-common{background:rgba(160,160,160,.15);color:var(--r-common)}
.bg-uncommon{background:rgba(46,204,113,.15);color:var(--r-uncommon)}
.bg-rare{background:rgba(52,152,219,.15);color:var(--r-rare)}
.bg-epic{background:rgba(155,89,182,.15);color:var(--r-epic)}
.bg-legendary{background:rgba(241,196,15,.15);color:var(--r-legendary)}


    /* ── Item images ── */
    .item-img-wrap {
        width: 32px; height: 32px; border-radius: 5px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(255,255,255,.05); position: relative;
    }
    .item-img-wrap img { width: 24px; height: 24px; object-fit: contain; }
    .rar-common    { box-shadow: inset 0 0 0 1px #a0a0a0; }
    .rar-uncommon  { box-shadow: inset 0 0 0 1px #2ecc71, 0 0 5px rgba(46,204,113,.3); }
    .rar-rare      { box-shadow: inset 0 0 0 1px #3498db, 0 0 5px rgba(52,152,219,.35); }
    .rar-epic      { box-shadow: inset 0 0 0 1px #9b59b6, 0 0 6px rgba(155,89,182,.4); }
    .rar-legendary { box-shadow: inset 0 0 0 1px #f1c40f, 0 0 8px rgba(241,196,15,.5); }
    .rb-icon { width: 30px; height: 30px; border-radius: 4px; object-fit: contain; flex-shrink: 0; background: rgba(255,255,255,.04); padding: 3px; }

    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .2s ease both}
</style>
</head>
<body>

<button onclick="closeUI()" style="position:absolute;top:14px;right:14px;width:30px;height:30px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:6px;cursor:pointer;font-size:14px;z-index:200">×</button>

<div class="wrap">
    <!-- LEFT: tabs + recipe list -->
    <div class="left">
        <div class="tabs" id="tabBar"></div>
        <div class="list-panel">
            <div class="list-search">
                <input type="text" id="searchInput" placeholder="Search components..." oninput="filterList()">
            </div>
            <div class="recipe-list" id="recipeList"></div>
        </div>
    </div>

    <!-- RIGHT: detail -->
    <div class="right" id="rightPanel">
        <div class="no-sel" id="noSel">
            <div class="no-sel-icon">🛠</div>
            <div class="no-sel-text">Select a component to craft</div>
        </div>

        <div id="detailContent" style="display:none;flex-direction:column;height:100%">
            <div class="detail-header fade">
                <div class="d-name" id="dName">
                    <span id="dNameText"></span>
                    <span class="d-rarity-badge" id="dRarityBadge"></span>
                </div>
                <div class="d-desc" id="dDesc"></div>
            </div>

            <div class="req-box fade">
                <div class="req-title">Required Materials</div>
                <div id="reqList"></div>
                <div class="cost-sep"></div>
                <div class="cost-row">
                    <span>Workshop Fee</span>
                    <span id="dCost" class="cost-val">$0</span>
                </div>
            </div>

            <div class="meta-row fade">
                <span class="meta-label">Base Success Rate</span>
                <span class="meta-val" id="dChance">75%</span>
            </div>

            <label class="boost-row fade">
                <input type="checkbox" id="boostCheck" onchange="updateCostDisplay()">
                <span>Precision Tools (+$<span id="boostPrice">0</span>)</span>
                <span class="boost-extra">+15% Chance</span>
            </label>

            <div class="actions">
                <div class="prog-wrap" id="progWrap">
                    <div class="prog-bar" id="progBar"></div>
                </div>
                <button class="craft-btn" id="craftBtn" onclick="startCrafting()">Construct</button>
            </div>

            <div class="toast" id="toast"></div>
        </div>
    </div>
</div>

<script>
// ── State ──
var recipes = [], playerInfo = {}, selId = null, isCrafting = false;
var activeTab = 'all', searchVal = '';

var CATS = {
    all:       { icon:'🔍', label:'All' },
    power:     { icon:'🔧', label:'Power' },
    drivetrain:{ icon:'⚙️', label:'Drivetrain' },
    handling:  { icon:'🛞', label:'Handling' },
    chassis:   { icon:'🛡️', label:'Chassis' },
    special:   { icon:'⭐', label:'Special' }
};

// ── Entry point ──
function initCrafting(recData, pInfo) {
    recipes    = recData;
    playerInfo = pInfo;
    isCrafting = false;
    document.getElementById('craftBtn').disabled = false;
    document.getElementById('progWrap').style.opacity = '0';
    buildTabs();
    renderList();
    if (selId) selectRecipe(selId);
}

// ── Tabs ──
function buildTabs() {
    var bar = document.getElementById('tabBar');
    bar.innerHTML = '';
    Object.keys(CATS).forEach(function(k) {
        var c = CATS[k];
        // Count craftable in this tab
        var list = k === 'all' ? recipes : recipes.filter(function(r){ return r.category === k; });
        var ready = list.filter(function(r){ return r.canCraft; }).length;
        var btn = document.createElement('div');
        btn.className = 'tab' + (k === activeTab ? ' active' : '');
        btn.textContent = c.icon + ' ' + c.label + (ready > 0 ? ' (' + ready + ')' : '');
        btn.onclick = function(){ activeTab = k; buildTabs(); renderList(); };
        bar.appendChild(btn);
    });
}

// ── List ──
function filterList() {
    searchVal = document.getElementById('searchInput').value.toLowerCase();
    renderList();
}

function renderList() {
    var list = document.getElementById('recipeList');
    list.innerHTML = '';
    var filtered = recipes.filter(function(r) {
        var catMatch = activeTab === 'all' || r.category === activeTab;
        var searchMatch = !searchVal || r.name.toLowerCase().includes(searchVal);
        return catMatch && searchMatch;
    });

    if (!filtered.length) {
        list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:12px">No components found</div>';
        return;
    }

    // Group by rarity
    var order = ['common','uncommon','rare','epic','legendary'];
    var groups = {};
    filtered.forEach(function(r) {
        if (!groups[r.rarity]) groups[r.rarity] = [];
        groups[r.rarity].push(r);
    });

    order.forEach(function(rar) {
        if (!groups[rar] || !groups[rar].length) return;
        // Rarity header
        var hdr = document.createElement('div');
        hdr.style.cssText = 'padding:6px 8px 3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:4px';
        hdr.className = 'rarity-' + rar;
        hdr.textContent = rar;
        list.appendChild(hdr);

        groups[rar].forEach(function(r) {
            var btn = document.createElement('div');
            btn.className = 'recipe-btn' + (r.id === selId ? ' active' : '');
            var compType = r.id.replace(/_(?:common|uncommon|rare|epic|legendary)$/, '');
            btn.innerHTML =
                '<img class="rb-icon rar-' + r.rarity + '" src="../items/' + compType + '.png" onerror="this.src='../items/default.png'">'
                + '<div class="rb-left">'
                + '<span class="rb-name">' + r.name + '</span>'
                + '<span class="rb-sub rarity-' + r.rarity + '">' + r.rarity + '</span>'
                + '</div>'
                + '<div class="rb-dot' + (r.canCraft ? ' ready' : '') + '"></div>';
            btn.onclick = function(){ selectRecipe(r.id); };
            list.appendChild(btn);
        });
    });
}

// ── Detail ──
function selectRecipe(id) {
    if (isCrafting) return;
    selId = id;
    var r = recipes.find(function(x){ return x.id === id; });
    if (!r) return;

    // Update list selection
    document.querySelectorAll('.recipe-btn').forEach(function(el){
        el.classList.remove('active');
        if (el.querySelector('.rb-name') && el.querySelector('.rb-name').textContent === r.name
            && el.querySelector('.rb-sub') && el.querySelector('.rb-sub').textContent === r.rarity) {
            el.classList.add('active');
        }
    });

    document.getElementById('noSel').style.display = 'none';
    var dc = document.getElementById('detailContent');
    dc.style.display = 'flex';

    document.getElementById('dNameText').textContent = r.name;
    var badge = document.getElementById('dRarityBadge');
    badge.textContent = r.rarity;
    badge.className = 'd-rarity-badge bg-' + r.rarity;
    document.getElementById('dDesc').textContent = r.description;

    // Requirements
    var rl = document.getElementById('reqList');
    rl.innerHTML = '';
    r.inputs.forEach(function(inp) {
        var ok = inp.playerHas >= inp.count;
        // Detect rarity from item name
        var rarityClue = 'common';
        ['legendary','epic','rare','uncommon'].forEach(function(rv){
            if (inp.itemId && inp.itemId.endsWith('_'+rv)) rarityClue = rv;
        });
        var compBase = inp.itemId.replace(/_(?:common|uncommon|rare|epic|legendary)$/, '');
        rl.innerHTML +=
            '<div class="req-row">'
            + '<span class="req-item-name">'
            + '<div class="item-img-wrap rar-' + rarityClue + '">'
            + '<img src="../items/' + compBase + '.png" onerror="this.src='../items/default.png'">'
            + '</div>'
            + inp.name + '</span>'
            + '<span class="req-val ' + (ok?'ok':'bad') + '">'
            + inp.playerHas + ' / ' + inp.count
            + '</span></div>';
    });

    document.getElementById('boostPrice').textContent = r.boostCost.toLocaleString();
    document.getElementById('boostCheck').checked = false;
    updateCostDisplay();
}

function updateCostDisplay() {
    var r = recipes.find(function(x){ return x.id === selId; });
    if (!r) return;
    var boost      = document.getElementById('boostCheck').checked;
    var totalCost  = r.cost + (boost ? r.boostCost : 0);
    var finalChance= Math.min(100, r.baseChance + (boost ? 15 : 0));

    var ce = document.getElementById('dCost');
    ce.textContent = '$' + totalCost.toLocaleString();
    ce.className   = 'cost-val' + (playerInfo.cash >= totalCost ? '' : ' bad');

    var che = document.getElementById('dChance');
    che.textContent = finalChance + '%';
    che.style.color = finalChance >= 80 ? 'var(--success)' : finalChance >= 50 ? 'var(--primary)' : 'var(--danger)';

    var btn = document.getElementById('craftBtn');
    var hasAll = r.inputs.every(function(i){ return i.playerHas >= i.count; });
    if (!hasAll) {
        btn.disabled = true; btn.textContent = 'Missing Materials';
    } else if (playerInfo.cash < totalCost) {
        btn.disabled = true; btn.textContent = 'Insufficient Cash';
    } else {
        btn.disabled = false; btn.textContent = 'Construct';
    }
}

// ── Craft ──
function startCrafting() {
    if (isCrafting || !selId) return;
    isCrafting = true;

    var btn  = document.getElementById('craftBtn');
    var wrap = document.getElementById('progWrap');
    var bar  = document.getElementById('progBar');
    btn.disabled  = true;
    btn.textContent = 'Working...';
    wrap.style.opacity = '1';
    bar.style.width = '0%';
    setTimeout(function(){ bar.style.width = '100%'; }, 50);

    setTimeout(function() {
        var boost = document.getElementById('boostCheck').checked;
        try { mp.trigger('client:crafting:tryCraft', selId, boost); } catch(e) {}
    }, 2050);
}

function showResult(success, message) {
    var t = document.getElementById('toast');
    t.textContent = message;
    t.className   = 'toast ' + (success ? 'success' : 'fail');
    t.style.display = 'block';
    document.getElementById('progWrap').style.opacity = '0';
    document.getElementById('progBar').style.width    = '0%';
    setTimeout(function(){ t.style.display = 'none'; }, 4000);
}

function closeUI() {
    try { mp.trigger('client:crafting:close'); } catch(e) {}
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeUI();
});
</script>
</body>
</html>
