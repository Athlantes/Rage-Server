<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Workbench</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ... (Previous CSS remains same, add these new classes) ... */
:root {
    --primary: #f39c12;
    --primary-dim: #d35400;
    --danger: #ff4757;
    --success: #2ecc71;
    --bg: rgba(10, 12, 18, 0.95);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8e8e8;
    --text-dim: #8a8fa6;
    --glass: rgba(255, 255, 255, 0.03);
    /* Rarities */
    --r-common: #a0a0a0; --r-uncommon: #2ecc71; --r-rare: #3498db; --r-epic: #9b59b6; --r-legendary: #f1c40f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; background: transparent; color: var(--text); overflow: hidden; width: 100vw; height: 100vh; user-select: none; }

.container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 900px; height: 600px; display: flex; gap: 20px; }
.left-panel { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; animation: fadeRight 0.3s ease both; }
.panel-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.panel-title { font-size: 18px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
.recipe-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.recipe-list::-webkit-scrollbar { width: 4px; }
.recipe-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.recipe-btn { padding: 15px; border-radius: 8px; background: var(--glass); border: 1px solid transparent; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
.recipe-btn:hover { background: rgba(255,255,255,0.06); }
.recipe-btn.active { background: rgba(243, 156, 18, 0.15); border-color: var(--primary); }
.rb-info { display: flex; flex-direction: column; gap: 2px; }
.rb-name { font-size: 13px; font-weight: 600; color: #fff; }
.rb-rarity { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
.rb-status { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.rb-status.can-craft { background: var(--success); box-shadow: 0 0 8px var(--success); }

/* Right Panel */
.right-panel { width: 350px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px; animation: fadeLeft 0.3s ease 0.1s both; position: relative; }
.detail-header { text-align: center; }
.detail-name { font-size: 20px; font-weight: 700; color: #fff; }
.detail-desc { font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }
.req-section { flex: 1; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 15px; border: 1px solid var(--border); }
.req-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; letter-spacing: 1px; }
.req-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
.req-name { color: #fff; }
.req-val { font-weight: 600; color: var(--text-dim); }
.req-val.ok { color: var(--success); }
.req-val.bad { color: var(--danger); }
.cost-row { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
.cost-val { color: var(--primary); }
.cost-val.bad { color: var(--danger); }

/* --- NEW: Progress Bar --- */
.progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 10px; opacity: 0; transition: opacity 0.3s; }
.progress-bar { width: 0%; height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.1s linear; box-shadow: 0 0 10px var(--primary); }

/* --- NEW: Chance & Boost --- */
.chance-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 6px; }
.chance-label { color: var(--text-dim); }
.chance-val { font-weight: 700; color: var(--text); }
.boost-toggle { display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer; font-size: 11px; color: var(--text-dim); user-select: none; }
.boost-toggle input { cursor: pointer; }
.boost-info { font-size: 10px; color: var(--primary); margin-left: auto; }

.actions { margin-top: auto; display: flex; flex-direction: column; }
.craft-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-family: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
.craft-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
.craft-btn:active { transform: translateY(0); }
.craft-btn:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; filter: none; }

/* Result Overlay (Toast) */
.result-toast {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.9); border: 1px solid var(--border);
    padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 12px;
    display: none; text-align: center; white-space: pre-line; z-index: 100;
}
.result-toast.success { border-color: var(--success); color: var(--success); }
.result-toast.fail { border-color: var(--danger); color: var(--danger); }

/* Utilities */
.rarity-common { color: var(--r-common); } .rarity-uncommon { color: var(--r-uncommon); }
.rarity-rare { color: var(--r-rare); } .rarity-epic { color: var(--r-epic); } .rarity-legendary { color: var(--r-legendary); }
@keyframes fadeRight { from { opacity:0; transform: translateX(-20px); } to { opacity:1; transform: translateX(0); } }
@keyframes fadeLeft { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }
</style>
</head>
<body>
    <button class="close-btn" onclick="closeUI()" style="position:absolute; top:20px; right:20px; width:32px; height:32px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:6px; cursor:pointer;">×</button>

    <div class="container">
        <div class="left-panel">
            <div class="panel-header">
                <div class="panel-title"><i>🛠</i> Workbench</div>
                <div style="font-size:12px; color:var(--success); font-weight:600;">Cash: $<span id="playerCash">0</span></div>
            </div>
            <div class="recipe-list" id="recipeList"></div>
        </div>

        <div class="right-panel">
            <div id="detailContent" style="display:none; flex-direction:column; height:100%;">
                <div class="detail-header">
                    <div class="detail-name" id="dName">Item Name</div>
                    <div class="detail-desc" id="dDesc">Desc...</div>
                </div>

                <div class="req-section">
                    <div class="req-title">Requirements</div>
                    <div id="reqList"></div>
                    
                    <div class="chance-row">
                        <span class="chance-label">Success Rate</span>
                        <span class="chance-val" id="dChance">75%</span>
                    </div>

                    <label class="boost-toggle">
                        <input type="checkbox" id="boostCheck" onchange="updateCostDisplay()">
                        <span>Precision Tools (+$<span id="boostPrice">0</span>)</span>
                        <span class="boost-info">+15% Chance</span>
                    </label>

                    <div class="cost-row">
                        <span>Total Cost</span>
                        <span id="dCost" class="cost-val">$0</span>
                    </div>
                </div>

                <div class="actions">
                    <div class="progress-container" id="progCont">
                        <div class="progress-bar" id="progBar"></div>
                    </div>
                    <button class="craft-btn" id="craftBtn" onclick="startCrafting()">Construct</button>
                </div>
                
                <div id="resultToast" class="result-toast"></div>
            </div>
            
            <div id="noSelection" style="height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-style:italic;">
                Select a blueprint
            </div>
        </div>
    </div>

<script>
let recipes = [];
let playerInfo = {};
let selectedRecipeId = null;
let isCrafting = false;

function initCrafting(recData, pInfo) {
    recipes = recData;
    playerInfo = pInfo;
    document.getElementById('playerCash').textContent = playerInfo.cash.toLocaleString();
    renderList();
    if (selectedRecipeId) selectRecipe(selectedRecipeId);
    
    // Reset UI state
    isCrafting = false;
    document.getElementById('craftBtn').disabled = false;
    document.getElementById('progCont').style.opacity = '0';
}

function renderList() {
    const container = document.getElementById('recipeList');
    container.innerHTML = '';
    recipes.forEach(r => {
        const div = document.createElement('div');
        div.className = `recipe-btn ${selectedRecipeId === r.id ? 'active' : ''}`;
        div.onclick = () => selectRecipe(r.id);
        div.innerHTML = `
            <div class="rb-info">
                <span class="rb-name">${r.name}</span>
                <span class="rb-rarity rarity-${r.rarity}">${r.rarity}</span>
            </div>
            <div class="rb-status ${r.canCraft ? 'can-craft' : ''}"></div>
        `;
        container.appendChild(div);
    });
}

function selectRecipe(id) {
    if (isCrafting) return;
    selectedRecipeId = id;
    const r = recipes.find(x => x.id === id);
    if (!r) return;

    document.querySelectorAll('.recipe-btn').forEach((el, idx) => el.classList.toggle('active', recipes[idx].id === id));
    document.getElementById('noSelection').style.display = 'none';
    document.getElementById('detailContent').style.display = 'flex';
    document.getElementById('dName').textContent = r.name;
    document.getElementById('dDesc').textContent = r.description;
    
    const reqList = document.getElementById('reqList');
    reqList.innerHTML = '';
    r.inputs.forEach(input => {
        const hasEnough = input.playerHas >= input.count;
        reqList.innerHTML += `
            <div class="req-row"><span class="req-name">${input.name}</span><span class="req-val ${hasEnough ? 'ok' : 'bad'}">${input.playerHas} / ${input.count}</span></div>
        `;
    });

    // Update Boost UI
    document.getElementById('boostPrice').textContent = r.boostCost.toLocaleString();
    document.getElementById('boostCheck').checked = false; // Reset checkbox on switch
    
    updateCostDisplay();
}

function updateCostDisplay() {
    const r = recipes.find(x => x.id === selectedRecipeId);
    if (!r) return;

    const useBoost = document.getElementById('boostCheck').checked;
    const totalCost = r.cost + (useBoost ? r.boostCost : 0);
    const finalChance = Math.min(100, r.baseChance + (useBoost ? r.boostAmount : 0));

    // Update Cost
    const costEl = document.getElementById('dCost');
    costEl.textContent = '$' + totalCost.toLocaleString();
    costEl.className = playerInfo.cash >= totalCost ? 'cost-val' : 'cost-val bad';

    // Update Chance
    const chanceEl = document.getElementById('dChance');
    chanceEl.textContent = finalChance + '%';
    chanceEl.style.color = finalChance >= 80 ? 'var(--success)' : (finalChance >= 50 ? 'var(--primary)' : 'var(--danger)');

    // Update Button
    const btn = document.getElementById('craftBtn');
    if (!r.canCraft) {
        btn.disabled = true;
        btn.textContent = "Insufficient Resources";
    } else if (playerInfo.cash < totalCost) {
        btn.disabled = true;
        btn.textContent = "Insufficient Cash";
    } else {
        btn.disabled = false;
        btn.textContent = "Construct";
    }
}

function startCrafting() {
    if (isCrafting || !selectedRecipeId) return;
    isCrafting = true;

    // UI Feedback
    const btn = document.getElementById('craftBtn');
    btn.disabled = true;
    btn.textContent = "Tinkering...";
    
    // Progress Bar Animation
    const barCont = document.getElementById('progCont');
    const bar = document.getElementById('progBar');
    barCont.style.opacity = '1';
    bar.style.width = '0%';

    // Animate width to 100% over 2 seconds
    setTimeout(() => { bar.style.width = '100%'; }, 50);

    setTimeout(() => {
        // Send to server
        const useBoost = document.getElementById('boostCheck').checked;
        try { mp.trigger('client:crafting:tryCraft', selectedRecipeId, useBoost); } catch(e) {}
        
        // Note: isCrafting stays true until server replies and triggers initCrafting, or we get a result event
    }, 2050);
}

function showResult(success, message) {
    const toast = document.getElementById('resultToast');
    toast.textContent = message;
    toast.className = `result-toast ${success ? 'success' : 'fail'}`;
    toast.style.display = 'block';

    // Hide progress bar
    document.getElementById('progCont').style.opacity = '0';
    document.getElementById('progBar').style.width = '0%';

    setTimeout(() => {
        toast.style.display = 'none';
    }, 4000);
}

function closeUI() {
    try { mp.trigger('client:crafting:close'); } catch(e) {}
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeUI();
});
</script>
</body>
</html>
