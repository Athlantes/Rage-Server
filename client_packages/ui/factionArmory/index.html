<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faction Armory</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; color: #e0e0e0;
  }
  .panel {
    background: linear-gradient(160deg, #0d1117 0%, #161b22 100%);
    border: 1px solid #30363d;
    border-radius: 12px;
    width: 400px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  .header {
    padding: 18px 20px;
    border-bottom: 1px solid #21262d;
    display: flex; align-items: center; gap: 10px;
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header .icon { font-size: 22px; }
  .loadout-list { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .loadout {
    padding: 14px 16px;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .loadout:hover { border-color: #58a6ff; background: #1c2230; }
  .loadout-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .loadout-weapons { font-size: 12px; color: #8b949e; }
  .loadout-cost { font-size: 12px; color: #3fb950; margin-top: 6px; font-weight: 600; }
  .loadout-cost.paid { color: #f85149; }
  .footer {
    padding: 14px 16px;
    border-top: 1px solid #21262d;
  }
  .btn-close {
    width: 100%;
    padding: 10px;
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #8b949e;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-close:hover { background: #30363d; color: #e6edf3; }
  .empty { text-align: center; color: #484f58; padding: 30px; font-size: 13px; }
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <div class="icon">🔫</div>
    <h1>Faction Armory</h1>
  </div>
  <div class="loadout-list" id="list">
    <div class="empty">Loading...</div>
  </div>
  <div class="footer">
    <button class="btn-close" onclick="close()">✕ Close</button>
  </div>
</div>
<script>
function loadLoadouts(loadouts) {
  const list = document.getElementById('list');
  if (!loadouts || !loadouts.length) {
    list.innerHTML = '<div class="empty">No loadouts available.</div>';
    return;
  }
  list.innerHTML = loadouts.map((l, i) => `
    <div class="loadout" onclick="equip(${i})">
      <div class="loadout-name">🎯 ${l.name}</div>
      <div class="loadout-weapons">${l.items.map(w => w.weapon.replace('WEAPON_','')).join(', ')}</div>
      <div class="loadout-cost ${l.cost > 0 ? 'paid' : ''}">${l.cost > 0 ? `Cost: $${l.cost.toLocaleString()}` : 'Free'}</div>
    </div>
  `).join('');
}

function equip(index) {
  mp.trigger('server:faction:armoryEquip', index);
  close();
}

function close() {
  mp.trigger('faction:armory:close');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
</script>
</body>
</html>
