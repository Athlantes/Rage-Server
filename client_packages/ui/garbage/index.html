<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitation Job</title>
    <link rel="stylesheet" href="../lib/leaflet/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; user-select: none; }
        .container { background: rgba(20, 20, 25, 0.95); width: 900px; height: 600px; border-radius: 10px; display: flex; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 1px solid #444; }
        .sidebar { width: 30%; background: rgba(30, 30, 35, 0.9); border-right: 1px solid #444; display: flex; flex-direction: column; }
        .header { padding: 20px; background: #f8b632; color: #111; font-weight: bold; text-align: center; text-transform: uppercase; }
        .route-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .route-item { background: #2a2a2e; color: #ccc; padding: 15px; margin-bottom: 8px; border-radius: 5px; cursor: pointer; border-left: 4px solid transparent; }
        .route-item:hover { background: #333; }
        .route-item.active { background: #383838; border-left: 4px solid #f8b632; color: white; }
        .content { width: 70%; position: relative; background: #141b2d; }
        #map { width: 100%; height: 100%; z-index: 1; background: #141b2d; }
        .btn-close { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); color: white; width: 30px; height: 30px; line-height: 30px; text-align: center; border-radius: 50%; cursor: pointer; z-index: 600; font-weight: bold; }
        .btn-close:hover { background: rgba(200, 50, 50, 0.8); }
        .job-overlay { position: absolute; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.85); padding: 20px; border-radius: 8px; color: white; border: 1px solid #f8b632; width: 250px; z-index: 500; }
        .btn-start { margin-top: 15px; background: #f8b632; color: #111; border: none; width: 100%; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .stat { display: flex; justify-content: space-between; margin: 5px 0; color: #aaa; }
        .stat span { color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="header">Available Routes</div>
            <div class="route-list" id="routeList"></div>
        </div>
        <div class="content">
            <div class="btn-close" onclick="closeMenu()">×</div>
            <div id="map"></div>
            <div id="details" class="job-overlay" style="display: none;">
                <h2 id="rTitle" style="margin:0 0 10px 0; color:#f8b632;">Select Route</h2>
                <div class="stat">Diff: <span id="rDiff">--</span></div>
                <div class="stat">Stops: <span id="rStops">--</span></div>
                <div class="stat">Pay: <span id="rPay">--</span></div>
                <div class="stat">Dist: <span id="rDist">--</span></div>
                <button class="btn-start" onclick="startJob()">Start Shift</button>
            </div>
        </div>
    </div>

    <script src="../lib/leaflet/leaflet.js"></script>

    <script>
        let map = null;
        let currentRouteLayer = null;
        let selectedRouteId = null;

        const CenterX = 59.5028;
        const CenterY = 119.3981;
        const ScaleX = 0.01443;
        const ScaleY = 0.01424;

        function initMap() {
            // 1. Define Coordinate System
            const CustomCRS = L.extend({}, L.CRS.Simple, {
                transformation: new L.Transformation(ScaleX, CenterX, -ScaleY, CenterY)
            });

            // 2. Initialize Map
            map = L.map('map', {
                crs: CustomCRS,
                minZoom: 2,
                maxZoom: 4,
                zoomControl: false,
                attributionControl: false,
                center: [0, 0],
                zoom: 3
            });

            // 3. Define Tile Layer using package://
            // Make sure your folder structure in client_packages matches this path exactly!
            const tilePath = 'package://ui/WebMap/images/map/{z}/{x}x{y}.png'; 

            const tileLayer = L.tileLayer(tilePath, {
                minZoom: 2,
                maxZoom: 4,
                tileSize: 256, 
                noWrap: true,
                tms: false 
            });

            // Debug errors if tiles are still missing
            tileLayer.on('tileerror', function(error, tile) {
                console.error("Tile Error (Check Path):", error.url);
            });

            tileLayer.addTo(map);

        }

        function loadRoutes(routesJson) {
            if (!map) initMap(); 

            const routes = JSON.parse(routesJson);
            const list = document.getElementById('routeList');
            list.innerHTML = '';

            routes.forEach((route, index) => {
                const div = document.createElement('div');
                div.className = 'route-item';
                div.innerText = route.name;
                div.onclick = () => selectRoute(div, route, index + 1);
                list.appendChild(div);
            });
        }

        function selectRoute(element, route, serverId) {
            document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('details').style.display = 'block';
            document.getElementById('rTitle').innerText = route.name;
            document.getElementById('rDiff').innerText = route.difficulty;
            document.getElementById('rStops').innerText = route.dumpsters.length + " Bins";
            document.getElementById('rPay').innerText = "$" + (route.estimatedPay || 0).toLocaleString();
            document.getElementById('rDist').innerText = (route.distance ? route.distance.toFixed(2) : "0.00") + " km";
            selectedRouteId = serverId;

            if (currentRouteLayer) map.removeLayer(currentRouteLayer);

            const mapPoints = route.dumpsters.map(d => [d.y, d.x]);
            const markers = [];
            
            markers.push(L.circleMarker(mapPoints[0], { color: '#00ff00', radius: 6 })); 
            
            route.dumpsters.forEach(d => {
                markers.push(L.circleMarker([d.y, d.x], { color: '#f8b632', fillColor: '#f8b632', fillOpacity: 0.8, radius: 4 }));
            });
            
            markers.push(L.polyline(mapPoints, { color: '#f8b632', weight: 3 }));

            currentRouteLayer = L.layerGroup(markers).addTo(map);
            map.fitBounds(L.polyline(mapPoints).getBounds(), { padding: [50, 50] });
        }

        function startJob() {
            if(selectedRouteId) mp.trigger('client:garbage:select', selectedRouteId);
        }
        function closeMenu() {
            mp.trigger('client:garbage:close');
        }

        setTimeout(initMap, 100);
    </script>
</body>
</html>
