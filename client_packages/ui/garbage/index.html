<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitation Job</title>
    <link rel="stylesheet" href="../lib/leaflet/leaflet.css" />

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .container {
            background: rgba(20, 20, 25, 0.95);
            width: 900px;
            height: 600px;
            border-radius: 10px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid #444;
        }

        /* Sidebar */
        .sidebar {
            width: 30%;
            background: rgba(30, 30, 35, 0.9);
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .header {
            padding: 20px;
            background: #f8b632;
            color: #111;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-align: center;
        }

        .route-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .route-list::-webkit-scrollbar { width: 5px; }
        .route-list::-webkit-scrollbar-track { background: #222; }
        .route-list::-webkit-scrollbar-thumb { background: #555; }

        .route-item {
            background: #2a2a2e;
            color: #ccc;
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .route-item:hover { background: #333; }
        .route-item.active {
            background: #383838;
            border-left: 4px solid #f8b632;
            color: #fff;
        }

        /* Map Area */
        .content {
            width: 70%;
            position: relative;
            display: flex;
            flex-direction: column;
            background-color: #141b2d;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #141b2d; 
        }

        .job-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 8px;
            color: white;
            border: 1px solid #f8b632;
            width: 250px;
            pointer-events: auto;
            z-index: 500;
        }

        .job-overlay h2 { margin: 0 0 10px 0; color: #f8b632; font-size: 1.5rem; }
        .stat { margin: 8px 0; font-size: 0.9rem; color: #aaa; display: flex; justify-content: space-between; }
        .stat span { color: white; font-weight: bold; }

        .btn-start {
            margin-top: 15px;
            background: #f8b632;
            color: #111;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 5px;
        }
        .btn-start:hover { background: #ffcc5c; }
        
        .btn-close {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.5); color: white;
            width: 30px; height: 30px; line-height: 30px;
            text-align: center; border-radius: 50%;
            cursor: pointer; z-index: 600; font-weight: bold;
        }
        .btn-close:hover { background: rgba(200, 50, 50, 0.8); }

        /* DEBUG IMAGE STYLE */
        #debug-img {
            position: absolute; top: 0; left: 0; width: 50px; height: 50px; 
            border: 2px solid red; z-index: 9999; display: none;
        }
    </style>
</head>
<body>

    <img id="debug-img" src="" alt="DEBUG" />

    <div class="container">
        <div class="sidebar">
            <div class="header">Garbage Routes</div>
            <div class="route-list" id="routeList"></div>
        </div>
        <div class="content">
            <div class="btn-close" onclick="closeMenu()">×</div>
            <div id="map"></div>
            <div id="details" class="job-overlay" style="display: none;">
                <h2 id="rTitle">Select Route</h2>
                <div class="stat">Difficulty <span id="rDiff">--</span></div>
                <div class="stat">Stops <span id="rStops">--</span></div>
                <div class="stat">Pay <span id="rPay">--</span></div>
                <div class="stat">Distance <span id="rDist">--</span></div>
                <button class="btn-start" onclick="startJob()">Start Shift</button>
            </div>
        </div>
    </div>

    <script src="../lib/leaflet/leaflet.js"></script>

    <script>
        let selectedRouteId = null;
        let map = null;
        let currentRouteLayer = null;

        // ✅ YOUR CALIBRATED VALUES
        const scale_x = 0.01175;
        const scale_y = -0.01549; 
        const center_x = 60.2;
        const center_y = -110;

        function initMap() {
            // Setup Map Projection
            const CustomCRS = L.extend({}, L.CRS.Simple, {
                transformation: new L.Transformation(scale_x, center_x, -scale_y, center_y)
            });

            // Initialize Map (Locked Interactions)
            map = L.map('map', {
                crs: CustomCRS,
                minZoom: 2,
                maxZoom: 4,
                zoomControl: false,       
                dragging: false,          
                scrollWheelZoom: false,   
                doubleClickZoom: false,   
                boxZoom: false,           
                keyboard: false,          
                touchZoom: false,         
                attributionControl: false
            });

            // =========================================================
            // 🛑 CRITICAL FIX: PATH CORRECTION
            // =========================================================
            // RageMP treats "http://package/" as the ROOT of the "client_packages" folder.
            // Old Path: package://client_packages/ui/... (WRONG - looks for client_packages folder INSIDE client_packages)
            // New Path: http://package/ui/WebMap/...   (CORRECT)
            
            const tilePath = 'http://package/ui/WebMap/images/map/{z}/{x}x{y}.png';
            
            // Debugging: Try to load one image manually to check path
            const debugUrl = 'http://package/ui/WebMap/images/map/4/0x0.png';
            console.log("Attempting to load tile from: " + debugUrl);
            document.getElementById('debug-img').src = debugUrl;

            L.tileLayer(tilePath, {
                minZoom: 2,
                maxZoom: 4,
                tileSize: 256,
                noWrap: true,
                tms: false 
            }).addTo(map)
            .on('tileerror', function(e) {
                console.error("Map tile failed to load: ", e.url);
            });

            map.setView([0, 0], 2);
        }

        function loadRoutes(routesJson) {
            if (!map) initMap(); 

            const routes = JSON.parse(routesJson);
            const list = document.getElementById('routeList');
            list.innerHTML = '';

            routes.forEach((route, index) => {
                const div = document.createElement('div');
                div.className = 'route-item';
                div.innerText = route.name;
                div.onclick = () => selectRoute(div, route, index + 1);
                list.appendChild(div);
            });
        }

        function selectRoute(element, route, serverId) {
            document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('details').style.display = 'block';
            document.getElementById('rTitle').innerText = route.name;
            document.getElementById('rDiff').innerText = route.difficulty;
            document.getElementById('rStops').innerText = route.dumpsters.length + " Bins";
            document.getElementById('rPay').innerText = "$" + (route.estimatedPay || 0).toLocaleString();
            document.getElementById('rDist').innerText = (route.distance ? route.distance.toFixed(2) : "0.00") + " km";
            
            selectedRouteId = serverId;

            if (currentRouteLayer) map.removeLayer(currentRouteLayer);

            const mapPoints = route.dumpsters.map(d => [d.y, d.x]);
            const markers = [];

            // Start Dot
            markers.push(L.circleMarker(mapPoints[0], { color: '#2ecc71', radius: 6, fillOpacity: 1 }));

            // Dumpsters
            route.dumpsters.forEach((d) => {
                markers.push(L.circleMarker([d.y, d.x], {
                    color: '#f8b632',
                    fillColor: '#f8b632',
                    fillOpacity: 0.8,
                    radius: 4,
                    stroke: false
                }));
            });

            // Line
            const polyline = L.polyline(mapPoints, { color: '#f8b632', weight: 3, opacity: 0.8 });
            markers.push(polyline);

            currentRouteLayer = L.layerGroup(markers).addTo(map);
            
            // Auto Zoom
            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
        }

        function startJob() {
            if(!selectedRouteId) return;
            mp.trigger('client:garbage:select', selectedRouteId);
        }

        function closeMenu() {
            mp.trigger('client:garbage:close');
        }

        setTimeout(initMap, 200);
    </script>
</body>
</html>
