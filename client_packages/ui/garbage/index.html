<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitation Job</title>
    <link rel="stylesheet" href="../lib/leaflet/leaflet.css" />
    <style>
        /* ... (Your existing CSS remains exactly the same) ... */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #141b2d; 
            margin: 0; 
            overflow: hidden; 
            user-select: none; 
        }
        .container { 
            width: 100vw; 
            height: 100vh; 
            background: rgba(20, 20, 25, 1); 
            display: flex; 
        }
        .sidebar { 
            width: 350px; 
            min-width: 300px;
            background: rgba(30, 30, 35, 1); 
            border-right: 1px solid #444; 
            display: flex; 
            flex-direction: column; 
            z-index: 10;
        }
        .header { 
            padding: 25px; 
            background: #f8b632; 
            color: #111; 
            font-weight: bold; 
            text-align: center; 
            text-transform: uppercase; 
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .route-list { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px; 
        }
        .route-item { 
            background: #2a2a2e; 
            color: #ccc; 
            padding: 20px; 
            margin-bottom: 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            border-left: 4px solid transparent; 
            transition: background 0.2s;
        }
        .route-item:hover { background: #333; }
        .route-item.active { 
            background: #383838; 
            border-left: 4px solid #f8b632; 
            color: white; 
        }
        .content { 
            flex-grow: 1; 
            position: relative; 
            background: #141b2d; 
        }
        #map { 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
            background: #141b2d; 
        }
        .btn-close { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: rgba(0,0,0,0.6); 
            color: white; 
            width: 40px; 
            height: 40px; 
            line-height: 40px; 
            text-align: center; 
            border-radius: 5px; 
            cursor: pointer; 
            z-index: 600; 
            font-weight: bold; 
            font-size: 20px;
            transition: background 0.2s;
        }
        .btn-close:hover { background: #d32f2f; }
        .job-overlay { 
            position: absolute; 
            bottom: 30px; 
            right: 30px; 
            background: rgba(0, 0, 0, 0.9); 
            padding: 25px; 
            border-radius: 8px; 
            color: white; 
            border-left: 5px solid #f8b632; 
            width: 300px; 
            z-index: 500; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .btn-start { 
            margin-top: 20px; 
            background: #f8b632; 
            color: #111; 
            border: none; 
            width: 100%; 
            padding: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
            text-transform: uppercase;
            font-size: 14px;
        }
        .btn-start:hover { background: #e0a42e; }
        .stat { 
            display: flex; 
            justify-content: space-between; 
            margin: 8px 0; 
            color: #aaa; 
            font-size: 14px;
        }
        .stat span { color: white; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="header">Available Routes</div>
            <div class="route-list" id="routeList"></div>
        </div>
        <div class="content">
            <div class="btn-close" onclick="closeMenu()">×</div>
            <div id="map"></div>
            <div id="details" class="job-overlay" style="display: none;">
                <h2 id="rTitle" style="margin:0 0 15px 0; color:#f8b632; font-size: 1.5rem;">Select Route</h2>
                <div class="stat">Diff: <span id="rDiff">--</span></div>
                <div class="stat">Stops: <span id="rStops">--</span></div>
                <div class="stat">Pay: <span id="rPay">--</span></div>
                <div class="stat">Dist: <span id="rDist">--</span></div>
                <button class="btn-start" onclick="startJob()">Start Shift</button>
            </div>
        </div>
    </div>

    <script src="../lib/leaflet/leaflet.js"></script>
    
    <script src="../lib/customMap.js"></script>

    <script>
        let gameMap = null;
        let selectedRouteId = null;

        // Shared Icon Configuration for Garbage Job
        const binIconOptions = {
            iconUrl: 'package://ui/WebMap/images/icons/bin.png', 
            iconSize: [20, 20],  
            iconAnchor: [10, 10], 
            popupAnchor: [0, -10] 
        };

        function loadRoutes(routesJson) {
            // Initialize the shared map class
            if (!gameMap) {
                gameMap = new GameMap('map', { initialZoom: 5 });
                gameMap.disableInteraction(); // Specific to Garbage Job requirements
            }

            const routes = JSON.parse(routesJson);
            const list = document.getElementById('routeList');
            list.innerHTML = '';

            routes.forEach((route, index) => {
                const div = document.createElement('div');
                div.className = 'route-item';
                div.innerText = route.name;
                div.onclick = () => selectRoute(div, route, index + 1);
                list.appendChild(div);
            });
        }

        function selectRoute(element, route, serverId) {
            // UI Updates
            document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('details').style.display = 'block';
            document.getElementById('rTitle').innerText = route.name;
            document.getElementById('rDiff').innerText = route.difficulty;
            document.getElementById('rStops').innerText = route.dumpsters.length + " Bins";
            document.getElementById('rPay').innerText = "$" + (route.estimatedPay || 0).toLocaleString();
            document.getElementById('rDist').innerText = (route.distance ? route.distance.toFixed(2) : "0.00") + " km";
            selectedRouteId = serverId;

            // Use the shared map to show markers
            // route.dumpsters contains {x, y, z} objects
            gameMap.setMarkers(route.dumpsters, binIconOptions);
        }

        function startJob() {
            if(selectedRouteId) mp.trigger('client:garbage:select', selectedRouteId);
        }
        function closeMenu() {
            mp.trigger('client:garbage:close');
        }
    </script>
</body>
</html>
