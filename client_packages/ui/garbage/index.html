<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitation Job</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: rgba(0, 0, 0, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .container {
            background: rgba(20, 20, 25, 0.95);
            width: 900px; /* Made wider for map */
            height: 600px;
            border-radius: 10px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid #444;
        }

        /* Left Side: Route List */
        .sidebar {
            width: 30%;
            background: rgba(30, 30, 35, 0.9);
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .header {
            padding: 20px;
            background: #f8b632;
            color: #111;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-align: center;
        }

        .route-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .route-item {
            background: #2a2a2e;
            color: #ccc;
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .route-item:hover { background: #333; }
        .route-item.active {
            background: #383838;
            border-left: 4px solid #f8b632;
            color: #fff;
        }

        /* Right Side: Map & Details */
        .content {
            width: 70%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* The Map Container */
        #map {
            width: 100%;
            height: 100%;
            background: #141b2d; /* Ocean color matching standard GTA maps */
        }

        /* Overlay for Job Details */
        .job-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 8px;
            color: white;
            border: 1px solid #f8b632;
            width: 250px;
            pointer-events: auto; /* Allow clicking buttons */
            z-index: 500; /* Above map */
        }

        .job-overlay h2 { margin: 0 0 10px 0; color: #f8b632; font-size: 1.5rem; }
        .stat { margin: 8px 0; font-size: 0.9rem; color: #aaa; display: flex; justify-content: space-between; }
        .stat span { color: white; font-weight: bold; }

        .btn-start {
            margin-top: 15px;
            background: #f8b632;
            color: #111;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 5px;
        }
        .btn-start:hover { background: #ffcc5c; }
        
        .btn-close {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.5); color: white;
            width: 30px; height: 30px; line-height: 30px;
            text-align: center; border-radius: 50%;
            cursor: pointer; z-index: 600; font-weight: bold;
        }
        .btn-close:hover { background: rgba(200, 50, 50, 0.8); }

    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="header">Available Routes</div>
            <div class="route-list" id="routeList"></div>
        </div>

        <div class="content">
            <div class="btn-close" onclick="closeMenu()">×</div>
            
            <div id="map"></div>

            <div id="details" class="job-overlay" style="display: none;">
                <h2 id="rTitle">Select Route</h2>
                <div class="stat">Difficulty <span id="rDiff">--</span></div>
                <div class="stat">Stops <span id="rStops">--</span></div>
                <div class="stat">Pay <span id="rPay">--</span></div>
                <div class="stat">Distance <span id="rDist">--</span></div>
                <button class="btn-start" onclick="startJob()">Start Shift</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let selectedRouteId = null;
        let map = null;
        let currentRouteLayer = null; // Store the route polyline/markers to clear them later

        // --- MAP CONFIGURATION ---
        function initMap() {
            // GTA V Map Bounds (Approximate for standard Atlas maps)
            const center_x = 117.3;
            const center_y = 172.8;
            const scale_x = 0.02072;
            const scale_y = 0.0205;

            // Define the custom coordinate system for GTA V
            const CustomCRS = L.extend({}, L.CRS.Simple, {
                transformation: new L.Transformation(scale_x, center_x, -scale_y, center_y)
            });

            // Initialize Map
            map = L.map('map', {
                crs: CustomCRS,
                minZoom: 1,
                maxZoom: 5, // Adjust based on how many folder levels you actually have
                zoomControl: false, // Hide zoom buttons for cleaner look
                attributionControl: false
            });

            // Load Custom Tiles
            // Path structure: ../WebMap/images/map/4/{x}x{y}.jpg
            // Since you said "folder 4", I assume you might only have zoom level 4?
            // If you have multiple zoom levels, change '4' to '{z}'
            L.tileLayer('../WebMap/images/map/4/{x}x{y}.jpg', {
                minZoom: 1,
                maxZoom: 5,
                tileSize: 1024, // GTA tiles are often huge, check if yours are 256 or 1024
                noWrap: true,
                tms: false
            }).addTo(map);

            // Center on Los Santos
            map.setView([0, 0], 3);
        }

        // --- JOB LOGIC ---
        function loadRoutes(routesJson) {
            if (!map) initMap(); // Ensure map is ready

            const routes = JSON.parse(routesJson);
            const list = document.getElementById('routeList');
            list.innerHTML = '';

            routes.forEach((route, index) => {
                const div = document.createElement('div');
                div.className = 'route-item';
                div.innerText = route.name;
                div.onclick = () => selectRoute(div, route, index + 1);
                list.appendChild(div);
            });
        }

        function selectRoute(element, route, serverId) {
            // UI Highlight
            document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Show Details Overlay
            document.getElementById('details').style.display = 'block';
            document.getElementById('rTitle').innerText = route.name;
            document.getElementById('rDiff').innerText = route.difficulty;
            document.getElementById('rStops').innerText = route.dumpsters.length + " Bins";
            document.getElementById('rPay').innerText = "$" + (route.estimatedPay || 0).toLocaleString();
            document.getElementById('rDist').innerText = (route.distance ? route.distance.toFixed(2) : "0.00") + " km";
            
            selectedRouteId = serverId;

            // --- DRAW ROUTE ON MAP ---
            if (currentRouteLayer) {
                map.removeLayer(currentRouteLayer);
            }

            // Convert GTA Dumpster Coords to Leaflet Coords
            const mapPoints = route.dumpsters.map(d => [d.y, d.x]); // Leaflet uses [Lat(y), Lng(x)]

            // Create a feature group for markers and lines
            const markers = [];
            
            // Add Start Marker (Depot/First point)
            markers.push(L.circleMarker(mapPoints[0], { color: '#00ff00', radius: 6 }).bindPopup("Start"));

            // Add Dumpsters
            route.dumpsters.forEach((d, i) => {
                markers.push(L.circleMarker([d.y, d.x], {
                    color: '#f8b632',
                    fillColor: '#f8b632',
                    fillOpacity: 0.8,
                    radius: 4
                }));
            });

            // Draw Line
            const polyline = L.polyline(mapPoints, { color: '#f8b632', weight: 3 });
            markers.push(polyline);

            currentRouteLayer = L.layerGroup(markers).addTo(map);

            // Zoom map to fit the route
            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
        }

        function startJob() {
            if(!selectedRouteId) return;
            mp.trigger('client:garbage:select', selectedRouteId);
        }

        function closeMenu() {
            mp.trigger('client:garbage:close');
        }

        // Initialize map on load (empty)
        setTimeout(initMap, 100); 
    </script>
</body>
</html>
