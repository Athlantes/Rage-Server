<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitation Job</title>
    <link rel="stylesheet" href="../lib/leaflet/leaflet.css" />
    <style>
        /* Body no longer needs to center items, it just holds the full screen container */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #141b2d; /* Match map bg to prevent flickering */
            margin: 0; 
            overflow: hidden; /* Prevent scrollbars */
            user-select: none; 
        }

        /* Container is now Full Screen */
        .container { 
            width: 100vw; 
            height: 100vh; 
            background: rgba(20, 20, 25, 1); /* Solid background */
            display: flex; 
            border-radius: 0; /* Remove rounded corners */
            box-shadow: none; /* Remove shadow */
            border: none; 
        }

        /* Sidebar styling */
        .sidebar { 
            width: 350px; /* Fixed width looks better on fullscreen than % */
            min-width: 300px;
            background: rgba(30, 30, 35, 1); 
            border-right: 1px solid #444; 
            display: flex; 
            flex-direction: column; 
            z-index: 10;
        }

        .header { 
            padding: 25px; 
            background: #f8b632; 
            color: #111; 
            font-weight: bold; 
            text-align: center; 
            text-transform: uppercase; 
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .route-list { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px; 
        }

        .route-item { 
            background: #2a2a2e; 
            color: #ccc; 
            padding: 20px; 
            margin-bottom: 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            border-left: 4px solid transparent; 
            transition: background 0.2s;
        }

        .route-item:hover { background: #333; }
        
        .route-item.active { 
            background: #383838; 
            border-left: 4px solid #f8b632; 
            color: white; 
        }

        /* Map Content Area */
        .content { 
            flex-grow: 1; 
            position: relative; 
            background: #141b2d; 
        }

        #map { 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
            background: #141b2d; 
        }

        /* Close Button - Moved slightly for fullscreen aesthetics */
        .btn-close { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: rgba(0,0,0,0.6); 
            color: white; 
            width: 40px; 
            height: 40px; 
            line-height: 40px; 
            text-align: center; 
            border-radius: 5px; 
            cursor: pointer; 
            z-index: 600; 
            font-weight: bold; 
            font-size: 20px;
            transition: background 0.2s;
        }
        
        .btn-close:hover { background: #d32f2f; }

        /* Job Details Overlay */
        .job-overlay { 
            position: absolute; 
            bottom: 30px; 
            right: 30px; 
            background: rgba(0, 0, 0, 0.9); 
            padding: 25px; 
            border-radius: 8px; 
            color: white; 
            border-left: 5px solid #f8b632; 
            width: 300px; 
            z-index: 500; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .btn-start { 
            margin-top: 20px; 
            background: #f8b632; 
            color: #111; 
            border: none; 
            width: 100%; 
            padding: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
            text-transform: uppercase;
            font-size: 14px;
        }
        
        .btn-start:hover { background: #e0a42e; }

        .stat { 
            display: flex; 
            justify-content: space-between; 
            margin: 8px 0; 
            color: #aaa; 
            font-size: 14px;
        }
        
        .stat span { color: white; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="header">Available Routes</div>
            <div class="route-list" id="routeList"></div>
        </div>
        <div class="content">
            <div class="btn-close" onclick="closeMenu()">×</div>
            <div id="map"></div>
            <div id="details" class="job-overlay" style="display: none;">
                <h2 id="rTitle" style="margin:0 0 15px 0; color:#f8b632; font-size: 1.5rem;">Select Route</h2>
                <div class="stat">Diff: <span id="rDiff">--</span></div>
                <div class="stat">Stops: <span id="rStops">--</span></div>
                <div class="stat">Pay: <span id="rPay">--</span></div>
                <div class="stat">Dist: <span id="rDist">--</span></div>
                <button class="btn-start" onclick="startJob()">Start Shift</button>
            </div>
        </div>
    </div>

    <script src="../lib/leaflet/leaflet.js"></script>

    <script>
        let map = null;
        let currentRouteLayer = null;
        let selectedRouteId = null;

        const CenterX = 59.5028;
        const CenterY = 119.3981;
        const ScaleX = 0.01443;
        const ScaleY = 0.01424;

        const binIcon = L.icon({
            iconUrl: 'package://ui/WebMap/images/icons/bin.png', 
            
            iconSize: [20, 20],  
            iconAnchor: [10, 10], 
            popupAnchor: [0, -10] 
        });

        function initMap() {
            // 1. Define Coordinate System (UNCHANGED)
            const CustomCRS = L.extend({}, L.CRS.Simple, {
                transformation: new L.Transformation(ScaleX, CenterX, -ScaleY, CenterY)
            });

            // 2. Initialize Map - UPDATED OPTIONS
            map = L.map('map', {
                crs: CustomCRS,
                minZoom: 2,
                maxZoom: 5,
                zoomControl: false,       // Hides +/- buttons
                attributionControl: false,
                center: [0, 0],
                zoom: 5,
                // DISABLE INTERACTION:
                dragging: false,          // Disables panning
                touchZoom: false,         // Disables touch zooming
                doubleClickZoom: false,   // Disables double click zoom
                scrollWheelZoom: false,   // Disables scroll wheel zoom
                boxZoom: false,           // Disables shift+drag zoom
                keyboard: false           // Disables arrow keys
            });

            // 3. Define Tile Layer (UNCHANGED)
            const tilePath = 'package://ui/WebMap/images/map/{z}/{x}x{y}.png'; 

            const tileLayer = L.tileLayer(tilePath, {
                minZoom: 2,
                maxZoom: 5,
                tileSize: 256, 
                noWrap: true,
                tms: false 
            });

            tileLayer.on('tileerror', function(error, tile) {
                console.error("Tile Error (Check Path):", error.url);
            });

            tileLayer.addTo(map);
        }

        function loadRoutes(routesJson) {
            if (!map) initMap(); 

            const routes = JSON.parse(routesJson);
            const list = document.getElementById('routeList');
            list.innerHTML = '';

            routes.forEach((route, index) => {
                const div = document.createElement('div');
                div.className = 'route-item';
                div.innerText = route.name;
                div.onclick = () => selectRoute(div, route, index + 1);
                list.appendChild(div);
            });
        }

        function selectRoute(element, route, serverId) {
            // UI Updates
            document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('details').style.display = 'block';
            document.getElementById('rTitle').innerText = route.name;
            document.getElementById('rDiff').innerText = route.difficulty;
            document.getElementById('rStops').innerText = route.dumpsters.length + " Bins";
            document.getElementById('rPay').innerText = "$" + (route.estimatedPay || 0).toLocaleString();
            document.getElementById('rDist').innerText = (route.distance ? route.distance.toFixed(2) : "0.00") + " km";
            selectedRouteId = serverId;

            // Remove previous markers
            if (currentRouteLayer) map.removeLayer(currentRouteLayer);

            // Get all coordinates
            const mapPoints = route.dumpsters.map(d => [d.y, d.x]);
            const markers = [];
            
            // Loop through ALL points and apply the same Bin Icon
            mapPoints.forEach(point => {
                markers.push(L.marker(point, { icon: binIcon }));
            });
            
            // Add all markers to the map
            currentRouteLayer = L.layerGroup(markers).addTo(map);
            
            // Zoom to fit all the bins (calculate bounds without drawing a line)
            if (mapPoints.length > 0) {
                map.fitBounds(L.latLngBounds(mapPoints), { padding: [100, 100] });
            }
        }

        function startJob() {
            if(selectedRouteId) mp.trigger('client:garbage:select', selectedRouteId);
        }
        function closeMenu() {
            mp.trigger('client:garbage:close');
        }

        setTimeout(initMap, 100);
    </script>
</body>
</html>
