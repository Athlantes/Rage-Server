<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitation Job</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: rgba(0, 0, 0, 0); /* Transparent */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .container {
            background: rgba(20, 20, 25, 0.95);
            width: 700px;
            height: 500px;
            border-radius: 10px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid #444;
        }

        /* Left Side: Route List */
        .sidebar {
            width: 40%;
            background: rgba(30, 30, 35, 0.9);
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            background: #f8b632; /* Garbage Truck Orange */
            color: #111;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-align: center;
        }

        .route-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .route-item {
            background: #2a2a2e;
            color: #ccc;
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .route-item:hover { background: #333; }
        .route-item.active {
            background: #383838;
            border-left: 4px solid #f8b632;
            color: #fff;
        }

        /* Right Side: Details */
        .content {
            width: 60%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            color: white;
            position: relative;
        }

        h2 { margin-top: 0; color: #f8b632; font-size: 2rem; }
        .stat { margin: 15px 0; font-size: 1.1rem; color: #aaa; display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .stat span { color: white; font-weight: bold; }

        .btn-start {
            margin-top: auto;
            background: #f8b632;
            color: #111;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 5px;
            transition: 0.2s;
        }

        .btn-start:hover { background: #ffcc5c; transform: scale(1.02); }
        .btn-close {
            position: absolute; top: 10px; right: 15px;
            color: #666; cursor: pointer; font-size: 1.5rem;
        }
        .btn-close:hover { color: white; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #555; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="header">Available Routes</div>
            <div class="route-list" id="routeList">
                </div>
        </div>

        <div class="content">
            <div class="btn-close" onclick="closeMenu()">×</div>
            
            <h2 id="rTitle">Select a Route</h2>
            
            <div id="details" style="display: none;">
                <div class="stat">Difficulty <span id="rDiff">--</span></div>
                <div class="stat">Stops <span id="rStops">--</span></div>
                <div class="stat">Est. Pay <span id="rPay">--</span></div>
                <div class="stat">Distance <span id="rDist">Calculating...</span></div>

                <button class="btn-start" onclick="startJob()">Start Shift</button>
            </div>
            
            <p id="placeholder" style="color:#666; margin-top: 50px;">Select a route from the list to view details.</p>
        </div>
    </div>

    <script>
        let selectedRouteId = null;

        function loadRoutes(routesJson) {
            const routes = JSON.parse(routesJson);
            const list = document.getElementById('routeList');
            list.innerHTML = '';

            routes.forEach((route, index) => {
                const div = document.createElement('div');
                div.className = 'route-item';
                div.innerText = route.name;
                div.onclick = () => selectRoute(div, route, index + 1);
                list.appendChild(div);
            });
        }

        function selectRoute(element, route, serverId) {
            const dist = route.distance ? route.distance.toFixed(2) : "0.00";

            // UI Highlight
            document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Show Details
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('details').style.display = 'block';

            document.getElementById('rTitle').innerText = route.name;
            document.getElementById('rDiff').innerText = route.difficulty;
            document.getElementById('rStops').innerText = route.dumpsters.length + " Bins";
            
            // --- UPDATED THIS LINE TO USE CALCULATED ESTIMATE ---
            document.getElementById('rPay').innerText = "$" + (route.estimatedPay || 0).toLocaleString();
            
            document.getElementById('rDist').innerText = dist + " km";
            selectedRouteId = serverId;
        }

        function startJob() {
            if(!selectedRouteId) return;
            mp.trigger('client:garbage:select', selectedRouteId);
        }

        function closeMenu() {
            mp.trigger('client:garbage:close');
        }
    </script>
</body>
</html>
