<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Chat</title>
</head>
<body>
    <div id="app" class="chat-container">
        <div class="chat-messages" 
            :class="{ active: inputActive }" 
            :style="{ height: settings.height + 'px' }">
            <div v-for="msg in filteredMessages" :class="['message', msg.type]">
                <span v-if="msg.username" class="username" :style="{ color: settings.nameColor }">{{ msg.username }}:</span>
                <span class="text" :style="{ color: settings.textColor }">{{ msg.text }}</span>
            </div>
        </div>

        <div class="chat-input-wrapper" v-show="inputActive">
            <div class="settings-btn" @click="toggleSettings">⚙️</div>
            <input type="text" 
                   id="chatInput" 
                   v-model="currentInput" 
                   @keydown.tab.prevent="handleTab" 
                   @keydown.enter="sendMessage" 
                   @keydown.esc="closeChat"
                   placeholder="Type a message..."
                   autocomplete="off">
            <div class="channel-tabs">
                <span v-for="tab in tabs" :class="{ active: currentTab === tab }" @click="currentTab = tab">{{ tab }}</span>
            </div>
        </div>

        <div class="settings-modal" v-if="showSettings">
            <h3>Chat Settings</h3>
            <label>Height: <input type="range" v-model="settings.height" min="150" max="600"></label>
            <label>Name Color: <input type="color" v-model="settings.nameColor"></label>
            <label>Text Color: <input type="color" v-model="settings.textColor"></label>
            <button @click="saveSettings">Save & Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="app.js"></script>
</body>
</html>
