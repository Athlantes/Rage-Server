<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Spawn</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      overflow: hidden;
      font-family: 'Barlow', sans-serif;
      background: #0d0d0d;
      user-select: none;
      width: 100vw;
      height: 100vh;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    #header {
      flex-shrink: 0;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      animation: fadeIn 0.4s ease both;
    }

    .hdr-left h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #fff;
      line-height: 1;
    }

    .hdr-left p {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
    }

    /* ── Cards area (takes remaining space, centers cards) ── */
    #cards-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 40px;
    }

    /* ── Card row ── */
    .cards-wrap {
      display: flex;
      gap: 0;
      height: 520px;       /* card height — adjust to taste */
      width: 100%;
      max-width: 1400px;
      animation: fadeIn 0.45s ease 0.1s both;
    }

    /* ── Single card ── */
    .spawn-card {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border-right: 1px solid rgba(0,0,0,0.5);
      transition: flex 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .spawn-card:last-child { border-right: none; }
    .spawn-card.active { flex: 1.4; }

    /* Active top accent */
    .spawn-card.active::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--accent, #fff);
      z-index: 10;
    }

    /* Background image */
    .card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .spawn-card:hover  .card-bg,
    .spawn-card.active .card-bg { transform: scale(1.05); }

    /* Color overlay */
    .card-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.82;
      transition: opacity 0.35s;
    }
    .spawn-card:hover  .card-overlay,
    .spawn-card.active .card-overlay { opacity: 0.55; }

    /* Bottom fade */
    .card-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 35%, rgba(0,0,0,0.65) 100%);
    }

    /* Card text */
    .card-body {
      position: absolute;
      top: 20px;
      left: 0; right: 0;
      padding: 18px 20px;
      z-index: 5;
    }

    .card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    .card-desc {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-top: 8px;
      line-height: 1.55;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      font-weight: 300;
    }

    /* Color themes */
    .card-overlay.last   { background: linear-gradient(to bottom, #a0460f 0%, rgba(160, 70, 15, 0.10) 100%); }
    .card-overlay.home   { background: linear-gradient(to bottom, #1a5423 0%, rgba(26,  84, 35, 0.10) 100%); }
    .card-overlay.family { background: linear-gradient(to bottom, #0d4f7a 0%, rgba(13,  79,122, 0.10) 100%); }
    .card-overlay.org    { background: linear-gradient(to bottom, #7a6808 0%, rgba(122,104,  8, 0.10) 100%); }
    .card-overlay.std-0  { background: linear-gradient(to bottom, #7a1212 0%, rgba(122, 18, 18, 0.10) 100%); }
    .card-overlay.std-1  { background: linear-gradient(to bottom, #42107a 0%, rgba( 66, 16,122, 0.10) 100%); }
    .card-overlay.std-2  { background: linear-gradient(to bottom, #0d6060 0%, rgba( 13, 96, 96, 0.10) 100%); }
    .card-overlay.std-3  { background: linear-gradient(to bottom, #6e3808 0%, rgba(110, 56,  8, 0.10) 100%); }
    .card-overlay.std-4  { background: linear-gradient(to bottom, #1a3f6e 0%, rgba( 26, 63,110, 0.10) 100%); }

    /* ── Footer ── */
    #footer {
      flex-shrink: 0;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-top: 1px solid rgba(255,255,255,0.06);
      animation: fadeIn 0.4s ease 0.05s both;
    }

    .footer-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-icon-box {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent, #555);
      clip-path: polygon(10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .footer-icon-box i { font-size: 20px; color: #fff; }

    .footer-text .sel-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      line-height: 1;
    }

    .footer-text .sel-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-top: 3px;
    }

    .footer-hint {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    /* Spawn button */
    .btn-spawn {
      height: 50px;
      padding: 0 44px 0 32px;
      background: #c0392b;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      clip-path: polygon(0% 0%, calc(100% - 14px) 0%, 100% 50%, calc(100% - 14px) 100%, 0% 100%);
      transition: background 0.2s, transform 0.15s;
    }
    .btn-spawn:hover  { background: #e74c3c; transform: translateX(4px); }
    .btn-spawn:active { background: #a93226; transform: scale(0.97); }

    /* Animations */
    .spawn-card:nth-child(1) { animation: cardIn 0.45s cubic-bezier(0.25,0.8,0.25,1) 0.05s both; }
    .spawn-card:nth-child(2) { animation: cardIn 0.45s cubic-bezier(0.25,0.8,0.25,1) 0.10s both; }
    .spawn-card:nth-child(3) { animation: cardIn 0.45s cubic-bezier(0.25,0.8,0.25,1) 0.15s both; }
    .spawn-card:nth-child(4) { animation: cardIn 0.45s cubic-bezier(0.25,0.8,0.25,1) 0.20s both; }
    .spawn-card:nth-child(5) { animation: cardIn 0.45s cubic-bezier(0.25,0.8,0.25,1) 0.25s both; }
    .spawn-card:nth-child(6) { animation: cardIn 0.45s cubic-bezier(0.25,0.8,0.25,1) 0.30s both; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    /* Vue footer transition */
    .slide-enter-active { transition: opacity 0.2s, transform 0.2s; }
    .slide-leave-active { transition: opacity 0.15s; }
    .slide-enter-from   { opacity: 0; transform: translateX(-8px); }
    .slide-leave-to     { opacity: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="app.js"></script>
</body>
</html>
