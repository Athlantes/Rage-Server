<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Spawn</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

    /* ── Leaflet required styles (inlined from leaflet.css, trimmed) ── */
    .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,
    .leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,
    .leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
    .leaflet-container{overflow:hidden}
    .leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}
    .leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
    .leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
    .leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}
    .leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}
    .leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}
    .leaflet-popup-pane{z-index:700}
    .leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
    .leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,
    .leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
    .leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,
    .leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
    .leaflet-container{background:#191919;outline-offset:1px}
    .leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
    .leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,
    .leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,
    .leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
    .leaflet-container img.leaflet-tile{mix-blend-mode:plus-lighter}
    .leaflet-zoom-anim .leaflet-zoom-animated{-webkit-transition:-webkit-transform .25s cubic-bezier(0,0,.25,1);transition:transform .25s cubic-bezier(0,0,.25,1)}
    .leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
    .leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
    .leaflet-zoom-animated{-webkit-transform-origin:0 0;transform-origin:0 0}
    .leaflet-interactive{cursor:pointer}
    .leaflet-grab{cursor:grab}.leaflet-crosshair{cursor:crosshair}
    .leaflet-dragging .leaflet-grab{cursor:grabbing}
    .leaflet-container{-webkit-tap-highlight-color:transparent}
    .leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
    .leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
    .leaflet-div-icon{background:#fff;border:1px solid #666}

    /* ── Reset ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: #191919;
      user-select: none;
    }

    /* ── Full-screen map behind the UI ── */
    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #191919;
    }

    /* ── Vue UI overlay (pointer-events: none so map stays interactive) ── */
    #app {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    /* ── UI Layer ── */
    .ui-layer {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px;
      background: radial-gradient(circle at center, transparent 0%, rgba(10, 15, 20, 0.4) 100%);
    }

    /* ── Header ── */
    .header-title {
      text-align: center;
      margin-top: 50px;
      pointer-events: auto;
      animation: floatInDown 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .header-title h1 {
      color: white;
      font-weight: 800;
      font-size: 42px;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(to right, #fff, #a5c9ca);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title p {
      color: #cbd5e1;
      font-size: 14px;
      letter-spacing: 1px;
      margin-top: 5px;
      font-weight: 300;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* ── Bottom selector section ── */
    .spawn-selector-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      pointer-events: auto;
      animation: floatInUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin-bottom: 20px;
    }

    .spawn-row {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 16px;
    }

    /* ── Spawn Cards ── */
    .spawn-card {
      width: 155px;
      height: 135px;
      background: rgba(15, 23, 35, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(100, 180, 255, 0.15);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1),
                  background 0.25s, border-color 0.25s, box-shadow 0.25s;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
    }

    .spawn-card:hover {
      transform: translateY(-8px);
      background: rgba(25, 35, 50, 0.88);
      border-color: rgba(0, 168, 255, 0.4);
      box-shadow: 0 20px 40px rgba(0, 168, 255, 0.15);
    }

    .spawn-card.active {
      background: rgba(0, 168, 255, 0.15);
      border-color: #00a8ff;
      box-shadow: 0 0 30px rgba(0, 168, 255, 0.28);
      transform: translateY(-8px);
    }

    .spawn-card i {
      font-size: 30px;
      color: #64748b;
      margin-bottom: 13px;
      transition: color 0.25s, transform 0.25s;
    }

    .spawn-card:hover i,
    .spawn-card.active i { color: #00a8ff; transform: scale(1.1); }

    .spawn-card h3 {
      margin: 0;
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .spawn-card span {
      color: #94a3b8;
      font-size: 10px;
      margin-top: 4px;
      display: block;
      font-weight: 400;
    }

    /* ── Last location (gold variant) ── */
    .spawn-card.special { border-color: rgba(255, 215, 0, 0.3); }
    .spawn-card.special i { color: rgba(255, 215, 0, 0.75); }
    .spawn-card.special:hover { border-color: rgba(255, 215, 0, 0.6); }
    .spawn-card.special:hover i { color: #ffd700; }
    .spawn-card.special.active {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.1);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.18);
    }
    .spawn-card.special.active i { color: #ffd700; opacity: 1; }

    /* ── House location (Green variant) ── */
    .spawn-card.special-house { border-color: rgba(46, 204, 113, 0.3); }
    .spawn-card.special-house i { color: rgba(46, 204, 113, 0.75); }
    .spawn-card.special-house:hover { border-color: rgba(46, 204, 113, 0.6); }
    .spawn-card.special-house:hover i { color: #2ecc71; }
    .spawn-card.special-house.active {
      border-color: #2ecc71;
      background: rgba(46, 204, 113, 0.1);
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.18);
    }
    .spawn-card.special-house.active i { color: #2ecc71; opacity: 1; }

    /* ── Wake Up Button ── */
    .btn-spawn {
      padding: 15px 56px;
      background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%);
      color: white;
      font-weight: 700;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 114, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: filter 0.25s, transform 0.25s, box-shadow 0.25s,
                  opacity 0.3s, visibility 0.3s;
    }

    .btn-spawn:hover {
      filter: brightness(1.1);
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0, 114, 255, 0.5);
    }

    .btn-spawn:active { transform: scale(0.98); }

    /* Vue v-show drives opacity/visibility instead of display:none
       so the transform transition still plays */
    .btn-spawn[style*="display: none"],
    .btn-spawn[style*="display:none"] { pointer-events: none; }

    /* ── Animations ── */
    @keyframes floatInDown {
      from { opacity: 0; transform: translateY(-40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Vue transition for the button */
    .btn-fade-enter-active { transition: opacity 0.3s, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-fade-leave-active { transition: opacity 0.2s; }
    .btn-fade-enter-from   { opacity: 0; transform: translateY(14px); }
    .btn-fade-leave-to     { opacity: 0; }
  </style>
</head>
<body>

  <!-- Leaflet map — outside Vue, managed imperatively -->
  <div id="map"></div>

  <!-- Vue mounts here — floats above the map -->
  <div id="app"></div>

  <!--
    Script loading order:
      1. Leaflet           → exposes global L
      2. customMap.js      → exposes class GameMap (uses L)
      3. Vue 3             → exposes global Vue
      4. app.js            → creates & mounts the Vue app (uses GameMap + Vue)
  -->
  <script src="../lib/leaflet/leaflet.js"></script>
  <script src="../lib/customMap.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="app.js"></script>

</body>
</html>
