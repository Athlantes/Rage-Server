<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .panel {
    background: rgba(10, 20, 30, 0.92);
    border: 1px solid rgba(0, 180, 255, 0.3);
    border-radius: 8px;
    width: 420px;
    max-height: 520px;
    overflow-y: auto;
    padding: 20px;
    color: #fff;
  }
  h2 { color: #00bfff; font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .fish-row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .fish-name { font-size: 14px; font-weight: 600; }
  .fish-info { font-size: 12px; color: #aaa; margin-top: 2px; }
  .fish-count { color: #00bfff; font-size: 13px; min-width: 60px; text-align: center; }
  .sell-btn {
    background: #00bfff; color: #000; border: none; padding: 6px 14px;
    border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 12px;
  }
  .sell-btn:hover { background: #33cfff; }
  .sell-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
  .close-btn {
    display: block; width: 100%; margin-top: 16px;
    background: rgba(255,255,255,0.1); color: #fff; border: none;
    padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .close-btn:hover { background: rgba(255,255,255,0.2); }
  .empty { color: #666; text-align: center; padding: 20px; font-size: 13px; }
</style>
</head>
<body>
<div class="panel">
  <h2>🐟 Fish Market</h2>
  <div id="list"><div class="empty">Loading...</div></div>
  <button class="close-btn" onclick="closeMenu()">Close</button>
</div>
<script>
function loadItems(json) {
  const items = JSON.parse(json);
  const list  = document.getElementById('list');
  const hasFish = items.some(i => i.count > 0);

  if (!hasFish) {
    list.innerHTML = '<div class="empty">You have no fish to sell.<br>Head to a fishing spot!</div>';
    return;
  }

  list.innerHTML = items.filter(i => i.count > 0).map(i => `
    <div class="fish-row">
      <div>
        <div class="fish-name">${i.label}</div>
        <div class="fish-info">$${i.price} each</div>
      </div>
      <div class="fish-count">${i.count}x</div>
      <button class="sell-btn" onclick="sell(event, '${i.id}', ${i.count})">Sell All</button>
    </div>
  `).join('');
}

// Modified to accept event so we can disable the button locally instantly
function sell(event, itemId, amount) {
  event.target.innerText = "Selling...";
  event.target.disabled = true;
  mp.trigger('client:fishing:sellAction', itemId, amount);
}

function closeMenu() {
  mp.trigger('client:fishing:closeMarket');
}
</script>
</body>
</html>
