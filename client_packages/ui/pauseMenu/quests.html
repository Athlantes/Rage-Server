<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; color: white; }
        .container {
            height: 100vh; width: 100vw;
            background: rgba(0, 0, 0, 0.85); /* Slightly darker than main menu */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        h1 { font-size: 2.5rem; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 3px; color: #00a2ff; }
        
        .quest-list { width: 60%; }
        
        .quest-card {
            background: rgba(255, 255, 255, 0.05);
            border-left: 5px solid #555;
            margin-bottom: 15px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            transition: transform 0.2s;
        }
        .quest-card.completed { border-left-color: #00ff44; opacity: 0.7; }
        
        .quest-info h2 { margin: 0; font-size: 1.2rem; }
        .quest-info p { margin: 5px 0 0; color: #aaa; font-size: 0.9rem; }
        
        .quest-progress { text-align: right; }
        .progress-text { font-size: 1.5rem; font-weight: bold; }
        .reward { color: #00ff44; font-size: 0.9rem; margin-top: 5px; }

        .btn-back {
            margin-top: 40px; padding: 10px 40px;
            background: transparent; border: 2px solid #555; color: #aaa;
            font-size: 1rem; cursor: pointer; transition: 0.3s;
        }
        .btn-back:hover { border-color: white; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Objectives</h1>
        <div class="quest-list" id="questList">
            <div class="quest-card">
                <div class="quest-info"><h2>Loading...</h2></div>
            </div>
        </div>
        <button class="btn-back" onclick="goBack()">BACK TO MENU</button>
    </div>

    <script>
        function goBack() {
            mp.trigger('client:pauseMenuAction', 'back_to_main');
        }

        // Called from Client Side Script
        function updateQuests(questsJson) {
            const list = document.getElementById('questList');
            list.innerHTML = '';
            
            // questsJson is already an object array
            questsJson.forEach(q => {
                const isDone = q.is_completed || (q.progress >= q.target);
                const statusClass = isDone ? 'completed' : '';
                const progressColor = isDone ? '#00ff44' : '#00a2ff';

                list.innerHTML += `
                    <div class="quest-card ${statusClass}">
                        <div class="quest-info">
                            <h2>${q.description}</h2>
                            <p>Resets at 07:00 AM</p>
                        </div>
                        <div class="quest-progress">
                            <div class="progress-text" style="color:${progressColor}">
                                ${q.progress} / ${q.target}
                            </div>
                            <div class="reward">$${q.reward_money}</div>
                        </div>
                    </div>
                `;
            });

            if(questsJson.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#777;">No quests available right now.</div>';
            }
        }
        
        // Request data on load
        mp.trigger('client:requestQuestData');
    </script>
</body>
</html>
