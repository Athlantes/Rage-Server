<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; color: white; }
        .container {
            height: 100vh; width: 100vw;
            background: rgba(0, 0, 0, 0.7);
            display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
            padding-left: 10%;
        }
        h1 { font-size: 3rem; margin-bottom: 50px; text-transform: uppercase; letter-spacing: 5px; }
        .menu-item {
            font-size: 1.5rem; padding: 15px 40px; margin: 5px 0;
            background: rgba(255, 255, 255, 0.05); border-left: 4px solid transparent;
            cursor: pointer; transition: all 0.3s; width: 300px;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.15); border-left: 4px solid #00a2ff;
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Central Online</h1>
        <div class="menu-item" onclick="sendAction('resume')">RESUME</div>
        <div class="menu-item" onclick="sendAction('map')">MAP</div>
        <div class="menu-item" onclick="sendAction('user_info')">USER INFO</div>
        <div class="menu-item" onclick="sendAction('jobs')">JOBS</div>
        <div class="menu-item" onclick="sendAction('quests')">QUESTS</div>
        <div class="menu-item" onclick="sendAction('quit')" style="margin-top: 50px; color: #ff4d4d;">DISCONNECT</div>
    </div>
    <script>
        function sendAction(action) {
            mp.trigger('client:pauseMenuAction', action);
        }
    </script>
</body>
</html>
