<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Packs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="overlay" data-theme="bronze">

    <div class="top-accent-line"></div>
    <div class="bg-glow"></div>

    <div id="pp-balance">
        <span class="pp-label">PP BALANCE</span>
        <span id="pp-amount">0</span>
    </div>

    <div id="shared-pack-stage" class="state-preview">
        <div class="pack-wrapper" id="pack-wrapper">
            <div class="pack-half pack-top">
                <div class="dummy-texture top"></div>
            </div>
            <div class="pack-half pack-bottom">
                <div class="dummy-texture bottom"></div>
            </div>
        </div>
    </div>

    <div id="screen-preview" class="screen">
        <div class="preview-header preview-fade">
            <h1 id="preview-pack-name">Loading Pack…</h1>
            <p id="preview-pack-desc">Hover over a reward to learn more.</p>
        </div>

        <div class="preview-spacer preview-fade" style="height: 220px; width: 100%;"></div>

        <div class="preview-table preview-fade" id="preview-table-body">
            </div>

        <div class="preview-buttons preview-fade">
            <button id="btn-cancel" class="btn btn-ghost">✕ CANCEL</button>
            <button id="btn-open" class="btn btn-primary">✦ OPEN PACK</button>
        </div>
    </div> <div id="screen-unboxing" class="screen">
        <div id="phase-label"></div>

        <div id="card-table"></div>

        <div id="countdown-bar">
            <div id="countdown-fill"></div>
        </div>

        <div id="action-panel">
            <div class="action-reward-label" id="action-reward-label">Reward Name</div>
            <div class="action-reward-sub" id="action-reward-sub">Description</div>

            <div class="action-buttons">
                <button id="btn-reroll" class="btn btn-danger">DISCARD &amp; RE-ROLL</button>
                <button id="btn-claim" class="btn btn-primary">CLAIM REWARD</button>
            </div>

            <div class="reroll-cost-badge" id="reroll-cost-badge"></div>
        </div>
    </div> <div id="screen-result" class="screen">
        <div id="result-icon-container">
            <img src="" id="result-image" alt="Reward" onerror="this.style.display='none'">
        </div>
        <div id="result-title" class="rarity-common">You received…</div>
        <div id="result-desc">Checking your wallet…</div>
        <button class="btn btn-ghost" style="margin-top:24px"
                onclick="trigger('client:cardPack:cef:forceClose')">
            CLOSE
        </button>
    </div>

</div> <script src="./script.js"></script>

</body>
</html>
