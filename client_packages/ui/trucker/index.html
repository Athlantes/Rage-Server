<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trucker Contract Board</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="../lib/leaflet/leaflet.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Container -->
    <div id="trucker-container" class="trucker-hidden">
        
        <!-- Header Section -->
        <div class="header-section">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="1" y="3" width="15" height="13"></rect>
                    <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                    <circle cx="5.5" cy="18.5" r="2.5"></circle>
                    <circle cx="18.5" cy="18.5" r="2.5"></circle>
                </svg>
            </div>
            <div class="header-text">
                <h4 class="header-subtitle">Continuous Logistics</h4>
                <h1 class="header-title">Contract Board</h1>
            </div>
            <div class="close-btn" onclick="closeBoard()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
        </div>

        <!-- Player Info Bar -->
        <div class="info-bar">
            <div class="info-item">
                <span class="info-label">Level</span>
                <span class="info-value" id="player-level">--</span>
            </div>
            <div class="info-item">
                <span class="info-label">Tier</span>
                <span class="info-value" id="player-tier">--</span>
            </div>
        </div>

        <!-- Main Content Area (Split Layout) -->
        <div class="content-area">
            
            <!-- Left Side: Route List -->
            <div class="route-list">
                <div class="list-header">
                    <h3>Available Routes</h3>
                    <p class="list-subtitle">Select a route to view details</p>
                </div>
                
                <div class="route-scroll" id="route-container">
                    <!-- Routes will be populated here by app.js -->
                    <div class="route-item-placeholder">
                        <div class="spinner"></div>
                        <p>Loading contracts...</p>
                    </div>
                </div>
            </div>

            <!-- Right Side: Map Preview -->
            <div class="map-preview">
                <div class="map-header">
                    <h3>Route Preview</h3>
                    <p class="map-subtitle" id="map-subtitle">Select a contract to view the route</p>
                </div>
                
                <!-- Leaflet Map Container -->
                <div id="route-map" class="route-map-container"></div>

                <!-- Route Details Panel (shows when route selected) -->
                <div class="route-details" id="route-details" style="display: none;">
                    <div class="detail-row">
                        <span class="detail-label">Distance</span>
                        <span class="detail-value" id="detail-distance">--</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Base Pay</span>
                        <span class="detail-value" id="detail-pay">$--</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Min Level</span>
                        <span class="detail-value" id="detail-level">--</span>
                    </div>
                    
                    <button class="accept-btn" id="accept-btn" onclick="acceptContract()">
                        Accept Contract
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="../lib/leaflet/leaflet.js"></script>
    
    <!-- Custom Map Helper -->
    <script src="../lib/customMap.js"></script>
    
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
