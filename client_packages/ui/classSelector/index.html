<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Your Class</title>
  <!--<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"> -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div id="header">
      <div class="hdr-left">
        <h1>Select Class</h1>
        <p>Choose your path and unlock unique abilities</p>
      </div>
      <div class="hdr-right">
        <p id="step-indicator">Step 1 of 2</p>
      </div>
    </div>

    <!-- Main Content Area -->
    <div id="content">
      <!-- Step 1: Class Selection -->
      <div id="step1" class="step-container active">
        <div class="cards-area">
          <div class="cards-wrap" id="classCards">
            <!-- Cards will be generated by JS -->
          </div>
        </div>
      </div>

      <!-- Step 2: Subclass + Details -->
      <div id="step2" class="step-container">
        <div class="details-wrapper">
          <div class="details-left">
            <div class="class-avatar">
              <div class="avatar-icon" id="avatarIcon"></div>
              <div class="avatar-background"></div>
            </div>
          </div>

          <div class="details-middle">
            <h2 id="selectedClassName"></h2>
            <p class="class-story" id="classStory"></p>
            
            <div class="bonuses-section">
              <h3>Bonuses</h3>
              <div class="bonuses-list" id="bonusesList"></div>
            </div>
          </div>

          <div class="details-right">
            <div class="subclasses-container" id="subclassesContainer">
              <!-- Subclass cards will be generated by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div id="footer">
      <button class="btn-secondary" id="btnBack" style="display:none;">← Back</button>
      <button class="btn-primary" id="btnNext" disabled>Next →</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
