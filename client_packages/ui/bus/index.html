<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Job</title>
    <link rel="stylesheet" href="../lib/leaflet/leaflet.css" />
    <style>
        /* Shared Style with Garbage Job for consistency */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #141b2d; 
            margin: 0; 
            overflow: hidden; 
            user-select: none; 
        }
        .container { 
            width: 100vw; 
            height: 100vh; 
            background: rgba(20, 20, 25, 1); 
            display: flex; 
        }
        .sidebar { 
            width: 350px; 
            min-width: 300px;
            background: rgba(30, 30, 35, 1); 
            border-right: 1px solid #444; 
            display: flex; 
            flex-direction: column; 
            z-index: 10;
        }
        /* Bus Yellow Theme */
        .header { 
            padding: 25px; 
            background: #ffcc00; 
            color: #111; 
            font-weight: bold; 
            text-align: center; 
            text-transform: uppercase; 
            font-size: 1.2rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .route-list { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px; 
        }
        .route-item { 
            background: #2a2a2e; 
            color: #ccc; 
            padding: 20px; 
            margin-bottom: 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            border-left: 4px solid transparent; 
            transition: background 0.2s, transform 0.2s;
            display: flex;
            justify-content: space-between;
        }
        .route-item:hover { background: #333; transform: translateX(5px); }
        .route-item.active { 
            background: #383838; 
            border-left: 4px solid #ffcc00; 
            color: white; 
        }
        .content { 
            flex-grow: 1; 
            position: relative; 
            background: #141b2d; 
        }
        #map { 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
            background: #141b2d; 
        }
        .btn-close { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: rgba(0,0,0,0.6); 
            color: white; 
            width: 40px; 
            height: 40px; 
            line-height: 40px; 
            text-align: center; 
            border-radius: 5px; 
            cursor: pointer; 
            z-index: 600; 
            font-weight: bold; 
            font-size: 20px;
            transition: background 0.2s;
        }
        .btn-close:hover { background: #d32f2f; }
        
        /* Overlay Box */
        .job-overlay { 
            position: absolute; 
            bottom: 30px; 
            right: 30px; 
            background: rgba(0, 0, 0, 0.9); 
            padding: 25px; 
            border-radius: 8px; 
            color: white; 
            border-left: 5px solid #ffcc00; 
            width: 300px; 
            z-index: 500; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .btn-start { 
            margin-top: 20px; 
            background: #ffcc00; 
            color: #111; 
            border: none; 
            width: 100%; 
            padding: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
            text-transform: uppercase;
            font-size: 14px;
        }
        .btn-start:hover { background: #e6b800; }
        .stat { 
            display: flex; 
            justify-content: space-between; 
            margin: 8px 0; 
            color: #aaa; 
            font-size: 14px;
        }
        .stat span { color: white; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="header">Bus Schedule</div>
            <div class="route-list" id="routeList"></div>
        </div>
        <div class="content">
            <div class="btn-close" onclick="closeMenu()">×</div>
            <div id="map"></div>
            <div id="details" class="job-overlay" style="display: none;">
                <h2 id="rTitle" style="margin:0 0 15px 0; color:#ffcc00; font-size: 1.5rem;">Select Route</h2>
                <div class="stat">Stops: <span id="rStops">--</span></div>
                <div class="stat">Est. Pay: <span id="rPay">--</span></div>
                <div class="stat">Distance: <span id="rDist">--</span></div>
                <button class="btn-start" onclick="startJob()">Start Shift</button>
            </div>
        </div>
    </div>

    <script src="../lib/leaflet/leaflet.js"></script>
    
    <script src="../lib/customMap.js"></script>

    <script>
        let gameMap = null;
        let selectedRouteIndex = -1;
        let currentPolyline = null;

        // Bus Icon (reusing marker icon or custom if you have one)
        const busIconOptions = {
            iconUrl: '../lib/leaflet/images/marker-icon.png', 
            iconSize: [25, 41],  
            iconAnchor: [12, 41], 
            popupAnchor: [1, -34] 
        };

        function loadBusRoutes(routesJson) {
            // Init map using your custom class
            if (!gameMap) {
                gameMap = new GameMap('map', { initialZoom: 3 });
                gameMap.disableInteraction(); // Keep static like garbage
            }

            const routes = JSON.parse(routesJson);
            const list = document.getElementById('routeList');
            list.innerHTML = '';

            routes.forEach((route, index) => {
                const div = document.createElement('div');
                div.className = 'route-item';
                div.innerHTML = `
                    <span>${route.name}</span>
                    <span style="color:#ffcc00; font-weight:bold;">$${route.pay}</span>
                `;
                div.onclick = () => selectRoute(div, route, index);
                list.appendChild(div);
            });
        }

        function selectRoute(element, route, index) {
            // UI Updates
            document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('details').style.display = 'block';
            document.getElementById('rTitle').innerText = route.name;
            document.getElementById('rStops').innerText = route.stopsCount + " Stops";
            document.getElementById('rPay').innerText = "$" + (route.pay || 0).toLocaleString();
            document.getElementById('rDist').innerText = (route.distance ? route.distance.toFixed(2) : "0.00") + " km";
            selectedRouteIndex = index;

            // 1. Draw Markers using CustomMap class
            // Note: route.stops contains objects like {x, y, z}
            gameMap.setMarkers(route.stops, busIconOptions);

            // 2. Draw Polyline (Route Line) - CustomMap doesn't have this, so we access raw map
            const rawMap = gameMap.getInstance();
            
            if (currentPolyline) {
                rawMap.removeLayer(currentPolyline);
            }

            // Convert GTA coords (x,y) to Leaflet lat/lng (y,x)
            const latLngs = route.stops.map(p => [p.y, p.x]);
            
            currentPolyline = L.polyline(latLngs, {
                color: '#ffcc00',
                weight: 4,
                opacity: 0.8,
                dashArray: '10, 10'
            }).addTo(rawMap);
        }

        function startJob() {
            if(selectedRouteIndex > -1) {
                if ('mp' in window) mp.trigger('client:bus:select', selectedRouteIndex);
            }
        }

        function closeMenu() {
            if ('mp' in window) mp.trigger('client:bus:closeMenu');
        }
    </script>
</body>
</html>
