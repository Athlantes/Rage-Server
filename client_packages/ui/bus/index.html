<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../lib/leaflet/leaflet.css">
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: rgba(0,0,0,0.85); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; user-select: none; }
        
        /* Main Window: Two Columns */
        .container { 
            display: flex; 
            width: 900px; 
            height: 600px; 
            background: #1a1a1a; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8); 
            border: 1px solid #333;
        }

        /* LEFT: Route List */
        .sidebar { width: 350px; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .header { background: #e0ac00; color: #1a1a1a; padding: 25px; text-align: left; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .header p { margin: 5px 0 0 0; font-size: 14px; font-weight: 600; opacity: 0.8; }

        .list { flex: 1; overflow-y: auto; padding: 10px; background: #222; }
        
        .route-item { 
            background: #2a2a2a; 
            margin-bottom: 8px; 
            padding: 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.2s; 
            border-left: 4px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .route-item:hover { background: #333; transform: translateX(5px); }
        .route-item.active { background: #383838; border-left: 4px solid #e0ac00; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .route-info h3 { margin: 0 0 4px 0; font-size: 16px; color: #fff; }
        .route-info span { font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; }
        .route-price { color: #4caf50; font-weight: bold; font-size: 15px; }

        /* Actions */
        .actions { padding: 20px; background: #1a1a1a; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px; border: none; font-weight: bold; font-size: 14px; text-transform: uppercase; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .btn-select { background: #e0ac00; color: black; opacity: 0.5; pointer-events: none; } /* Disabled by default */
        .btn-select.ready { opacity: 1; pointer-events: auto; }
        .btn-select:hover { background: #ffc400; }
        .btn-cancel { background: #c62828; color: white; }
        .btn-cancel:hover { background: #b71c1c; }

        /* RIGHT: Map */
        .map-wrapper { flex: 1; position: relative; background: #0fa8d2; } /* Placeholder Blue */
        #map { width: 100%; height: 100%; background: #151515; }
        
        /* Leaflet Customization */
        .leaflet-container { background: #151515 !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="header">
            <h1>Bus Schedule</h1>
            <p>Select a route to view path</p>
        </div>
        <div class="list" id="routeList">
            </div>
        <div class="actions">
            <button class="btn btn-cancel" onclick="closeMenu()">Exit</button>
            <button class="btn btn-select" id="startBtn" onclick="startRoute()">Select Route</button>
        </div>
    </div>

    <div class="map-wrapper">
        <div id="map"></div>
    </div>
</div>

<script src="../lib/leaflet/leaflet.js"></script>

<script>
    let map = null;
    let currentPolyline = null;
    let selectedRouteIndex = -1;

    // Initialize Map (Standard GTA V Atlas configuration)
    function initMap() {
        // Simple CRS for flat game maps
        map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            maxZoom: 2,
            zoomControl: false,
            attributionControl: false
        });

        // Bounds for GTA V map roughly
        const bounds = [[-4000, -4000], [8000, 8000]];
        const image = L.imageOverlay('../lib/leaflet/images/layers.png', bounds).addTo(map); // Using your layer image
        map.fitBounds([[-4000, -4000], [4000, 4000]]);
        map.setView([0, 0], -1);
    }

    function loadBusRoutes(jsonStr) {
        if (!map) initMap();
        
        const routes = JSON.parse(jsonStr);
        const list = document.getElementById('routeList');
        list.innerHTML = "";

        if (routes.length === 0) {
            list.innerHTML = "<div style='padding:20px; color:#666;'>No routes found.</div>";
            return;
        }

        routes.forEach((r, index) => {
            const el = document.createElement('div');
            el.className = 'route-item';
            el.id = `route-${index}`;
            el.onclick = () => previewRoute(index, r.path);
            el.innerHTML = `
                <div class="route-info">
                    <h3>${r.name}</h3>
                    <span>${r.stopsCount} Stops</span>
                </div>
                <div class="route-price">$${r.pay}</div>
            `;
            list.appendChild(el);
        });
    }

    function previewRoute(index, pathData) {
        selectedRouteIndex = index;

        // 1. UI Updates
        document.querySelectorAll('.route-item').forEach(d => d.classList.remove('active'));
        document.getElementById(`route-${index}`).classList.add('active');
        
        const btn = document.getElementById('startBtn');
        btn.classList.add('ready');
        btn.innerText = "Start Job";

        // 2. Map Updates
        if (currentPolyline) map.removeLayer(currentPolyline);

        // Convert Game Coords (x, y) to Leaflet (y, x)
        // Note: GTA V maps usually map Y to Latitude and X to Longitude
        const latLngs = pathData.map(p => [p.y, p.x]);

        currentPolyline = L.polyline(latLngs, {
            color: '#e0ac00',
            weight: 5,
            opacity: 0.8,
            smoothFactor: 1
        }).addTo(map);

        // Center map on the route
        map.fitBounds(currentPolyline.getBounds(), { padding: [50, 50] });
    }

    function startRoute() {
        if (selectedRouteIndex === -1) return;
        if ('mp' in window) mp.trigger('client:bus:select', selectedRouteIndex);
    }

    function closeMenu() {
        if ('mp' in window) mp.trigger('client:bus:closeMenu');
    }
</script>

</body>
</html>
