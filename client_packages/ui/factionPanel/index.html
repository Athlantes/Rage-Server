<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faction Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #e0e0e0;
  }

  .panel {
    background: linear-gradient(160deg, #0d1117 0%, #161b22 100%);
    border: 1px solid #30363d;
    border-radius: 12px;
    width: 720px;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,0.8);
  }

  /* ── Header ── */
  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid #21262d;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .faction-badge {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
    letter-spacing: 0.5px;
  }
  .header-info h1 { font-size: 20px; font-weight: 700; }
  .header-info .sub { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .type-badge {
    margin-left: auto;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .type-law      { background: #0d419d22; border: 1px solid #1f6feb; color: #58a6ff; }
  .type-criminal { background: #6e040422; border: 1px solid #da3633; color: #f85149; }
  .type-civilian { background: #0a3d0a22; border: 1px solid #238636; color: #3fb950; }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    border-bottom: 1px solid #21262d;
    padding: 0 16px;
  }
  .tab {
    padding: 12px 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: #8b949e;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab:hover { color: #c9d1d9; }
  .tab.active { color: #e6edf3; border-bottom-color: var(--accent, #58a6ff); }

  /* ── Content ── */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    scrollbar-width: thin;
    scrollbar-color: #30363d transparent;
  }

  /* ── Member list ── */
  .member-list { display: flex; flex-direction: column; gap: 6px; }
  .member-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    transition: border-color 0.15s;
  }
  .member-item:hover { border-color: #30363d; }
  .online-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .online-dot.online  { background: #3fb950; box-shadow: 0 0 6px #3fb95066; }
  .online-dot.offline { background: #484f58; }
  .member-name { font-size: 14px; font-weight: 500; flex: 1; }
  .rank-pill {
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    background: #21262d;
    border: 1px solid #30363d;
  }
  .member-actions { display: flex; gap: 6px; }
  .btn-sm {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .btn-promote { background: #1f6feb22; border-color: #1f6feb; color: #58a6ff; }
  .btn-promote:hover { background: #1f6feb44; }
  .btn-demote  { background: #6e040422; border-color: #da3633; color: #f85149; }
  .btn-demote:hover  { background: #6e040444; }
  .btn-kick    { background: #6e040422; border-color: #da3633; color: #f85149; }
  .btn-kick:hover    { background: #6e040444; }

  /* ── Info tab ── */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .info-card {
    padding: 16px;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
  }
  .info-card .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .info-card .value { font-size: 18px; font-weight: 700; }

  .desc-box {
    margin-top: 14px;
    padding: 14px;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    font-size: 13px;
    color: #8b949e;
    line-height: 1.6;
  }

  .rank-table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  .rank-table th {
    text-align: left;
    padding: 8px 12px;
    font-size: 11px;
    text-transform: uppercase;
    color: #8b949e;
    border-bottom: 1px solid #21262d;
  }
  .rank-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #21262d22; }
  .rank-table tr:last-child td { border-bottom: none; }
  .rank-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }

  /* ── Your rank card ── */
  .my-rank-card {
    margin-bottom: 16px;
    padding: 16px 20px;
    border-radius: 10px;
    background: linear-gradient(135deg, #161b2288, #0d111788);
    border: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .my-rank-icon {
    font-size: 28px;
  }
  .my-rank-text .name  { font-size: 16px; font-weight: 700; }
  .my-rank-text .level { font-size: 12px; color: #8b949e; margin-top: 2px; }

  /* ── Close button ── */
  .btn-close {
    margin: 16px 24px;
    padding: 10px;
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #8b949e;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .btn-close:hover { background: #30363d; color: #e6edf3; }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #21262d;
  }

  .empty-state {
    text-align: center;
    color: #484f58;
    font-size: 14px;
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="panel" id="panel">
  <div class="header">
    <div class="faction-badge" id="factionBadge">?</div>
    <div class="header-info">
      <h1 id="factionName">Loading...</h1>
      <div class="sub" id="factionSub">—</div>
    </div>
    <div class="type-badge" id="typeBadge">—</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('info')">Overview</div>
    <div class="tab" onclick="switchTab('members')">Members</div>
    <div class="tab" onclick="switchTab('ranks')">Ranks</div>
  </div>

  <div class="content" id="contentArea">
    <div class="empty-state">Loading...</div>
  </div>

  <div class="btn-close" onclick="closePanel()">✕ Close</div>
</div>

<script>
let data = null;
let currentTab = 'info';

function loadData(d) {
  data = d;
  if (!data.inFaction) {
    document.getElementById('factionName').textContent = 'Not in a Faction';
    document.getElementById('factionSub').textContent = 'You are not currently enlisted.';
    document.getElementById('typeBadge').textContent = '—';
    renderNoFaction();
    return;
  }
  document.getElementById('factionName').textContent = `${data.name} [${data.tag}]`;
  document.getElementById('factionSub').textContent = `${data.members.length}/${data.memberCap} members`;
  document.getElementById('typeBadge').textContent = data.type;
  document.getElementById('typeBadge').className = `type-badge type-${data.type}`;

  const badge = document.getElementById('factionBadge');
  badge.textContent = data.tag.substring(0, 2);
  badge.style.background = `${data.color}22`;
  badge.style.border = `1px solid ${data.color}88`;
  badge.style.color = data.color;

  document.querySelector('.panel').style.setProperty('--accent', data.color);
  renderTab(currentTab);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['info','members','ranks'][i] === tab);
  });
  renderTab(tab);
}

function renderTab(tab) {
  if (!data?.inFaction) return;
  if (tab === 'info')    renderInfo();
  if (tab === 'members') renderMembers();
  if (tab === 'ranks')   renderRanks();
}

function renderInfo() {
  const myRankObj = data.ranks[data.rank - 1];
  const typeIcons = { law: '🚔', criminal: '💀', civilian: '🔧' };
  document.getElementById('contentArea').innerHTML = `
    <div class="my-rank-card">
      <div class="my-rank-icon">${typeIcons[data.type] || '🏛️'}</div>
      <div class="my-rank-text">
        <div class="name" style="color:${myRankObj.color}">${myRankObj.name}</div>
        <div class="level">Rank ${data.rank}/5 · Salary $${myRankObj.salary.toLocaleString()}/payday</div>
      </div>
    </div>
    <div class="info-grid">
      <div class="info-card">
        <div class="label">Members</div>
        <div class="value">${data.members.length} <span style="font-size:13px;color:#8b949e">/ ${data.memberCap}</span></div>
      </div>
      <div class="info-card">
        <div class="label">Online</div>
        <div class="value" style="color:#3fb950">${data.members.filter(m=>m.online).length}</div>
      </div>
    </div>
    <div class="desc-box">${data.description || '<em>No description set.</em>'}</div>
  `;
}

function renderMembers() {
  const myRank = data.rank;
  const items = data.members.map(m => {
    const canManage = myRank >= 4 && m.rank < myRank;
    return `
      <div class="member-item">
        <div class="online-dot ${m.online ? 'online' : 'offline'}"></div>
        <div class="member-name">${m.username}</div>
        <div class="rank-pill" style="color:${m.rankColor};border-color:${m.rankColor}44">${m.rankName}</div>
        ${canManage ? `
          <div class="member-actions">
            <button class="btn-sm btn-promote" onclick="promote(${m.userId}, ${m.rank})">↑</button>
            <button class="btn-sm btn-demote"  onclick="demote(${m.userId}, ${m.rank})">↓</button>
            <button class="btn-sm btn-kick"    onclick="kick(${m.userId}, '${m.username}')">Kick</button>
          </div>` : ''}
      </div>`;
  }).join('');
  document.getElementById('contentArea').innerHTML = `
    <div class="section-title">Members (${data.members.length})</div>
    <div class="member-list">${items || '<div class="empty-state">No members.</div>'}</div>
  `;
}

function renderRanks() {
  const rows = data.ranks.map(r => `
    <tr>
      <td><span class="rank-dot" style="background:${r.color}"></span>Rank ${r.rank}</td>
      <td style="color:${r.color};font-weight:600">${r.name}</td>
      <td style="color:#3fb950">$${r.salary.toLocaleString()}</td>
    </tr>
  `).join('');
  document.getElementById('contentArea').innerHTML = `
    <div class="section-title">Rank Structure</div>
    <table class="rank-table">
      <thead><tr><th>Level</th><th>Title</th><th>Salary / Payday</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderNoFaction() {
  document.getElementById('contentArea').innerHTML = `
    <div class="empty-state">
      <div style="font-size:40px;margin-bottom:12px">🏛️</div>
      <div>You are not in a faction.</div>
      <div style="margin-top:6px;font-size:12px">Ask an admin or officer to enlist you.</div>
    </div>
  `;
}

function promote(userId, currentRank) {
  if (currentRank >= 5) return alert('Already at max rank.');
  mp.trigger('server:faction:setRank', userId, currentRank + 1);
  setTimeout(() => mp.trigger('server:faction:openPanel'), 300);
}

function demote(userId, currentRank) {
  if (currentRank <= 1) return alert('Already at min rank.');
  mp.trigger('server:faction:setRank', userId, currentRank - 1);
  setTimeout(() => mp.trigger('server:faction:openPanel'), 300);
}

function kick(userId, name) {
  if (!confirm(`Kick ${name} from the faction?`)) return;
  mp.trigger('server:faction:kick', userId);
  setTimeout(() => mp.trigger('server:faction:openPanel'), 300);
}

function closePanel() {
  mp.trigger('faction:panel:close');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
</script>
</body>
</html>
