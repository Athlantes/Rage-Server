<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tuning Shop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:transparent;color:#e4e6eb;user-select:none;cursor:default}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.15)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}

:root{
    --bg:rgba(12,14,18,.94);--bg2:rgba(20,23,30,.96);
    --card:rgba(28,32,42,.95);--card-h:rgba(38,44,58,.95);--card-sel:rgba(0,168,255,.07);
    --bdr:rgba(255,255,255,.06);--bdr-h:rgba(255,255,255,.12);
    --txt:#e4e6eb;--txt2:#a0a5b8;--txt3:#6b7084;
    --accent:#00a8ff;--ok:#2ecc71;--danger:#ff4757;--warn:#f0a500;--caution:#ffaa00;
    --drift:#ff6b35;--race:#00a8ff;--drag:#ff4757;--offroad:#8b5e3c;--street:#8aaa30;
    --common:#a0a0a0;--uncommon:#2ecc71;--rare:#3498db;--epic:#9b59b6;--legendary:#f1c40f;
    --zone-safe:rgba(46,204,113,.22);--zone-caution:rgba(240,165,0,.28);--zone-danger:rgba(255,71,87,.32);
    --r:10px;--rs:6px;
    --sidebar-w:270px;--panel-w:420px;--topbar-h:56px;
}

/* TOP BAR */
.top-bar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;padding:0 20px;gap:14px;background:var(--bg);border-bottom:1px solid var(--bdr);z-index:100}
.shop-logo{font-size:20px;opacity:.65}
.shop-title{font-size:15px;font-weight:700;letter-spacing:.5px}
.divider{width:1px;height:24px;background:var(--bdr-h)}
.tab-group{display:flex;gap:3px}
.tab-btn{padding:8px 18px;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--txt3);border:1px solid transparent;transition:.15s}
.tab-btn:hover{color:var(--txt2);background:rgba(255,255,255,.04)}
.tab-btn.active{color:var(--accent);background:rgba(0,168,255,.08);border-color:rgba(0,168,255,.15)}
.spacer{flex:1}
.pi-badge{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.pi-label{color:var(--txt3);font-size:12px}
.pi-class{padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700;color:#fff}
.tendency-badge{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:14px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.06);transition:all .35s}
.tendency-badge.drift-mode{animation:driftPulse 2s ease-in-out infinite}
@keyframes driftPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.0)}50%{box-shadow:0 0 10px 3px rgba(255,107,53,.4)}}
.tend-icon{font-size:14px}
.tend-pct{opacity:.55;font-size:11px}
.cash-display{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700;color:var(--ok)}
.close-btn{width:34px;height:34px;border:none;border-radius:var(--rs);background:rgba(255,75,87,.1);color:var(--danger);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.close-btn:hover{background:rgba(255,75,87,.25)}

/* DRIFT MODE BANNER */
.drift-mode-banner{display:none;position:fixed;top:calc(var(--topbar-h));left:var(--sidebar-w);right:var(--panel-w);z-index:95;padding:7px 20px;background:linear-gradient(90deg,rgba(255,107,53,.18),rgba(255,107,53,.08));border-bottom:2px solid rgba(255,107,53,.4);font-size:12px;font-weight:700;color:var(--drift);letter-spacing:.5px;text-align:center}
.drift-mode-banner.visible{display:block}

/* TAB CONTENT */
.tab-content{display:none}
.tab-content.visible{display:block}

/* SIDEBAR */
.sidebar{position:fixed;left:10px;top:calc(var(--topbar-h) + 8px);bottom:10px;width:var(--sidebar-w);overflow-y:auto;overflow-x:hidden;background:var(--bg);border-radius:var(--r);border:1px solid var(--bdr);z-index:90}
.group-label{padding:16px 16px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--txt3)}
.cat-item{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.cat-item:hover{background:rgba(255,255,255,.03)}
.cat-item.active{background:var(--card-sel);border-left-color:var(--accent)}
.cat-item.locked-cat{opacity:.6;cursor:pointer}
.cat-item.locked-cat:hover{background:rgba(255,255,255,.02)}
.cat-icon{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.cat-info{flex:1;min-width:0}
.cat-name{font-size:13px;font-weight:600;display:block;margin-bottom:3px}
.cat-meta{display:flex;align-items:center;gap:7px}
.cat-bar{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;max-width:80px}
.cat-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .3s}
.cat-stage{font-size:11px;color:var(--txt3);font-weight:600;white-space:nowrap}
.cat-brand{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap}
.cat-lock-icon{font-size:12px;color:var(--txt3);opacity:.7}

/* MAIN PANEL */
.main-panel{position:fixed;right:10px;top:calc(var(--topbar-h) + 8px);bottom:10px;width:var(--panel-w);overflow-y:auto;overflow-x:hidden;background:var(--bg);border-radius:var(--r);border:1px solid var(--bdr);z-index:90;display:flex;flex-direction:column}
.empty-state{display:flex;align-items:center;justify-content:center;flex:1;color:var(--txt3);font-size:14px}

/* Part header */
.part-header{display:flex;align-items:center;gap:10px;padding:20px 22px 14px;border-bottom:1px solid var(--bdr)}
.ph-icon{font-size:26px}
.ph-name{font-size:20px;font-weight:700;flex:1}
.ph-stage{font-size:13px;font-weight:700;padding:5px 12px;border-radius:5px}
.ph-stage.active-stage{background:rgba(0,168,255,.1);color:var(--accent)}
.ph-stage.maxed{background:rgba(240,165,0,.1);color:var(--warn)}
.ph-stage.capped{background:rgba(240,165,0,.07);color:var(--caution)}
.ph-stage.stock{background:rgba(255,255,255,.05);color:var(--txt3)}

/* Description */
.part-desc{padding:14px 22px;font-size:13px;color:var(--txt2);line-height:1.55;border-bottom:1px solid var(--bdr)}

/* Stage progress */
.progress-section{padding:14px 22px;border-bottom:1px solid var(--bdr)}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.progress-bar{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .4s ease}
.progress-fill.normal{background:var(--accent)}
.progress-fill.maxed{background:var(--warn)}
.progress-fill.capped{background:var(--caution)}
.progress-cap-label{font-size:10px;font-weight:700;color:var(--caution);white-space:nowrap}
.progress-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--txt3);font-weight:500}
.cap-notice{font-size:11px;color:var(--caution);margin-top:5px;padding:5px 8px;background:rgba(240,165,0,.07);border-radius:4px;border-left:2px solid var(--caution)}

/* LOCKED CATEGORY PANEL */
.locked-panel{padding:22px;flex:1;display:flex;flex-direction:column;gap:16px}
.lp-icon{font-size:36px;text-align:center;opacity:.5}
.lp-title{font-size:16px;font-weight:700;text-align:center;color:var(--txt2)}
.lp-reason{font-size:13px;color:var(--txt3);text-align:center;line-height:1.55}
.lp-progress{margin-top:8px}
.lp-prog-label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:6px}
.lp-prog-bar{width:100%;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.lp-prog-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .4s}
.lp-hint{font-size:12px;color:var(--txt3);text-align:center;line-height:1.5;margin-top:4px}

/* BRAND SECTION */
.brand-section{padding:20px 22px}
.bs-title{font-size:15px;font-weight:700;margin-bottom:4px}
.bs-subtitle{font-size:12px;color:var(--txt3);margin-bottom:16px;line-height:1.4}
.brand-card{width:100%;padding:16px 18px;margin-bottom:10px;background:var(--card);border-radius:var(--rs);border:2px solid var(--bdr);cursor:pointer;transition:all .15s}
.brand-card:last-child{margin-bottom:0}
.brand-card:hover{background:var(--card-h);border-color:var(--bdr-h)}
.brand-card.selected{border-color:var(--accent);background:var(--card-sel)}
.bc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bc-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.bc-name{font-size:15px;font-weight:700;flex:1}
.bc-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:4px}
.bc-surcharge{font-size:11px;color:var(--caution);font-weight:700}
.bc-pi-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,.08);color:var(--txt3);border:1px solid var(--bdr)}
.bc-desc{font-size:13px;color:var(--txt2);line-height:1.5;margin-bottom:10px}
.bc-cost{display:flex;align-items:center;gap:14px;font-size:13px}
.bc-money{color:var(--ok);font-weight:700}
.bc-parts{color:var(--txt2);font-weight:500}

/* LOCKED BRAND (brand lock) */
.locked-section{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--bdr);background:rgba(255,255,255,.015)}
.lock-icon{font-size:15px;color:var(--txt3)}
.lock-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.lock-name{font-size:14px;font-weight:700;flex:1}
.lock-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.lock-reset{font-size:11px;color:var(--txt3);cursor:pointer;padding:5px 12px;border-radius:4px;border:1px solid var(--bdr);background:transparent;transition:.15s}
.lock-reset:hover{color:var(--danger);border-color:rgba(255,75,87,.3);background:rgba(255,75,87,.06)}
.lock-reset.confirm{color:#fff;border-color:var(--danger);background:var(--danger)}

/* ═══ ADVANCED SLIDERS ═══ */
.slider-section{padding:18px 22px;border-bottom:1px solid var(--bdr)}
.ss-title{font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:14px}
.slider-row{margin-bottom:20px}
.slider-row:last-child{margin-bottom:0}
.sr-top{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.sr-icon{font-size:14px}
.sr-name{font-size:13px;font-weight:600;flex:1}
.sr-val{font-size:12px;font-weight:700;min-width:54px;text-align:right;transition:color .15s}
.sr-val.val-ok{color:var(--ok)}
.sr-val.val-caution{color:var(--caution)}
.sr-val.val-danger{color:var(--danger)}
.sr-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);margin-bottom:6px}

/* Zoned slider track */
.slider-track{position:relative;width:100%;height:10px;border-radius:5px;cursor:pointer;overflow:visible}
.slider-zones{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:5px;overflow:hidden;pointer-events:none}
.zone-seg{position:absolute;top:0;bottom:0}
.style-zone-overlay{position:absolute;top:0;bottom:0;border-radius:0;pointer-events:none;opacity:.55}
.slider-fill{position:absolute;top:0;left:0;height:100%;border-radius:5px;background:rgba(255,255,255,.18);pointer-events:none;transition:width .04s}
.slider-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:none;transition:border-color .15s}
.slider-thumb.thumb-caution{border-color:var(--caution)}
.slider-thumb.thumb-danger{border-color:var(--danger)}

/* Dynamic warning */
.sr-warn{font-size:11px;margin-top:6px;padding:5px 9px;border-radius:4px;line-height:1.4;display:none}
.sr-warn.caution{display:block;background:rgba(240,165,0,.1);color:var(--caution);border-left:2px solid var(--caution)}
.sr-warn.danger{display:block;background:rgba(255,71,87,.1);color:var(--danger);border-left:2px solid var(--danger)}

/* Style zone legend */
.style-zone-legend{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:10px;color:var(--txt3)}
.szl-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* Slider actions */
.slider-actions{display:flex;gap:8px;margin-top:18px}
.btn-s{flex:1;padding:9px 0;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.12s}
.btn-s.save{background:rgba(0,168,255,.15);color:var(--accent)}
.btn-s.save:hover{background:rgba(0,168,255,.28)}
.btn-s.reset{background:rgba(255,255,255,.04);color:var(--txt3)}
.btn-s.reset:hover{background:rgba(255,255,255,.09)}

/* UPGRADE SECTION */
.upgrade-section{padding:18px 22px;margin-top:auto}
.us-label{font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:10px}
.us-cost{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;font-size:13px}
    /* ── Item images in upgrade requirements ── */
    .uc-item-img{width:22px;height:22px;border-radius:3px;object-fit:contain;flex-shrink:0;padding:1px;background:rgba(255,255,255,.05);}
    .uc-item-img.rar-common    {box-shadow:inset 0 0 0 1px #a0a0a0;}
    .uc-item-img.rar-uncommon  {box-shadow:inset 0 0 0 1px #2ecc71;}
    .uc-item-img.rar-rare      {box-shadow:inset 0 0 0 1px #3498db;}
    .uc-item-img.rar-epic      {box-shadow:inset 0 0 0 1px #9b59b6;}
    .uc-item-img.rar-legendary {box-shadow:inset 0 0 0 1px #f1c40f;}

.us-item { display:block; }
.us-item.ok  { color: var(--succ); }
.us-item.bad { color: var(--dngr); }

.uc-item{display:flex;align-items:center;gap:6px}
.uc-lbl{color:var(--txt3);font-size:11px;font-weight:600}
.uc-val{font-weight:700}
.uc-val.has{color:var(--ok)}
.uc-val.miss{color:var(--danger)}
.btn-upgrade{width:100%;padding:14px 0;border-radius:var(--rs);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;border:none;transition:.15s}
.btn-upgrade.ready{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff}
.btn-upgrade.ready:hover{filter:brightness(1.12);transform:scale(1.005)}
.btn-upgrade.locked{background:rgba(255,255,255,.04);color:var(--txt3);cursor:not-allowed}
.btn-upgrade.maxed{background:rgba(240,165,0,.08);color:var(--warn);cursor:default}
.btn-upgrade.capped{background:rgba(240,165,0,.07);color:var(--caution);cursor:default}

/* OPTIONS GRID */
.opts-header{padding:18px 22px 12px;border-bottom:1px solid var(--bdr)}
.opts-title{font-size:18px;font-weight:700}
.opts-sub{font-size:12px;color:var(--txt3);margin-top:3px}
.option-grid{display:flex;flex-wrap:wrap;gap:8px;padding:16px 22px}
.opt-card{width:calc(33.33% - 6px);min-height:64px;padding:10px;background:var(--card);border-radius:var(--rs);border:2px solid var(--bdr);cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.opt-card:hover{background:var(--card-h);border-color:var(--bdr-h)}
.opt-card.selected{border-color:var(--accent);background:var(--card-sel)}
.opt-card.installed{border-color:var(--ok);background:rgba(46,204,113,.06)}
.opt-card.previewing{border-color:var(--warn);background:rgba(240,165,0,.06)}
.opt-card .oc-name{font-size:12px;font-weight:600}
.opt-card .oc-price{font-size:11px;color:var(--ok);font-weight:600;margin-top:3px}
.opt-card .oc-badge{position:absolute;top:3px;right:3px;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px}
.opt-card.installed .oc-badge{background:rgba(46,204,113,.2);color:var(--ok)}
.opt-card.previewing .oc-badge{background:rgba(240,165,0,.2);color:var(--warn)}
.action-footer{padding:16px 22px;border-top:1px solid var(--bdr);margin-top:auto}

/* COLOR GRID */
.color-grid{display:flex;flex-wrap:wrap;gap:7px;padding:16px 22px}
.color-swatch{width:38px;height:38px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:.15s}
.color-swatch:hover{transform:scale(1.08);border-color:rgba(255,255,255,.25)}
.color-swatch.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,168,255,.3)}
.color-info{padding:12px 22px;border-top:1px solid var(--bdr)}
.ci-name{font-size:14px;font-weight:600;margin-bottom:4px}
.ci-price{font-size:13px;color:var(--ok);font-weight:600}

/* RGB PICKER */
.rgb-section{padding:18px 22px;border-top:1px solid var(--bdr)}
.rgb-title{font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:12px}
.rgb-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rgb-label{width:14px;font-size:13px;font-weight:700;text-align:center}
.rgb-slider-wrap{flex:1;position:relative;height:8px;background:rgba(255,255,255,.07);border-radius:4px;cursor:pointer}
.rgb-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;pointer-events:none}
.rgb-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.3);box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.rgb-val{width:36px;font-size:12px;font-weight:600;text-align:right;color:var(--txt2)}
.rgb-preview{width:100%;height:40px;border-radius:var(--rs);margin-top:12px;border:1px solid var(--bdr)}
.rgb-hex{text-align:center;margin-top:6px;font-size:12px;color:var(--txt3);font-weight:600}

/* SPECIAL */
.spec-toggle{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--bdr)}
.spec-toggle label{font-size:13px;font-weight:600;flex:1}
.toggle-box{width:42px;height:22px;border-radius:11px;background:rgba(255,255,255,.1);position:relative;cursor:pointer;transition:.2s}
.toggle-box.on{background:var(--accent)}
.toggle-knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.2s}
.toggle-box.on .toggle-knob{left:22px}
.neon-sides{display:flex;gap:8px;padding:14px 22px;border-bottom:1px solid var(--bdr);flex-wrap:wrap}
.neon-btn{padding:8px 14px;border-radius:var(--rs);background:var(--card);border:2px solid var(--bdr);cursor:pointer;font-size:12px;font-weight:600;color:var(--txt2);transition:.15s}
.neon-btn.on{border-color:var(--accent);color:var(--accent);background:var(--card-sel)}

/* TOAST */
.toast-container{position:fixed;top:calc(var(--topbar-h) + 14px);left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{padding:10px 22px;border-radius:var(--rs);font-size:13px;font-weight:600;backdrop-filter:blur(10px);animation:toastIn .3s ease-out;pointer-events:auto;border:1px solid}
.toast.success{background:rgba(46,204,113,.18);color:#2ecc71;border-color:rgba(46,204,113,.3)}
.toast.error{background:rgba(255,71,87,.18);color:#ff4757;border-color:rgba(255,71,87,.3)}
.toast.info{background:rgba(0,168,255,.18);color:#00a8ff;border-color:rgba(0,168,255,.3)}
.toast.warn{background:rgba(240,165,0,.18);color:#f0a500;border-color:rgba(240,165,0,.3)}
.toast.fadeOut{animation:toastOut .3s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .2s ease-out}
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- DRIFT MODE BANNER -->
<div class="drift-mode-banner" id="driftBanner">🌀 DRIFT MODE — Handling profile active. Rear grip reduced, oversteer promoted.</div>

<!-- TOP BAR -->
<div class="top-bar">
    <span class="shop-logo">⚙</span>
    <span class="shop-title">LOS SANTOS CUSTOMS</span>
    <span class="divider"></span>
    <div class="tab-group">
        <button class="tab-btn active" data-tab="performance">Performance</button>
        <button class="tab-btn" data-tab="visual">Visual</button>
        <button class="tab-btn" data-tab="paint">Paint</button>
        <button class="tab-btn" data-tab="special">Special</button>
    </div>

// ═════════════════════════════════════════════════════════════════════════════
// INIT
// ═════════════════════════════════════════════════════════════════════════════
function initTuning(json){
    DATA = typeof json==='string' ? JSON.parse(json) : json;
    selCat=null; selBrand=null; pendingSliders={}; resetPending=false;
    renderTopBar();
    renderPerfSidebar();
    renderPerfMain();
}

function updateTuning(json){
    var d = typeof json==='string' ? JSON.parse(json) : json;
    Object.assign(DATA,d);
    renderTopBar();
    renderPerfSidebar();
    if(selCat){ selBrand=null; pendingSliders={}; resetPending=false; renderPerfMain(); }
}

function updateCash(c){ if(DATA) DATA.playerCash=c; $('#cashValue').textContent=fmt(c); }

function updatePI(pi,cls,tendencyJson){
    if(DATA){
        DATA.pi=pi;
        DATA.piClass = typeof cls==='string' ? JSON.parse(cls) : cls;
        if(tendencyJson) DATA.tendency = typeof tendencyJson==='string' ? JSON.parse(tendencyJson) : tendencyJson;
    }
    renderTopBar();
}

function updateVisualData(visualData){
    // Called by second-pass scan to update mod counts without full re-init
    if(!DATA) return;
    var changed = false;
    for(var vk in visualData){
        if(!DATA.visualData||!DATA.visualData[vk]) continue;
        var newCount = visualData[vk].options || 0;
        if(DATA.visualData[vk].options !== newCount){
            DATA.visualData[vk].options = newCount;
            changed = true;
        }
    }
    if(changed && activeTab === 'visual'){
        renderVisSidebar();
        renderVisMain();
    }
}

function visualModConfirmed(modType, modIndex){
    if(!DATA||!DATA.visualData) return;
    for(var vk in DATA.visualData){
        if(DATA.visualData[vk].modType===modType){
            DATA.visualData[vk].current = modIndex;
            selVisIdx = modIndex;
            showToast('Mod installed!','success');
            renderVisMain(); renderVisSidebar();

        }
    }
}

// ═════════════════════════════════════════════════════════════════════════════
// SLIDER ZONE HELPERS
// ═════════════════════════════════════════════════════════════════════════════

/**
 * Build a CSS gradient string for the zone track background.
 * Segments: danger(red) | caution(yellow) | safe(green) | caution | danger
 */
function buildZoneGradient(zones){
    if(!zones||!zones.safe) return 'rgba(255,255,255,.07)';
    var s = zones.safe;
    var c = zones.caution||[0,1];
    var segs = [];
    if(c[0]>0)    segs.push('rgba(255,71,87,.25) 0%, rgba(255,71,87,.25) '+(c[0]*100).toFixed(1)+'%');
    if(s[0]>c[0]) segs.push('rgba(240,165,0,.28) '+(c[0]*100).toFixed(1)+'%, rgba(240,165,0,.28) '+(s[0]*100).toFixed(1)+'%');
    segs.push('rgba(46,204,113,.22) '+(s[0]*100).toFixed(1)+'%, rgba(46,204,113,.22) '+(s[1]*100).toFixed(1)+'%');
    if(s[1]<c[1]) segs.push('rgba(240,165,0,.28) '+(s[1]*100).toFixed(1)+'%, rgba(240,165,0,.28) '+(c[1]*100).toFixed(1)+'%');
    if(c[1]<1)    segs.push('rgba(255,71,87,.25) '+(c[1]*100).toFixed(1)+'%, rgba(255,71,87,.25) 100%');
    return 'linear-gradient(90deg,'+segs.join(',')+')';
}

/**
 * Get the zone state for a value: 'ok' | 'caution' | 'danger'
 */
function getZoneState(val, zones){
    if(!zones||!zones.safe) return 'ok';
    var s = zones.safe; var c = zones.caution||[0,1];
    if(val>=s[0]&&val<=s[1])  return 'ok';
    if(val>=c[0]&&val<=c[1])  return 'caution';
    return 'danger';
}

/**
 * Get the best style zone for a slider given the current dominant build style.
 */
function getStyleZone(sl, dominant){
    if(!sl.styleZones||!dominant||dominant==='balanced') return null;
    return sl.styleZones[dominant]||null;
}

/**
 * Get warn message for a value on a slider.
 */
function getWarnMsg(val, zones, sl){
    var state = getZoneState(val, zones);
    if(state==='ok') return null;
    var s = zones.safe;
    if(val<s[0]) return sl.warnLow||null;
    return sl.warnHigh||null;
}

// ═════════════════════════════════════════════════════════════════════════════
// PERFORMANCE SIDEBAR
// ═════════════════════════════════════════════════════════════════════════════
function renderPerfSidebar(){
    if(!DATA||!DATA.categories) return;
    var el = $('#perfSidebar'); el.innerHTML='';
    var ord = (DATA.perfGroups||{}).order||['power','drivetrain','handling','chassis','exclusive'];
    var lbl = (DATA.perfGroups||{}).labels||{};

    for(var gi=0;gi<ord.length;gi++){
        var grp=ord[gi];
        var anyInGroup=false;
        for(var ck in DATA.categories){ if(DATA.categories[ck].group===grp){ anyInGroup=true; break; } }
        if(!anyInGroup) continue;
        var h=document.createElement('div'); h.className='group-label'; h.textContent=lbl[grp]||grp; el.appendChild(h);

        for(var ck in DATA.categories){
            var c=DATA.categories[ck];
            if(c.group!==grp) continue;
            var isLocked = c.lockState&&c.lockState.locked;
            var r=document.createElement('div');
            r.className='cat-item'+(ck===selCat?' active':'')+(isLocked?' locked-cat':'');

            var pct = c.effectiveMax>0 ? Math.round((c.currentStage/c.effectiveMax)*100) : 0;
            var isStock=c.currentStage===0;
            var isMax=c.currentStage>=c.effectiveMax;

            var meta='';
            if(isLocked){
                meta='<span class="cat-stage" style="color:var(--txt3)">🔒 Locked</span>';
            } else if(isStock){
                meta='<span class="cat-stage" style="color:var(--txt3)">Stock</span>';
            } else {
                var brandTag='';
                if(c.currentVariant){
                    var v=(c.variants||{})[c.currentVariant];
                    if(v) brandTag='<span class="cat-brand" style="background:'+v.tagColor+'18;color:'+v.tagColor+'">'+v.tag+'</span>';
                }
                var capNote = c.currentStage>=c.maxStage ? '' : (c.currentStage>=c.effectiveMax ? ' 🔒' : '');
                meta='<div class="cat-bar"><div class="cat-fill" style="width:'+pct+'%;'+(isMax?'background:var(--warn)':'')+'">'
                    +'</div></div>'
                    +'<span class="cat-stage">'+c.currentStage+'/'+c.effectiveMax+capNote+'</span>'+brandTag;
            }

            r.innerHTML='<span class="cat-icon">'+c.icon+'</span>'
                +'<div class="cat-info"><span class="cat-name">'+c.name+'</span>'
                +'<div class="cat-meta">'+meta+'</div></div>';
            (function(key){
                r.addEventListener('click',function(){
                    selCat=key; selBrand=null; pendingSliders={}; resetPending=false;
                    renderPerfSidebar(); renderPerfMain();
                });
            })(ck);
            el.appendChild(r);
        }
    }
}

// PERFORMANCE MAIN PANEL
// ═════════════════════════════════════════════════════════════════════════════
function buildReqRows(req, price, canM) {
    if (!req) return '';
    var rows = '<div class="uc-item"><span class="uc-lbl">Cost</span><span class="uc-val '+(canM?'has':'miss')+'">$'+fmt(price)+'</span></div>';
    var items = req.items || [];
    for (var ii = 0; ii < items.length; ii++) {
        var it = items[ii]; var hasIt = it.playerHas||0; var needIt = it.count||1; var okIt = hasIt >= needIt;
        var rar = 'common';
        ['legendary','epic','rare','uncommon'].forEach(function(rv){ if(it.itemId && it.itemId.endsWith('_'+rv)) rar=rv; });
        var compBase = it.itemId.replace(/_(?:common|uncommon|rare|epic|legendary)$/, '');
        rows += '<div class="uc-item">'
            + '<img class="uc-item-img rar-'+rar+'" src="../items/'+compBase+'.png" onerror="this.src=\'../items/default.png\'">'
            + '<span class="uc-lbl" style="color:var(--'+rar+')">'+(it.name||it.itemId)+'</span>'
            + '<span class="uc-val '+(okIt?'has':'miss')+'">'+hasIt+'/'+needIt+'</span></div>';
    }
    return rows;
}
function canUpgradeReq(req, price, playerCash) {
    if (!req) return false;
    if (playerCash < price) return false;
    return (req.items||[]).every(function(it){ return (it.playerHas||0) >= it.count; });
}

function renderPerfMain(){
    var panel=$('#perfMain');
    if(!DATA||!selCat){ panel.innerHTML='<div class="empty-state">Select a category to begin</div>'; return; }
    var c=DATA.categories[selCat];
    if(!c) return;

    var dominant = (DATA.tendency||{}).dominant||'balanced';
    var isLocked = c.lockState&&c.lockState.locked;

    // ── LOCKED PANEL ──
    if(isLocked){
        var ls = c.lockState;
        var html='<div class="part-header fade"><span class="ph-icon">'+c.icon+'</span>'
            +'<span class="ph-name">'+c.name+'</span>'
            +'<span class="ph-stage stock">🔒 Locked</span></div>';
        html+='<div class="locked-panel fade">';
        html+='<div class="lp-icon">🔒</div>';
        html+='<div class="lp-title">'+c.name+' Locked</div>';
        html+='<div class="lp-reason">'+ls.reason+'</div>';

        // Style progress bar
        if(ls.styleRequired&&ls.stylePercent!==undefined){
            var pct2=ls.stylePercent||0;
            var needed=ls.styleNeeded||60;
            var bs2=(DATA.buildStyles||{})[ls.styleRequired]||{color:'#aaa',name:ls.styleRequired};
            html+='<div class="lp-progress">';
            html+='<div class="lp-prog-label">'
                +'<span style="color:'+bs2.color+'">'+bs2.name+' Progress</span>'
                +'<span style="color:var(--txt3)">'+pct2+'% / '+needed+'%</span></div>';
            html+='<div class="lp-prog-bar"><div class="lp-prog-fill" style="width:'+Math.min(100,Math.round((pct2/needed)*100))+'%;background:'+bs2.color+'"></div></div>';
            html+='</div>';
            html+='<div class="lp-hint">Install more '+bs2.name.toLowerCase()+'-oriented parts to unlock this category.</div>';
        }
        html+='</div>';
        panel.innerHTML=html;
        return;
    }

    var isStock=c.currentStage===0;
    var isCapped=c.currentStage>=c.effectiveMax&&c.currentStage<c.maxStage;
    var isMax=c.currentStage>=c.maxStage;
    var variants=c.variants||{};
    var vKeys=Object.keys(variants);

    var stageLabel, stageClass;
    if(isStock){ stageLabel='Stock'; stageClass='stock'; }
    else if(isMax){ stageLabel='★ MAX'; stageClass='maxed'; }
    else if(isCapped){ stageLabel='Stage '+c.currentStage+' / '+c.effectiveMax+' (Capped)'; stageClass='capped'; }
    else{ stageLabel='Stage '+c.currentStage+' / '+c.effectiveMax; stageClass='active-stage'; }

    var html='<div class="part-header fade"><span class="ph-icon">'+c.icon+'</span>'
        +'<span class="ph-name">'+c.name+'</span>'
        +'<span class="ph-stage '+stageClass+'">'+stageLabel+'</span></div>';

    html+='<div class="part-desc fade">'+((c.descriptions||[])[c.currentStage]||'')+'</div>';

    // Progress bar uses effectiveMax
    if(!isStock){
        var pct=Math.round((c.currentStage/c.effectiveMax)*100);
        var fillClass=isMax?'maxed':isCapped?'capped':'normal';
        html+='<div class="progress-section fade">'
            +'<div class="progress-row"><div class="progress-bar"><div class="progress-fill '+fillClass+'" style="width:'+pct+'%"></div></div>'
            +(isCapped?'<span class="progress-cap-label">PI CAP</span>':'')
            +'</div>'
            +'<div class="progress-labels"><span>Stock</span><span>Stage '+c.effectiveMax+'</span></div>'
            +(isCapped?'<div class="cap-notice">Your vehicle\'s PI class ('+DATA.grade+') caps this part at Stage '+c.effectiveMax+'. Upgrade your vehicle grade to unlock further stages.</div>':'')
            +'</div>';
    }

    if(isStock){
        // BRAND SELECTION
        if(vKeys.length===1&&!selBrand) selBrand=vKeys[0];
        html+='<div class="brand-section fade">'
            +'<div class="bs-title">Choose Your Manufacturer</div>'
            +'<div class="bs-subtitle">This brand locks for all future upgrades on this part. Choose carefully.</div>';

        var req=c.nextReq;
        for(var vi=0;vi<vKeys.length;vi++){
            var vk=vKeys[vi]; var v=variants[vk];
            var sel=vk===selBrand;

            var surTxt=v.surcharge>1?'<span class="bc-surcharge">+'+Math.round((v.surcharge-1)*100)+'%</span>':'';

            html+='<div class="brand-card'+(sel?' selected':'')
                +'" style="border-left:4px solid '+v.tagColor+'" onclick="pickBrand(\''+vk+'\')">'
                +'<div class="bc-top"><span class="bc-dot" style="background:'+v.tagColor+'"></span>'
                +'<span class="bc-name">'+v.name+'</span>'
                +'<span class="bc-tag" style="background:'+v.tagColor+'18;color:'+v.tagColor+'">'+v.tag+'</span>'
                +surTxt+piBadge+'</div>'
                +'<div class="bc-desc">'+v.desc+'</div>'
                +'<div class="bc-cost"><span class="bc-money">$'+fmt(price)+'</span>'
                +(req&&req.items&&req.items.length?'<span class="bc-parts">'+(req.items.map(function(it){return it.count+'× '+(it.name||it.itemId);}).join(' · '))+'</span>':'')
                +'</div></div>';
        }
        html+='</div>';

        if(selBrand&&req){
            var v2=variants[selBrand]||{};
            var price2=Math.round(((req.money*(v2.surcharge||1))/100)*100);
            var canM=DATA.playerCash>=price2;
            var hasP=req.playerHas!==undefined?req.playerHas>=req.partAmount:true;
            var canBuy=canM&&hasP;
            html+='<div class="upgrade-section">'
                +'<div class=\"us-cost\">'
                +(req.items&&req.items.length ? req.items.map(function(it){
                    var ok = it.playerHas >= it.count;
                    return '<span class=\"us-item '+(ok?'ok':'bad')+'\">'
                        +(it.playerHas !== undefined ? it.playerHas : '?')+'/'+it.count+' '+it.name
                        +'</span>';
                }).join('') : '')
                +'</div>'
                +'</div>'
                +'<button class="btn-upgrade '+(canBuy?'ready':'locked')+'" '+(canBuy?'onclick="purchaseUpgrade()"':'disabled')+'>'

                +'<span class="lock-name" style="color:'+(v3.tagColor||'#888')+'">'+(v3.name||c.currentVariant)+'</span>'
                +'<span class="lock-tag" style="background:'+(v3.tagColor||'#888')+'18;color:'+(v3.tagColor||'#888')+'">'+(v3.tag||'')+'</span>'
                +'<button class="lock-reset'+(resetPending?' confirm':'')
                +'" onclick="resetPartClick()">'+(resetPending?'⚠ Confirm':'Reset')+'</button></div>';
        }

        // SLIDERS
        var sliders=(c.sliders||[]).filter(function(s){ return c.currentStage>=s.minStage; });
        if(sliders.length){
            var inner='';
            for(var si=0;si<sliders.length;si++){
                var sl=sliders[si];
                var sv=(c.sliderValues||{})[sl.key];
                var val=pendingSliders[sl.key]!==undefined?pendingSliders[sl.key]:(sv!==undefined?sv:sl.default);
                var pct3=val;
                var zoneState=getZoneState(val,sl.zones);
                var valClass='sr-val '+(zoneState==='ok'?'val-ok':zoneState==='caution'?'val-caution':'val-danger');
                var valLabel=zoneState==='ok'?Math.round(val*100)+'%':zoneState==='caution'?'⚠ CAUTION':'⛔ DANGER';
                var warnMsg=getWarnMsg(val,sl.zones,sl);
                var warnClass=zoneState==='ok'?'':'(zoneState)';
                var styleZone=getStyleZone(sl,dominant);
                var thumbClass='slider-thumb'+(zoneState==='caution'?' thumb-caution':zoneState==='danger'?' thumb-danger':'');
                var gradient=buildZoneGradient(sl.zones);

                // Style zone overlay dimensions
                var szLeft='',szWidth='',szShow=false;
                if(styleZone){
                    szLeft=(styleZone[0]*100).toFixed(1)+'%';
                    szWidth=((styleZone[1]-styleZone[0])*100).toFixed(1)+'%';
                    szShow=true;
                }
                var bs3=(DATA.buildStyles||{})[dominant]||{color:'#aaa',name:'Style'};

                inner+='<div class="slider-row" data-slider="'+sl.key+'">'
                    +'<div class="sr-top"><span class="sr-icon">'+sl.icon+'</span>'

// SLIDERS — bind mouse drag + live zone updates
// ═════════════════════════════════════════════════════════════════════════════
function bindSliders(){
    $$('.slider-track:not(.stance-slider)').forEach(function(track){
        var key=track.dataset.key;
        if(!key) return;
        var c=DATA.categories[selCat]; if(!c) return;
        var sl=(c.sliders||[]).find(function(s){ return s.key===key; });
        var dominant=(DATA.tendency||{}).dominant||'balanced';

        function upd(e){
            var r=track.getBoundingClientRect();
            var p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
            pendingSliders[key]=Math.round(p*100)/100;

            // Update fill and thumb
            track.querySelector('.slider-fill').style.width=(p*100)+'%';
            track.querySelector('.slider-thumb').style.left=(p*100)+'%';

            // Update zone-based value label
            var zoneState=sl?getZoneState(p,sl.zones):'ok';
            var valLabel=zoneState==='ok'?Math.round(p*100)+'%':zoneState==='caution'?'⚠ CAUTION':'⛔ DANGER';
            var valEl=document.getElementById('srv_'+key);
            if(valEl){
                valEl.textContent=valLabel;
                valEl.className='sr-val '+(zoneState==='ok'?'val-ok':zoneState==='caution'?'val-caution':'val-danger');
            }

            // Update thumb color class
            var thumb=track.querySelector('.slider-thumb');
            thumb.className='slider-thumb'+(zoneState==='caution'?' thumb-caution':zoneState==='danger'?' thumb-danger':'');

            // Update warn message
            var warnEl=document.getElementById('srw_'+key);
            if(warnEl&&sl){
                var warnMsg=getWarnMsg(p,sl.zones,sl);
                if(warnMsg){
                    warnEl.textContent=warnMsg;
                    warnEl.className='sr-warn '+(zoneState==='caution'?'caution':'danger');
                } else {
                    warnEl.textContent='';
                    warnEl.className='sr-warn';
                }
            }

            // Live preview
            if(selCat){
                var all=Object.assign({},c.sliderValues||{},pendingSliders);
                mp_trigger('cef:tuning:previewSliders', selCat, JSON.stringify(all));
            }
        }

        track.addEventListener('mousedown',function(e){
            upd(e);
            var mv=function(ev){ upd(ev); };
            var up=function(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
            document.addEventListener('mousemove',mv);
            document.addEventListener('mouseup',up);
        });
    });
}

function saveSliders(){
    if(!selCat||!Object.keys(pendingSliders).length) return;
    var merged=Object.assign({},DATA.categories[selCat].sliderValues||{},pendingSliders);
    mp_trigger('cef:tuning:saveSliders', selCat, JSON.stringify(merged));
    DATA.categories[selCat].sliderValues=merged;
    pendingSliders={};
    showToast('Tuning settings saved!','success');
}

function resetSliders(){
    if(!selCat) return;
    var c=DATA.categories[selCat];
    pendingSliders={};
    for(var si=0;si<(c.sliders||[]).length;si++){
        var sl=c.sliders[si];
        if(c.currentStage>=sl.minStage) pendingSliders[sl.key]=sl.default;
    }
    renderPerfMain();
    mp_trigger('cef:tuning:previewSliders', selCat, JSON.stringify(Object.assign({},c.sliderValues||{},pendingSliders)));
}

        for(var oi=0;oi<opts.length;oi++){ var wt2=opts[oi]; html+='<div class="opt-card'+(wt2.id===wheelType?' selected':'')
            +'" onclick="changeWheelType('+wt2.id+')"><span class="oc-name">'+wt2.name+'</span></div>'; }
        html+='</div><div class="option-grid">';
        html+='<div class="opt-card'+(selWheelIdx===-1?' selected':'')
            +'" onclick="prevWheel(-1)"><span class="oc-name">Default</span><span class="oc-price" style="color:var(--txt3)">Free</span></div>';
        if(wheelCount>0){ for(var i=0;i<wheelCount;i++){ html+='<div class="opt-card'+(i===selWheelIdx?' selected':'')
            +'" onclick="prevWheel('+i+')"><span class="oc-name">Wheel '+(i+1)+'</span></div>'; } }
        html+='</div>';
        var wColors=sp.wheelColors||[];
        if(wColors.length){
            html+='<div style="padding:6px 22px 0"><div class="ss-title" style="margin-bottom:8px">Wheel Color</div></div>';
            html+='<div class="color-grid" style="padding-top:0">';
            for(var i=0;i<wColors.length;i++){
                var wc=wColors[i]; var sel2=wheelColorIdx===i;
                var bg2=wc.r===-1?'linear-gradient(135deg,#555,#888)':'rgb('+wc.r+','+wc.g+','+wc.b+')';
                html+='<div class="color-swatch'+(sel2?' selected':'')
                    +'" style="background:'+bg2+'" onclick="pickWheelColor('+i+')" title="'+wc.name+'"></div>';
            }
            html+='</div>';
        }
        html+='<div class="action-footer"><button class="btn-upgrade ready" onclick="applyWheels()">Install Wheels</button></div>';

    } else if(selSpecCat==='xenon'){
        html+='<div class="spec-toggle"><label>Xenon Headlights</label>'
            +'<div class="toggle-box'+(xenonOn?' on':'')
            +'" onclick="toggleXenon()"><div class="toggle-knob"></div></div></div>';
        if(xenonOn&&sp.options){
            html+='<div class="option-grid">';
            for(var xi=0;xi<sp.options.length;xi++){
                var x=sp.options[xi];
                html+='<div class="opt-card'+(x.id===xenonColor?' selected':'')
                    +'" onclick="pickXenon('+x.id+')">'
                    +'<span class="oc-name" style="color:'+(x.hex||'#fff')+'">'+x.name+'</span></div>';
            }
            html+='</div>';
        }
        html+='<div class="action-footer"><button class="btn-upgrade ready" onclick="applyXenon()">Apply Xenon</button></div>';

    } else if(selSpecCat==='plate'){
        html+='<div class="option-grid">';
        var plateOpts=sp.options||[];
        for(var pi=0;pi<plateOpts.length;pi++){
            var p=plateOpts[pi]; var isActPrev=selSpecOpt===p.id; var isCur=p.id===(sp.current||0);
            var cls2='opt-card'; var badge2='';
            if(isCur&&!isActPrev){ cls2+=' installed'; badge2='<span class="oc-badge">✓ CURRENT</span>'; }
            else if(isActPrev){ cls2+=' previewing'; badge2='<span class="oc-badge">👁 PREVIEW</span>'; }
            html+='<div class="'+cls2+'" onclick="prevPlate('+p.id+')">'+badge2+'<span class="oc-name">'+p.name+'</span></div>';
        }
        html+='</div><div class="action-footer"><button class="btn-upgrade ready" onclick="applyPlate()">Apply Plate</button></div>';

    } else if(selSpecCat==='neon'){
        html+='<div class="neon-sides">';
        var sides=['Left','Right','Front','Rear'];
        for(var i=0;i<4;i++){ var on=(neonMask&(1<<i))!==0; html+='<div class="neon-btn'+(on?' on':'')
            +'" onclick="toggleNeonSide('+i+')">'+sides[i]+'</div>'; }
        html+='</div><div class="option-grid">';
        var nOpts=sp.options||[];
        for(var ni=0;ni<nOpts.length;ni++){
            var n=nOpts[ni]; var r3=255,g3=255,b3=255;
            var m3=(n.hex||'').match(/(\d+)/g);
            if(m3&&m3.length>=3){ r3=parseInt(m3[0]); g3=parseInt(m3[1]); b3=parseInt(m3[2]); }
            var isSel3=neonColor.r===r3&&neonColor.g===g3&&neonColor.b===b3;
            html+='<div class="opt-card'+(isSel3?' selected':'')
                +'" onclick="pickNeonColor('+r3+','+g3+','+b3+')" style="border-left:3px solid '+(n.hex||'#fff')+'">'
                +'<span class="oc-name">'+n.name+'</span></div>';
        }
        html+='</div><div class="action-footer"><button class="btn-upgrade ready" onclick="applyNeon()">Apply Neon</button></div>';

    } else if(selSpecCat==='smoke'){
        html+='<div class="spec-toggle"><label>Tyre Smoke</label>'
            +'<div class="toggle-box'+(smokeOn?' on':'')
            +'" onclick="toggleSmoke()"><div class="toggle-knob"></div></div></div>';
        if(smokeOn){
            html+='<div class="option-grid">';
            var sOpts=sp.options||[];
            for(var si2=0;si2<sOpts.length;si2++){
                var n2=sOpts[si2]; var r4=255,g4=255,b4=255;
                var m4=(n2.hex||'').match(/(\d+)/g);
                if(m4&&m4.length>=3){ r4=parseInt(m4[0]); g4=parseInt(m4[1]); b4=parseInt(m4[2]); }
                var isSel4=smokeColor.r===r4&&smokeColor.g===g4&&smokeColor.b===b4;
                html+='<div class="opt-card'+(isSel4?' selected':'')
                    +'" onclick="pickSmokeColor('+r4+','+g4+','+b4+')" style="border-left:3px solid '+(n2.hex||'#fff')+'">'
                    +'<span class="oc-name">'+n2.name+'</span></div>';
            }
            html+='</div>';
        }
        html+='<div class="action-footer"><button class="btn-upgrade ready" onclick="applySmoke()">Apply Smoke</button></div>';

    } else if(selSpecCat==='stance'){
        html+='<div class="slider-section" style="border-top:none"><div class="ss-title">Stance Tuning</div>';
        var camPct=((camberValue+1)/2)*100;
        html+='<div class="slider-row">'
            +'<div class="sr-top"><span class="sr-icon">↕</span><span class="sr-name">Camber</span>'
            +'<span class="sr-val val-ok" id="camberVal">'+camberValue.toFixed(2)+'</span></div>'
            +'<div class="sr-labels"><span>Negative</span><span>Positive</span></div>'
            +'<div class="slider-track stance-slider" data-stance="camber">'
            +'<div class="slider-zones" style="background:linear-gradient(90deg,rgba(255,71,87,.2) 0%,rgba(46,204,113,.22) 15%,rgba(46,204,113,.22) 85%,rgba(255,71,87,.2) 100%)"></div>'
            +'<div class="slider-fill" style="width:'+camPct.toFixed(1)+'%"></div>'
            +'<div class="slider-thumb" style="left:'+camPct.toFixed(1)+'%"></div></div>'
            +'<div class="slider-desc">Negative = wheels tilt inward at top (racing). Positive = outward (show stance).</div></div>';
        var twPct=((trackWidthValue+1)/2)*100;
        html+='<div class="slider-row">'
            +'<div class="sr-top"><span class="sr-icon">↔</span><span class="sr-name">Wheel Distance</span>'
            +'<span class="sr-val val-ok" id="trackVal">'+trackWidthValue.toFixed(2)+'</span></div>'
            +'<div class="sr-labels"><span>Narrower</span><span>Wider</span></div>'
            +'<div class="slider-track stance-slider" data-stance="trackWidth">'
            +'<div class="slider-zones" style="background:linear-gradient(90deg,rgba(255,71,87,.2) 0%,rgba(46,204,113,.22) 15%,rgba(46,204,113,.22) 85%,rgba(255,71,87,.2) 100%)"></div>'
            +'<div class="slider-fill" style="width:'+twPct.toFixed(1)+'%"></div>'
            +'<div class="slider-thumb" style="left:'+twPct.toFixed(1)+'%"></div></div>'
            +'<div class="slider-desc">Adjust how wide the wheels sit from the body.</div></div>';
        html+='</div>';
        html+='<div class="action-footer"><button class="btn-upgrade ready" onclick="applyStance()">Apply Stance · $'+fmt(sp.price||0)+'</button></div>';
    }

    panel.innerHTML=html;
    bindStanceSliders();
}

function changeWheelType(typeId){ wheelType=typeId; wheelCount=0; selWheelIdx=-1; mp_trigger('cef:tuning:changeWheelType',typeId); renderSpecMain(); }
function updateWheelOptions(type,count){ wheelType=type; wheelCount=count; renderSpecMain(); }
function prevWheel(idx){ selWheelIdx=idx; mp_trigger('cef:tuning:previewWheel',idx); renderSpecMain(); }
function pickWheelColor(idx){ wheelColorIdx=idx; var wc=(DATA.specialData.wheels.wheelColors||[])[idx]; if(wc) mp_trigger('cef:tuning:previewWheelColor',wc.gtaIndex); renderSpecMain(); }
function applyWheels(){ mp_trigger('cef:tuning:applyWheels',wheelType,selWheelIdx,wheelColorIdx); }
function toggleXenon(){ xenonOn=!xenonOn; mp_trigger('cef:tuning:previewXenon',xenonOn?'true':'false',xenonColor); renderSpecMain(); }
function pickXenon(id){ xenonColor=id; mp_trigger('cef:tuning:previewXenon','true',id); renderSpecMain(); }
function applyXenon(){ mp_trigger('cef:tuning:applyXenon',xenonOn?'true':'false',xenonColor); }
function prevPlate(id){ selSpecOpt=id; mp_trigger('cef:tuning:previewPlate',id); showToast('Previewing plate style','info',1200); renderSpecMain(); }
function applyPlate(){ if(selSpecOpt!==null) mp_trigger('cef:tuning:applyPlate',selSpecOpt); }
function toggleNeonSide(idx){ neonMask^=(1<<idx); mp_trigger('cef:tuning:previewNeon',neonMask,neonColor.r,neonColor.g,neonColor.b); renderSpecMain(); }
function pickNeonColor(r,g,b){ neonColor={r:r,g:g,b:b}; mp_trigger('cef:tuning:previewNeon',neonMask,r,g,b); renderSpecMain(); }
function applyNeon(){ mp_trigger('cef:tuning:applyNeon',neonMask,neonColor.r,neonColor.g,neonColor.b); }
function toggleSmoke(){ smokeOn=!smokeOn; mp_trigger('cef:tuning:previewSmoke',smokeOn?'true':'false',smokeColor.r,smokeColor.g,smokeColor.b); renderSpecMain(); }
function pickSmokeColor(r,g,b){ smokeColor={r:r,g:g,b:b}; mp_trigger('cef:tuning:previewSmoke','true',r,g,b); renderSpecMain(); }
function applySmoke(){ mp_trigger('cef:tuning:applySmoke',smokeOn?'true':'false',smokeColor.r,smokeColor.g,smokeColor.b); }

function bindStanceSliders(){
    $$('.stance-slider').forEach(function(track){
        var type=track.dataset.stance;
        function upd(e){
            var r=track.getBoundingClientRect();
            var p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
            var val=(p*2)-1;
            if(type==='camber') camberValue=Math.round(val*100)/100;
            else trackWidthValue=Math.round(val*100)/100;
            track.querySelector('.slider-fill').style.width=(p*100)+'%';
            track.querySelector('.slider-thumb').style.left=(p*100)+'%';
            var lbl=document.getElementById(type==='camber'?'camberVal':'trackVal');
            if(lbl) lbl.textContent=val.toFixed(2);
            mp_trigger('cef:tuning:previewStance',camberValue,trackWidthValue);
        }
        track.addEventListener('mousedown',function(e){
            upd(e);
            var mv=function(ev){ upd(ev); };
            var up=function(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
            document.addEventListener('mousemove',mv);
            document.addEventListener('mouseup',up);
        });
    });
}

function applyStance(){ mp_trigger('cef:tuning:applyStance',camberValue,trackWidthValue); }

// ═════════════════════════════════════════════════════════════════════════════
// CLOSE
// ═════════════════════════════════════════════════════════════════════════════
function closeTuning(){ mp_trigger('cef:tuning:close'); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeTuning(); });

try { mp.trigger('client:crafting:ready'); } catch(e) {}

</script>
