<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Tuning</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #00a8ff;
    --primary-dim: #0080c0;
    --danger: #ff4757;
    --success: #2ecc71;
    --warning: #f39c12;
    --bg: rgba(10, 12, 18, 0.92);
    --border: rgba(255, 255, 255, 0.06);
    --text: #e8e8e8;
    --text-dim: #8a8fa6;
    --glass: rgba(255, 255, 255, 0.03);

    --rarity-common:    #a0a0a0;
    --rarity-uncommon:  #2ecc71;
    --rarity-rare:      #3498db;
    --rarity-epic:      #9b59b6;
    --rarity-legendary: #f39c12;

    --grade-s: #ff4757; --grade-a: #ff6b35; --grade-b: #f39c12;
    --grade-c: #2ecc71; --grade-d: #00a8ff; --grade-e: #8a8fa6; --grade-f: #555;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    font-family: 'Poppins', sans-serif;
    background: none !important;
    background-color: transparent !important;
    color: var(--text);
    overflow: hidden;
    width: 100vw; height: 100vh;
    user-select: none; -webkit-user-select: none;
}

/* ═══ TOP BAR ═══ */
.top-bar {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 60px); max-width: 900px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px;
    background: var(--bg); border-radius: 12px; border: 1px solid var(--border);
    z-index: 10;
    animation: fadeDown .3s ease both;
}
@keyframes fadeDown { from { opacity:0; transform:translateX(-50%) translateY(-10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

.top-bar .title { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
.top-bar .title .grade-badge {
    font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 5px; color: #fff;
}
.top-bar .top-info { display: flex; gap: 16px; align-items: center; }
.top-bar .info-item { font-size: 11px; color: var(--text-dim); }
.top-bar .info-item .val { color: var(--success); font-weight: 600; }

.close-btn {
    width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.04); color: var(--text-dim); font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s;
}
.close-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

/* ═══ LEFT PANEL — Category Tabs ═══ */
.left-panel {
    position: fixed; left: 24px; top: 50%; transform: translateY(-50%);
    width: 200px; max-height: calc(100vh - 180px);
    display: flex; flex-direction: column; gap: 6px;
    background: var(--bg); border-radius: 12px; border: 1px solid var(--border);
    padding: 14px; overflow-y: auto; z-index: 10;
    animation: fadeRight .3s ease .05s both;
}
@keyframes fadeRight { from { opacity:0; transform:translateY(-50%) translateX(-15px); } to { opacity:1; transform:translateY(-50%) translateX(0); } }
.left-panel::-webkit-scrollbar { width: 3px; }
.left-panel::-webkit-scrollbar-thumb { background: var(--primary-dim); border-radius: 3px; }

/* Tab bar */
.tab-bar {
    display: flex; gap: 0; border-bottom: 1px solid var(--border);
    margin: -14px -14px 8px -14px; padding: 0;
    border-radius: 12px 12px 0 0; overflow: hidden;
}
.tab-btn {
    flex: 1; padding: 10px 0; border: none; background: transparent;
    color: var(--text-dim); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.2px;
    cursor: pointer; transition: all .2s; font-family: 'Poppins', sans-serif;
    border-bottom: 2px solid transparent; position: relative;
}
.tab-btn:hover { color: #fff; background: rgba(255,255,255,0.02); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(0,168,255,0.04); }
.tab-content { display: none; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
.tab-content.active { display: flex; }
.tab-content::-webkit-scrollbar { width: 3px; }
.tab-content::-webkit-scrollbar-thumb { background: var(--primary-dim); border-radius: 3px; }

.section-label {
    font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
    color: var(--text-dim); margin-bottom: 2px; margin-top: 6px;
}

.cat-btn {
    padding: 9px 12px; border-radius: 8px; border: 1px solid transparent;
    background: var(--glass); color: var(--text-dim); font-size: 11px; font-weight: 500;
    cursor: pointer; transition: all .2s; text-align: left; font-family: 'Poppins', sans-serif;
    display: flex; align-items: center; justify-content: space-between;
    min-height: 38px;
}
.cat-btn .cat-name { font-size: 11px; font-weight: 500; }
.cat-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
.cat-btn.active { background: rgba(0,168,255,0.12); border-color: var(--primary); color: #fff; }
.cat-btn .cat-stage {
    font-size: 9px; color: var(--text-dim); font-weight: 600;
}
.cat-btn .cat-stage.maxed { color: var(--success); }

/* ═══ RIGHT PANEL — Details ═══ */
.right-panel {
    position: fixed; right: 24px; top: 50%; transform: translateY(-50%);
    width: 320px; max-height: calc(100vh - 180px);
    display: flex; flex-direction: column; gap: 10px;
    background: var(--bg); border-radius: 12px; border: 1px solid var(--border);
    padding: 16px; overflow-y: auto; z-index: 10;
    animation: fadeLeft .3s ease .1s both;
}
@keyframes fadeLeft { from { opacity:0; transform:translateY(-50%) translateX(15px); } to { opacity:1; transform:translateY(-50%) translateX(0); } }
.right-panel::-webkit-scrollbar { width: 3px; }
.right-panel::-webkit-scrollbar-thumb { background: var(--primary-dim); border-radius: 3px; }

.no-selection { display: flex; align-items: center; justify-content: center;
    padding: 40px 0; color: var(--text-dim); font-size: 11px; font-style: italic; }

/* ── Performance Detail ── */
.perf-detail { display: flex; flex-direction: column; gap: 12px; }
.perf-header { display: flex; align-items: center; gap: 8px; }
.perf-header .perf-name { font-size: 16px; font-weight: 800; color: #fff; }

.stage-progress { display: flex; flex-direction: column; gap: 6px; }
.stage-bar-row { display: flex; gap: 4px; align-items: center; }
.stage-pip {
    flex: 1; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,0.06); transition: background .3s;
}
.stage-pip.filled { background: var(--primary); }
.stage-pip.filled.maxed { background: var(--success); }
.stage-label { font-size: 10px; font-weight: 600; color: var(--text-dim); }
.stage-label .current { color: var(--primary); }
.stage-label .maxed-text { color: var(--success); }

.stage-desc {
    font-size: 10px; color: var(--text-dim); padding: 8px 12px;
    background: var(--glass); border-radius: 8px; border: 1px solid var(--border);
    line-height: 1.5;
}
.stage-desc .desc-current { color: var(--primary); font-weight: 600; }
.stage-desc .desc-next { color: var(--warning); font-weight: 500; }

/* Requirements box */
.req-box {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
}
.req-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); }
.req-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
.req-row .req-label { color: var(--text-dim); }
.req-row .req-value { font-weight: 600; }
.req-row .req-value.has { color: var(--success); }
.req-row .req-value.missing { color: var(--danger); }

.rarity-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle;
}

.upgrade-btn {
    padding: 10px; border-radius: 9px; border: none; font-family: 'Poppins', sans-serif;
    font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase;
    letter-spacing: 1px; transition: all .25s; width: 100%;
    background: var(--primary); color: #fff;
}
.upgrade-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
.upgrade-btn:active { transform: translateY(0); }
.upgrade-btn:disabled { opacity: .35; cursor: not-allowed; transform: none !important; filter: none !important; }
.upgrade-btn.maxed-btn { background: var(--success); cursor: default; }

/* ── Visual Detail ── */
.visual-detail { display: flex; flex-direction: column; gap: 10px; }
.visual-header { font-size: 14px; font-weight: 700; color: #fff; }

.visual-options { display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }
.visual-options::-webkit-scrollbar { width: 3px; }
.visual-options::-webkit-scrollbar-thumb { background: var(--primary-dim); border-radius: 3px; }

.visual-opt {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--glass); cursor: pointer; transition: all .2s;
}
.visual-opt:hover { border-color: var(--primary); background: rgba(0,168,255,0.06); }
.visual-opt.active { border-color: var(--primary); background: rgba(0,168,255,0.12); }
.visual-opt.installed { border-color: var(--success); background: rgba(46,204,113,0.08); }

.visual-opt .opt-name { font-size: 11px; font-weight: 500; color: #fff; }
.visual-opt .opt-price { font-size: 10px; font-weight: 700; color: var(--success); }
.visual-opt .opt-price.free { color: var(--text-dim); }
.visual-opt .opt-installed-tag { font-size: 8px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--success); }

.apply-btn {
    padding: 9px; border-radius: 9px; border: none; font-family: 'Poppins', sans-serif;
    font-size: 11px; font-weight: 600; cursor: pointer; transition: all .25s; width: 100%;
    background: var(--success); color: #fff; text-transform: uppercase; letter-spacing: .5px;
}
.apply-btn:hover { filter: brightness(1.15); }
.apply-btn:disabled { opacity: .35; cursor: not-allowed; filter: none !important; }

/* ═══ COLOR SECTION ═══ */
.color-detail { display: flex; flex-direction: column; gap: 10px; }
.color-header { font-size: 14px; font-weight: 700; color: #fff; }

/* Primary / Secondary toggle */
.color-target-row { display: flex; gap: 6px; }
.color-target-btn {
    flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--border);
    background: var(--glass); color: var(--text-dim); font-size: 10px; font-weight: 600;
    cursor: pointer; transition: all .2s; text-align: center; font-family: 'Poppins', sans-serif;
    text-transform: uppercase; letter-spacing: 1px;
}
.color-target-btn.active { background: rgba(0,168,255,0.12); border-color: var(--primary); color: #fff; }

/* Paint type row */
.paint-type-row { display: flex; gap: 4px; flex-wrap: wrap; }
.paint-type-btn {
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--glass); color: var(--text-dim); font-size: 9px; font-weight: 500;
    cursor: pointer; transition: all .2s; font-family: 'Poppins', sans-serif;
}
.paint-type-btn:hover { border-color: rgba(255,255,255,0.15); color: #fff; }
.paint-type-btn.active { border-color: var(--primary); background: rgba(0,168,255,0.12); color: #fff; }

/* Color preview swatch */
.color-preview-row { display: flex; align-items: center; gap: 10px; }
.color-swatch {
    width: 40px; height: 40px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
}
.color-swatch-label { font-size: 9px; color: var(--text-dim); }
.color-swatch-label .rgb-val { font-weight: 600; color: var(--text); font-size: 10px; }

/* Preset color grid */
.preset-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    max-height: 120px; overflow-y: auto; padding: 2px;
}
.preset-grid::-webkit-scrollbar { width: 3px; }
.preset-grid::-webkit-scrollbar-thumb { background: var(--primary-dim); border-radius: 3px; }
.preset-swatch {
    width: 100%; aspect-ratio: 1; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; transition: all .15s;
}
.preset-swatch:hover { border-color: rgba(255,255,255,0.4); transform: scale(1.1); }
.preset-swatch.active { border-color: var(--primary); box-shadow: 0 0 8px rgba(0,168,255,0.4); }

/* RGB sliders */
.rgb-sliders { display: flex; flex-direction: column; gap: 6px; }
.rgb-row { display: flex; align-items: center; gap: 8px; }
.rgb-label { font-size: 10px; font-weight: 700; width: 14px; text-align: center; }
.rgb-label.r { color: #ff4757; }
.rgb-label.g { color: #2ecc71; }
.rgb-label.b { color: #3498db; }
.rgb-slider {
    -webkit-appearance: none; flex: 1; height: 4px;
    background: rgba(255,255,255,0.1); border-radius: 2px; outline: none;
}
.rgb-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    cursor: pointer; border: 2px solid #fff;
}
.rgb-slider.r::-webkit-slider-thumb { background: #ff4757; }
.rgb-slider.g::-webkit-slider-thumb { background: #2ecc71; }
.rgb-slider.b::-webkit-slider-thumb { background: #3498db; }
.rgb-value { font-size: 10px; font-weight: 600; color: var(--text); width: 28px; text-align: right; }

/* ═══ BOTTOM BAR — Camera Controls ═══ */
.bottom-bar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    padding: 8px 18px;
    background: var(--bg); border-radius: 10px; border: 1px solid var(--border);
    z-index: 10;
    animation: fadeUp .3s ease .15s both;
}
@keyframes fadeUp { from { opacity:0; transform:translateX(-50%) translateY(10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

.cam-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.cam-slider {
    -webkit-appearance: none; width: 200px; height: 4px;
    background: rgba(255,255,255,0.1); border-radius: 2px; outline: none;
}
.cam-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--primary); cursor: pointer; border: 2px solid #fff;
}

.g-S { background: var(--grade-s); } .g-A { background: var(--grade-a); }
.g-B { background: var(--grade-b); } .g-C { background: var(--grade-c); }
.g-D { background: var(--grade-d); } .g-E { background: var(--grade-e); }
.g-F { background: var(--grade-f); }

/* ═══ EXTRAS SECTION ═══ */
.extra-detail { display: flex; flex-direction: column; gap: 10px; }
.extra-header { font-size: 14px; font-weight: 700; color: #fff; }
.extra-desc { font-size: 10px; color: var(--text-dim); }

/* Toggle row */
.toggle-row { display: flex; align-items: center; gap: 10px; }
.toggle-label { font-size: 11px; color: var(--text-dim); font-weight: 500; }
.toggle-switch {
    width: 40px; height: 20px; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,0.1); position: relative; transition: all .2s;
    border: 1px solid var(--border); flex-shrink: 0;
}
.toggle-switch.on { background: rgba(0,168,255,0.3); border-color: var(--primary); }
.toggle-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--text-dim); transition: all .2s;
}
.toggle-switch.on::after { left: 22px; background: var(--primary); }

/* Wheel type tabs */
.wheel-type-row { display: flex; gap: 3px; flex-wrap: wrap; }
.wheel-type-btn {
    padding: 4px 8px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--glass); color: var(--text-dim); font-size: 9px; font-weight: 500;
    cursor: pointer; transition: all .2s; font-family: 'Poppins', sans-serif;
}
.wheel-type-btn:hover { border-color: rgba(255,255,255,0.15); color: #fff; }
.wheel-type-btn.active { border-color: var(--primary); background: rgba(0,168,255,0.12); color: #fff; }

/* Color swatch grid (for xenon/neon/smoke) */
.swatch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.swatch-item {
    aspect-ratio: 1; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; transition: all .15s;
    display: flex; align-items: center; justify-content: center;
    font-size: 7px; color: rgba(255,255,255,0.7); font-weight: 500;
}
.swatch-item:hover { border-color: rgba(255,255,255,0.4); transform: scale(1.08); }
.swatch-item.active { border-color: var(--primary); box-shadow: 0 0 8px rgba(0,168,255,0.4); }

/* Neon side buttons */
.neon-sides { display: flex; gap: 4px; }
.neon-side-btn {
    flex: 1; padding: 6px 4px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--glass); color: var(--text-dim); font-size: 9px; font-weight: 500;
    cursor: pointer; transition: all .2s; text-align: center; font-family: 'Poppins', sans-serif;
}
.neon-side-btn:hover { border-color: rgba(255,255,255,0.15); }
.neon-side-btn.on { border-color: var(--primary); background: rgba(0,168,255,0.15); color: #fff; }

/* Plate option list */
.plate-opt {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--glass); cursor: pointer; transition: all .2s;
}
.plate-opt:hover { border-color: var(--primary); background: rgba(0,168,255,0.06); }
.plate-opt.active { border-color: var(--primary); background: rgba(0,168,255,0.12); }
.plate-opt.installed { border-color: var(--success); background: rgba(46,204,113,0.08); }
.plate-opt .opt-name { font-size: 11px; font-weight: 500; color: #fff; }

/* ═══ CART SYSTEM ═══ */
.cart-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.04); color: var(--text-dim); font-size: 12px;
    cursor: pointer; transition: all .2s; font-family: 'Poppins', sans-serif;
}
.cart-btn:hover { background: rgba(0,168,255,0.12); color: #fff; border-color: var(--primary); }
.cart-badge {
    min-width: 16px; height: 16px; border-radius: 8px;
    background: var(--primary); color: #fff; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
}
.cart-overlay {
    position: fixed; right: 356px; top: 50%; transform: translateY(-50%);
    width: 300px; max-height: calc(100vh - 200px);
    background: var(--bg); border-radius: 12px; border: 1px solid var(--border);
    padding: 14px; z-index: 20; display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto; animation: fadeLeft .2s ease both;
}
.cart-overlay::-webkit-scrollbar { width: 3px; }
.cart-overlay::-webkit-scrollbar-thumb { background: var(--primary-dim); border-radius: 3px; }
.cart-title { font-size: 13px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: space-between; }
.cart-empty { font-size: 10px; color: var(--text-dim); font-style: italic; padding: 12px 0; text-align: center; }
.cart-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 7px; background: var(--glass); border: 1px solid var(--border);
}
.cart-item .ci-label { font-size: 10px; color: #fff; font-weight: 500; flex: 1; }
.cart-item .ci-price { font-size: 10px; color: var(--success); font-weight: 600; margin: 0 8px; }
.cart-item .ci-remove {
    width: 18px; height: 18px; border-radius: 5px; border: none;
    background: rgba(255,71,87,0.15); color: var(--danger); font-size: 10px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s;
}
.cart-item .ci-remove:hover { background: var(--danger); color: #fff; }
.cart-total {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-top: 1px solid var(--border); margin-top: 2px;
    font-size: 11px; font-weight: 600;
}
.cart-total .ct-label { color: var(--text-dim); }
.cart-total .ct-amount { color: var(--success); }
.cart-buy-btn {
    padding: 9px; border-radius: 9px; border: none; font-family: 'Poppins', sans-serif;
    font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase;
    letter-spacing: .5px; transition: all .25s; width: 100%;
    background: var(--primary); color: #fff;
}
.cart-buy-btn:hover { filter: brightness(1.15); }
.cart-buy-btn:disabled { opacity: .35; cursor: not-allowed; filter: none !important; }
.cart-clear-btn {
    padding: 6px; border-radius: 7px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.03); color: var(--text-dim); font-size: 9px;
    cursor: pointer; transition: all .2s; font-family: 'Poppins', sans-serif; width: 100%;
    text-align: center;
}
.cart-clear-btn:hover { background: rgba(255,71,87,0.1); color: var(--danger); border-color: var(--danger); }
.btn-row { display: flex; gap: 6px; }
.btn-row .apply-btn { flex: 1; }
.btn-row .upgrade-btn { flex: 1; }
.btn-cart {
    padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.04); color: var(--text-dim); font-size: 13px;
    cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center;
    font-family: 'Poppins', sans-serif;
}
.btn-cart:hover { background: rgba(0,168,255,0.12); color: var(--primary); border-color: var(--primary); }
.btn-cart:disabled { opacity: .25; cursor: not-allowed; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="title">
        Vehicle Tuning
        <span class="grade-badge g-E" id="gradeBadge">E</span>
    </div>
    <div class="top-info">
        <div class="info-item">Cash: <span class="val" id="playerCash">$0</span></div>
        <button class="cart-btn" id="cartBtn" onclick="toggleCart()" style="display:none">
            🛒 <span class="cart-badge" id="cartBadge">0</span>
        </button>
        <button class="close-btn" onclick="closeUI()">&times;</button>
    </div>
</div>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cartOverlay" style="display:none">
    <div class="cart-title">🛒 Shopping Cart <span id="cartCount">(0)</span></div>
    <div id="cartItems"><div class="cart-empty">Cart is empty</div></div>
    <div class="cart-total">
        <span class="ct-label">Total</span>
        <span class="ct-amount" id="cartTotal">$0</span>
    </div>
    <button class="cart-buy-btn" id="cartBuyBtn" disabled onclick="doBuyAll()">Cart is empty</button>
    <button class="cart-clear-btn" onclick="clearCart()">Clear Cart</button>
</div>

<!-- LEFT PANEL -->
<div class="left-panel" id="leftPanel">
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('perf')">Performance</button>
        <button class="tab-btn" onclick="switchTab('visual')">Visual</button>
        <button class="tab-btn" onclick="switchTab('extra')">Extras</button>
    </div>
    <div class="tab-content active" id="tabPerf"></div>
    <div class="tab-content" id="tabVisual"></div>
    <div class="tab-content" id="tabExtra"></div>
</div>

<!-- RIGHT PANEL -->
<div class="right-panel" id="rightPanel">
    <div class="no-selection" id="noSelection">Select a category to begin tuning</div>
    <div id="detailContent" style="display:none;"></div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
    <span class="cam-label">Rotate Camera</span>
    <input type="range" class="cam-slider" id="camSlider" min="0" max="360" value="180" oninput="rotateCamera(this.value)">
</div>

<script>
let perfData = {};
let visualData = {};
let visualPricing = {};
let playerInfo = {};
let currentMods = {};
let vehicleDbId = 0;
let activeCategory = null;
let activeCatType = null; // 'perf', 'visual', 'color'
let selectedVisualIndex = null;

// Color state
let paintTypes = [];
let presetColors = [];
let colorPricing = {};
let colorData = { primRGB: {r:0,g:0,b:0}, secRGB: {r:0,g:0,b:0}, paintType: 0 };
let colorTarget = 'primary'; // 'primary' or 'secondary'
let editRGB = { r: 0, g: 0, b: 0 };
let editPaintType = 0;

// Special/extras state
let specialData = { config: {}, current: {} };
let editWheelType = 0;
let editWheelIndex = -1;
let wheelOptionCount = 0;
let editXenonEnabled = false;
let editXenonColor = -1;
let editPlateStyle = 0;
let editNeonMask = 0;
let editNeonColor = { r: 255, g: 255, b: 255 };
let editSmokeEnabled = false;
let editSmokeColor = { r: 255, g: 255, b: 255 };

const RARITY_COLORS = {
    common: '#a0a0a0', uncommon: '#2ecc71', rare: '#3498db', epic: '#9b59b6', legendary: '#f39c12'
};

function initTuning(perf, visual, pricing, pInfo, mods, vehId, pTypes, pColors, cPricing, cData, sData) {
    perfData = perf;
    visualData = visual;
    visualPricing = pricing;
    playerInfo = pInfo;
    currentMods = mods;
    vehicleDbId = vehId;
    paintTypes = pTypes || [];
    presetColors = pColors || [];
    colorPricing = cPricing || {};
    colorData = cData && cData.primRGB ? cData : { primRGB: {r:0,g:0,b:0}, secRGB: {r:0,g:0,b:0}, paintType: 0 };

    // Special data
    specialData = sData && sData.config ? sData : { config: {}, current: {} };
    const sc = specialData.current || {};
    editWheelType = sc.wheelType || 0;
    editWheelIndex = sc.wheelIndex !== undefined ? sc.wheelIndex : -1;
    editXenonEnabled = !!sc.xenonEnabled;
    editXenonColor = sc.xenonColor !== undefined ? sc.xenonColor : -1;
    editPlateStyle = sc.plateStyle || 0;
    editNeonMask = sc.neonEnabled || 0;
    editNeonColor = sc.neonColor || { r: 255, g: 255, b: 255 };
    editSmokeEnabled = !!sc.smokeEnabled;
    editSmokeColor = sc.smokeColor || { r: 255, g: 255, b: 255 };

    // Init edit state from saved color
    editPaintType = colorData.paintType || 0;
    editRGB = { ...colorData.primRGB };

    document.getElementById('playerCash').textContent = '$' + playerInfo.cash.toLocaleString();

    const badge = document.getElementById('gradeBadge');
    badge.textContent = playerInfo.grade;
    badge.className = 'grade-badge g-' + playerInfo.grade;

    buildCategories();
    if (activeCategory && activeCatType) {
        selectCategory(activeCatType, activeCategory);
    } else {
        showNoSelection();
    }
}

function updateCash(cash) {
    playerInfo.cash = cash;
    document.getElementById('playerCash').textContent = '$' + cash.toLocaleString();
}

function buildCategories() {
    // ─── Performance tab ───
    const perfDiv = document.getElementById('tabPerf');
    perfDiv.innerHTML = '';
    for (const [key, mod] of Object.entries(perfData)) {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.dataset.key = key;
        btn.dataset.type = 'perf';

        const isMaxed = mod.currentStage >= mod.maxStage;
        const stageText = isMaxed ? 'MAX' : `${mod.currentStage}/${mod.maxStage}`;
        btn.innerHTML = `
            <span class="cat-name">${mod.name}</span>
            <span class="cat-stage ${isMaxed ? 'maxed' : ''}">${stageText}</span>
        `;
        btn.onclick = () => selectCategory('perf', key);
        perfDiv.appendChild(btn);
    }

    // ─── Visual tab (visual mods + colors) ───
    const visDiv = document.getElementById('tabVisual');
    visDiv.innerHTML = '';
    if (Object.keys(visualData).length === 0) {
        visDiv.innerHTML = '<div style="font-size:10px;color:var(--text-dim);padding:6px;">No visual mods available</div>';
    } else {
        for (const [key, mod] of Object.entries(visualData)) {
            const btn = document.createElement('button');
            btn.className = 'cat-btn';
            btn.dataset.key = key;
            btn.dataset.type = 'visual';

            const installed = currentMods[mod.modType] !== undefined && currentMods[mod.modType] >= 0;
            btn.innerHTML = `
                <span class="cat-name">${mod.name}</span>
                ${installed ? '<span class="cat-stage maxed">&#10003;</span>' : '<span class="cat-stage">' + mod.options + '</span>'}
            `;
            btn.onclick = () => selectCategory('visual', key);
            visDiv.appendChild(btn);
        }
    }

    // Color entries inside visual tab
    const colorCats = [
        { key: 'paint', name: 'Paint Color' },
        { key: 'finish', name: 'Paint Finish' }
    ];
    for (const cat of colorCats) {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.dataset.key = cat.key;
        btn.dataset.type = 'color';
        btn.innerHTML = `<span class="cat-name">${cat.name}</span>`;
        btn.onclick = () => selectCategory('color', cat.key);
        visDiv.appendChild(btn);
    }

    // ─── Extras tab ───
    const extDiv = document.getElementById('tabExtra');
    extDiv.innerHTML = '';
    const extraCats = [
        { key: 'wheels',  name: 'Wheels' },
        { key: 'xenon',   name: 'Headlights' },
        { key: 'plate',   name: 'Plate Style' },
        { key: 'neon',    name: 'Neon Lights' },
        { key: 'smoke',   name: 'Tyre Smoke' }
    ];
    for (const cat of extraCats) {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.dataset.key = cat.key;
        btn.dataset.type = 'extra';
        btn.innerHTML = `<span class="cat-name">${cat.name}</span>`;
        btn.onclick = () => selectCategory('extra', cat.key);
        extDiv.appendChild(btn);
    }
}

function switchTab(tab) {
    // Update tab buttons
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
        const tabs = ['perf', 'visual', 'extra'];
        b.classList.toggle('active', tabs[i] === tab);
    });
    // Show/hide tab content
    document.getElementById('tabPerf').classList.toggle('active', tab === 'perf');
    document.getElementById('tabVisual').classList.toggle('active', tab === 'visual');
    document.getElementById('tabExtra').classList.toggle('active', tab === 'extra');
}

function selectCategory(type, key) {
    activeCategory = key;
    activeCatType = type;
    selectedVisualIndex = null;

    // Auto-switch to correct tab
    if (type === 'perf') switchTab('perf');
    else if (type === 'visual' || type === 'color') switchTab('visual');
    else if (type === 'extra') switchTab('extra');

    document.querySelectorAll('.cat-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.key === key && b.dataset.type === type)
    );

    if (type === 'perf') showPerfDetail(key);
    else if (type === 'visual') showVisualDetail(key);
    else if (type === 'color') showColorDetail(key);
    else if (type === 'extra') showExtraDetail(key);
}

function showNoSelection() {
    document.getElementById('noSelection').style.display = 'flex';
    document.getElementById('detailContent').style.display = 'none';
}

// ─── Performance Detail ───
function showPerfDetail(key) {
    const mod = perfData[key];
    if (!mod) return;

    document.getElementById('noSelection').style.display = 'none';
    const content = document.getElementById('detailContent');
    content.style.display = 'flex';
    content.style.flexDirection = 'column';
    content.style.gap = '10px';

    const isMaxed = mod.currentStage >= mod.maxStage;

    // Stage pips
    let pipsHtml = '';
    for (let i = 1; i <= mod.maxStage; i++) {
        const filled = i <= mod.currentStage;
        pipsHtml += `<div class="stage-pip ${filled ? 'filled' : ''} ${isMaxed && filled ? 'maxed' : ''}"></div>`;
    }

    // Description
    const currentDesc = mod.descriptions[mod.currentStage] || 'Stock';
    const nextDesc = !isMaxed ? mod.descriptions[mod.currentStage + 1] : null;

    let descHtml = `<span class="desc-current">Current: ${currentDesc}</span>`;
    if (nextDesc) descHtml += `<br><span class="desc-next">Next: ${nextDesc}</span>`;

    // Requirements
    let reqHtml = '';
    if (!isMaxed && mod.nextReq) {
        const nr = mod.nextReq;
        const hasMoney = playerInfo.cash >= nr.money;
        const hasParts = nr.playerHas >= nr.partAmount;
        const rarityColor = RARITY_COLORS[nr.partType] || '#aaa';

        reqHtml = `
            <div class="req-box">
                <div class="req-title">Stage ${nr.stage} Requirements</div>
                <div class="req-row">
                    <span class="req-label">Cash</span>
                    <span class="req-value ${hasMoney ? 'has' : 'missing'}">$${nr.money.toLocaleString()}</span>
                </div>
                <div class="req-row">
                    <span class="req-label"><span class="rarity-dot" style="background:${rarityColor}"></span>${nr.partName}</span>
                    <span class="req-value ${hasParts ? 'has' : 'missing'}">${nr.playerHas} / ${nr.partAmount}</span>
                </div>
            </div>
        `;
    }

    // Button
    let btnHtml = '';
    if (isMaxed) {
        btnHtml = `<button class="upgrade-btn maxed-btn" disabled>Fully Upgraded</button>`;
    } else if (mod.nextReq) {
        const canUpgrade = playerInfo.cash >= mod.nextReq.money && mod.nextReq.playerHas >= mod.nextReq.partAmount;
        btnHtml = `<button class="upgrade-btn" ${canUpgrade ? '' : 'disabled'} onclick="doPerformanceUpgrade('${key}')">
            Upgrade to Stage ${mod.nextReq.stage} — $${mod.nextReq.money.toLocaleString()}
        </button>`;
    }

    content.innerHTML = `
        <div class="perf-detail">
            <div class="perf-header">
                <span class="perf-name">${mod.name}</span>
            </div>
            <div class="stage-progress">
                <div class="stage-bar-row">${pipsHtml}</div>
                <div class="stage-label">
                    ${isMaxed
                        ? '<span class="maxed-text">Stage ' + mod.currentStage + ' / ' + mod.maxStage + ' — MAX</span>'
                        : 'Stage <span class="current">' + mod.currentStage + '</span> / ' + mod.maxStage
                    }
                </div>
            </div>
            <div class="stage-desc">${descHtml}</div>
            ${reqHtml}
            ${btnHtml}
        </div>
    `;
}

// ─── Visual Detail ───
function showVisualDetail(key) {
    const mod = visualData[key];
    if (!mod) return;

    document.getElementById('noSelection').style.display = 'none';
    const content = document.getElementById('detailContent');
    content.style.display = 'flex';
    content.style.flexDirection = 'column';
    content.style.gap = '10px';

    const installedIndex = currentMods[mod.modType] !== undefined ? currentMods[mod.modType] : -1;

    let optionsHtml = '';
    // Stock option
    const isStock = installedIndex === -1;
    optionsHtml += `
        <div class="visual-opt ${isStock ? 'installed' : ''}" onclick="selectVisualOption('${key}', -1, ${mod.modType})" data-idx="-1">
            <span class="opt-name">Stock</span>
            ${isStock ? '<span class="opt-installed-tag">Installed</span>' : '<span class="opt-price free">Free</span>'}
        </div>
    `;

    // Mod options
    for (let i = 0; i < mod.options; i++) {
        const price = visualPricing.base + (i * visualPricing.perMod);
        const isInstalled = installedIndex === i;
        optionsHtml += `
            <div class="visual-opt ${isInstalled ? 'installed' : ''}" onclick="selectVisualOption('${key}', ${i}, ${mod.modType})" data-idx="${i}">
                <span class="opt-name">${mod.name} #${i + 1}</span>
                ${isInstalled ? '<span class="opt-installed-tag">Installed</span>' : '<span class="opt-price">$' + price.toLocaleString() + '</span>'}
            </div>
        `;
    }

    content.innerHTML = `
        <div class="visual-detail">
            <div class="visual-header">${mod.name}</div>
            <div class="visual-options">${optionsHtml}</div>
            <div class="btn-row">
                <button class="apply-btn" id="applyVisualBtn" disabled onclick="doVisualMod()">Select a mod to apply</button>
                <button class="btn-cart" id="cartVisualBtn" disabled onclick="addVisualToCart()" title="Add to Cart">🛒</button>
            </div>
        </div>
    `;
}

function selectVisualOption(key, index, modType) {
    selectedVisualIndex = index;
    const mod = visualData[key];
    const installedIndex = currentMods[modType] !== undefined ? currentMods[modType] : -1;

    // Highlight
    document.querySelectorAll('.visual-opt').forEach(opt => {
        opt.classList.toggle('active', parseInt(opt.dataset.idx) === index && !opt.classList.contains('installed'));
    });

    // Preview on car
    try { mp.trigger('cef:tuning:previewVisual', modType, index); } catch(e) {}

    // Update apply button
    const btn = document.getElementById('applyVisualBtn');
    if (index === installedIndex) {
        btn.textContent = 'Already installed';
        btn.disabled = true;
    } else if (index === -1) {
        btn.textContent = 'Revert to Stock (Free)';
        btn.disabled = false;
    } else {
        const price = visualPricing.base + (index * visualPricing.perMod);
        const canAfford = playerInfo.cash >= price;
        btn.textContent = canAfford ? `Apply — $${price.toLocaleString()}` : `Insufficient cash ($${price.toLocaleString()})`;
        btn.disabled = !canAfford;
    }

    // Sync cart button
    const cartBtn = document.getElementById('cartVisualBtn');
    if (cartBtn) cartBtn.disabled = (index === installedIndex);
}

// ─── Color Detail ───
function showColorDetail(key) {
    document.getElementById('noSelection').style.display = 'none';
    const content = document.getElementById('detailContent');
    content.style.display = 'flex';
    content.style.flexDirection = 'column';
    content.style.gap = '10px';

    if (key === 'paint') {
        showPaintColorDetail();
    } else if (key === 'finish') {
        showPaintFinishDetail();
    }
}

function showPaintColorDetail() {
    const content = document.getElementById('detailContent');

    // Get current target color
    const targetRGB = colorTarget === 'primary' ? colorData.primRGB : colorData.secRGB;
    editRGB = { ...targetRGB };

    // Preset grid
    let presetHtml = '';
    for (let i = 0; i < presetColors.length; i++) {
        const c = presetColors[i];
        const isActive = editRGB.r === c.r && editRGB.g === c.g && editRGB.b === c.b;
        presetHtml += `<div class="preset-swatch ${isActive ? 'active' : ''}" title="${c.name}"
            style="background: rgb(${c.r},${c.g},${c.b})"
            onclick="selectPresetColor(${i})"></div>`;
    }

    const price = colorPricing.preset || 0;
    const customPrice = colorPricing.custom || 0;

    content.innerHTML = `
        <div class="color-detail">
            <div class="color-header">Paint Color</div>

            <!-- Primary / Secondary toggle -->
            <div class="color-target-row">
                <button class="color-target-btn ${colorTarget === 'primary' ? 'active' : ''}" onclick="switchColorTarget('primary')">Primary</button>
                <button class="color-target-btn ${colorTarget === 'secondary' ? 'active' : ''}" onclick="switchColorTarget('secondary')">Secondary</button>
            </div>

            <!-- Preview swatch -->
            <div class="color-preview-row">
                <div class="color-swatch" id="colorSwatch" style="background: rgb(${editRGB.r},${editRGB.g},${editRGB.b})"></div>
                <div class="color-swatch-label">
                    Current ${colorTarget}<br>
                    <span class="rgb-val" id="rgbDisplay">R: ${editRGB.r}  G: ${editRGB.g}  B: ${editRGB.b}</span>
                </div>
            </div>

            <!-- Section: Presets -->
            <div class="section-label" style="margin-top:4px">Preset Colors — $${price.toLocaleString()}</div>
            <div class="preset-grid" id="presetGrid">${presetHtml}</div>

            <!-- Section: Custom RGB -->
            <div class="section-label" style="margin-top:4px">Custom RGB — $${customPrice.toLocaleString()}</div>
            <div class="rgb-sliders">
                <div class="rgb-row">
                    <span class="rgb-label r">R</span>
                    <input type="range" class="rgb-slider r" min="0" max="255" value="${editRGB.r}" oninput="onRGBSlider('r', this.value)">
                    <span class="rgb-value" id="valR">${editRGB.r}</span>
                </div>
                <div class="rgb-row">
                    <span class="rgb-label g">G</span>
                    <input type="range" class="rgb-slider g" min="0" max="255" value="${editRGB.g}" oninput="onRGBSlider('g', this.value)">
                    <span class="rgb-value" id="valG">${editRGB.g}</span>
                </div>
                <div class="rgb-row">
                    <span class="rgb-label b">B</span>
                    <input type="range" class="rgb-slider b" min="0" max="255" value="${editRGB.b}" oninput="onRGBSlider('b', this.value)">
                    <span class="rgb-value" id="valB">${editRGB.b}</span>
                </div>
            </div>

            <div class="btn-row">
                <button class="apply-btn" id="applyColorBtn" onclick="doApplyColor()">Apply Color</button>
                <button class="btn-cart" onclick="addColorToCart()" title="Add to Cart">🛒</button>
            </div>
        </div>
    `;
}

function showPaintFinishDetail() {
    const content = document.getElementById('detailContent');
    editPaintType = colorData.paintType || 0;

    let typesHtml = '';
    for (const pt of paintTypes) {
        const isActive = pt.id === editPaintType;
        typesHtml += `
            <div class="visual-opt ${isActive ? 'installed' : ''}" onclick="selectPaintType(${pt.id})" data-ptid="${pt.id}">
                <span class="opt-name">${pt.icon} ${pt.name}</span>
                ${isActive ? '<span class="opt-installed-tag">Current</span>' : ''}
            </div>
        `;
    }

    const price = colorPricing.paintType || 0;

    content.innerHTML = `
        <div class="color-detail">
            <div class="color-header">Paint Finish</div>
            <div style="font-size:10px; color: var(--text-dim); margin-bottom: 4px;">
                Changes the surface finish of your vehicle's paint.
            </div>
            <div class="visual-options">${typesHtml}</div>
            <div class="btn-row">
                <button class="apply-btn" id="applyFinishBtn" disabled onclick="doApplyFinish()">
                    Select a finish — $${price.toLocaleString()}
                </button>
                <button class="btn-cart" id="cartFinishBtn" disabled onclick="addFinishToCart()" title="Add to Cart">🛒</button>
            </div>
        </div>
    `;
}

// ─── Color Helpers ───
function switchColorTarget(target) {
    colorTarget = target;
    showPaintColorDetail();
}

function selectPresetColor(index) {
    const c = presetColors[index];
    if (!c) return;
    editRGB = { r: c.r, g: c.g, b: c.b };
    updateColorPreview();

    // Highlight preset
    document.querySelectorAll('.preset-swatch').forEach((s, i) => {
        s.classList.toggle('active', i === index);
    });

    // Update sliders
    const sliders = document.querySelectorAll('.rgb-slider');
    if (sliders.length >= 3) {
        sliders[0].value = c.r;
        sliders[1].value = c.g;
        sliders[2].value = c.b;
    }
    document.getElementById('valR').textContent = c.r;
    document.getElementById('valG').textContent = c.g;
    document.getElementById('valB').textContent = c.b;

    previewColorOnCar();
}

function onRGBSlider(channel, val) {
    editRGB[channel] = parseInt(val);
    document.getElementById('val' + channel.toUpperCase()).textContent = val;
    updateColorPreview();

    // Deselect presets
    document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));

    previewColorOnCar();
}

function updateColorPreview() {
    const swatch = document.getElementById('colorSwatch');
    if (swatch) swatch.style.background = `rgb(${editRGB.r},${editRGB.g},${editRGB.b})`;
    const disp = document.getElementById('rgbDisplay');
    if (disp) disp.textContent = `R: ${editRGB.r}  G: ${editRGB.g}  B: ${editRGB.b}`;
}

function previewColorOnCar() {
    // Build full color with current edit as the active target
    let prim = colorData.primRGB;
    let sec = colorData.secRGB;

    if (colorTarget === 'primary') prim = editRGB;
    else sec = editRGB;

    try {
        mp.trigger('cef:tuning:previewColor',
            prim.r, prim.g, prim.b,
            sec.r, sec.g, sec.b,
            colorData.paintType
        );
    } catch(e) {}
}

let selectedFinishId = null;

function selectPaintType(id) {
    selectedFinishId = id;
    document.querySelectorAll('.visual-opt[data-ptid]').forEach(opt => {
        const ptid = parseInt(opt.dataset.ptid);
        opt.classList.remove('active');
        if (ptid === id && ptid !== (colorData.paintType || 0)) {
            opt.classList.add('active');
        }
    });

    const btn = document.getElementById('applyFinishBtn');
    if (id === (colorData.paintType || 0)) {
        btn.textContent = 'Already applied';
        btn.disabled = true;
    } else {
        const price = colorPricing.paintType || 0;
        const canAfford = playerInfo.cash >= price;
        btn.textContent = canAfford ? `Apply — $${price.toLocaleString()}` : `Insufficient cash ($${price.toLocaleString()})`;
        btn.disabled = !canAfford;
    }

    // Sync cart button
    const cartBtn = document.getElementById('cartFinishBtn');
    if (cartBtn) cartBtn.disabled = (id === (colorData.paintType || 0));

    // Preview paint type on car
    try {
        mp.trigger('cef:tuning:previewColor',
            colorData.primRGB.r, colorData.primRGB.g, colorData.primRGB.b,
            colorData.secRGB.r, colorData.secRGB.g, colorData.secRGB.b,
            id
        );
    } catch(e) {}
}

// ─── Apply Actions ───
function doPerformanceUpgrade(key) {
    try { mp.trigger('cef:tuning:perfUpgrade', key); } catch(e) {}
}

function doVisualMod() {
    if (selectedVisualIndex === null || !activeCategory) return;
    const mod = visualData[activeCategory];
    if (!mod) return;
    try { mp.trigger('cef:tuning:visualMod', mod.modType, selectedVisualIndex); } catch(e) {}
    // Update installed state locally
    if (selectedVisualIndex === -1) {
        delete currentMods[mod.modType];
    } else {
        currentMods[mod.modType] = selectedVisualIndex;
    }
    setTimeout(() => {
        showVisualDetail(activeCategory);
        buildCategories();
        document.querySelectorAll('.cat-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.key === activeCategory && b.dataset.type === activeCatType)
        );
    }, 100);
}

function doApplyColor() {
    // Determine if preset or custom
    let isPreset = false;
    for (const c of presetColors) {
        if (c.r === editRGB.r && c.g === editRGB.g && c.b === editRGB.b) {
            isPreset = true;
            break;
        }
    }

    // Build new color data
    const newColorData = {
        primRGB: colorTarget === 'primary' ? { ...editRGB } : { ...colorData.primRGB },
        secRGB: colorTarget === 'secondary' ? { ...editRGB } : { ...colorData.secRGB },
        paintType: colorData.paintType,
        type: isPreset ? 'preset' : 'custom'
    };

    try { mp.trigger('cef:tuning:applyColor', JSON.stringify(newColorData)); } catch(e) {}

    // Update local state
    colorData.primRGB = newColorData.primRGB;
    colorData.secRGB = newColorData.secRGB;
}

function doApplyFinish() {
    if (selectedFinishId === null) return;

    const newColorData = {
        primRGB: { ...colorData.primRGB },
        secRGB: { ...colorData.secRGB },
        paintType: selectedFinishId,
        type: 'paintType'
    };

    try { mp.trigger('cef:tuning:applyColor', JSON.stringify(newColorData)); } catch(e) {}

    // Update local state
    colorData.paintType = selectedFinishId;
    selectedFinishId = null;

    // Refresh the panel
    setTimeout(() => showPaintFinishDetail(), 100);
}

// Called from client after wheel type scan
function updateWheelOptions(wheelType, count) {
    wheelOptionCount = count;
    const prices = (specialData.config.prices || {});
    const installedType = (specialData.current || {}).wheelType || 0;
    const installedIndex = (specialData.current || {}).wheelIndex !== undefined ? (specialData.current || {}).wheelIndex : -1;

    let html = '';
    // Stock option
    const isStock = editWheelIndex === -1;
    html += `<div class="visual-opt ${installedType === wheelType && installedIndex === -1 ? 'installed' : ''}"
        onclick="selectWheelOption(-1)" data-idx="-1">

        const isInstalled = installedType === wheelType && installedIndex === i;

function selectWheelOption(index) {
    editWheelIndex = index;
    document.querySelectorAll('#wheelOptions .visual-opt').forEach(opt => {
        const idx = parseInt(opt.dataset.idx);
        opt.classList.toggle('active', idx === index && !opt.classList.contains('installed'));
    });

    try { mp.trigger('cef:tuning:previewWheel', index); } catch(e) {}

    const prices = (specialData.config.prices || {});
    const installedType = (specialData.current || {}).wheelType || 0;
    const installedIndex = (specialData.current || {}).wheelIndex !== undefined ? (specialData.current || {}).wheelIndex : -1;
    const btn = document.getElementById('applyWheelBtn');

    if (editWheelType === installedType && index === installedIndex) {
        btn.textContent = 'Already installed';
        btn.disabled = true;
    } else if (index === -1) {
        btn.textContent = 'Revert to Stock (Free)';
        btn.disabled = false;
    } else {
        const price = prices.wheels || 0;
        const canAfford = playerInfo.cash >= price;
        btn.textContent = canAfford ? `Apply — $${price.toLocaleString()}` : `Insufficient cash ($${price.toLocaleString()})`;
        btn.disabled = !canAfford;
    }

    // Sync cart button
    const cartBtn = document.getElementById('cartWheelBtn');
    if (cartBtn) cartBtn.disabled = (editWheelType === installedType && index === installedIndex);

function toggleXenon() {

    try { mp.trigger('cef:tuning:previewXenon', editXenonEnabled ? 'true' : 'false', editXenonColor); } catch(e) {}
    updateXenonBtn();
}

function selectXenonColor(id) {
    editXenonColor = id;
    if (!editXenonEnabled) {
        editXenonEnabled = true;
        const tog = document.getElementById('xenonToggle');
        if (tog) tog.classList.add('on');
    }
    document.querySelectorAll('#xenonSwatches .swatch-item').forEach((s, i) => {
        const xenonColors = (specialData.config.xenonColors || []);
        s.classList.toggle('active', xenonColors[i] && xenonColors[i].id === id);
    });
    try { mp.trigger('cef:tuning:previewXenon', 'true', id); } catch(e) {}
    updateXenonBtn();
}

function updateXenonBtn() {
    const prices = (specialData.config.prices || {});
    const sc = specialData.current || {};
    const wasEnabled = !!sc.xenonEnabled;
    const oldColor = sc.xenonColor !== undefined ? sc.xenonColor : -1;

    let price = 0;
    if (editXenonEnabled && !wasEnabled) price += prices.xenon || 0;
    if (editXenonEnabled && editXenonColor !== oldColor) price += prices.xenonColor || 0;
    if (!editXenonEnabled && !wasEnabled) price = 0;

    const btn = document.getElementById('applyXenonBtn');
    if (!btn) return;

    if (!editXenonEnabled && !wasEnabled) {
        btn.textContent = 'Already off';
        btn.disabled = true;
    } else if (editXenonEnabled && wasEnabled && editXenonColor === oldColor) {
        btn.textContent = 'No changes';
        btn.disabled = true;
    } else if (price > 0 && playerInfo.cash < price) {
        btn.textContent = `Insufficient cash ($${price.toLocaleString()})`;
        btn.disabled = true;
    } else {
        btn.textContent = price > 0 ? `Apply — $${price.toLocaleString()}` : 'Apply';
        btn.disabled = false;
    }

    // Sync cart button
    const cartBtn = document.getElementById('cartXenonBtn');
    if (cartBtn) cartBtn.disabled = btn.disabled;
}

function doApplyXenon() {
    try { mp.trigger('cef:tuning:applyXenon', editXenonEnabled ? 'true' : 'false', editXenonColor); } catch(e) {}
    specialData.current.xenonEnabled = editXenonEnabled;
    specialData.current.xenonColor = editXenonColor;
    setTimeout(() => showXenonDetail(), 100);
}

    updateNeonBtn();

function selectNeonPreset(index) {
    const presets = (specialData.config.neonPresets || []);

    if (!p) return;
    editNeonColor = { r: p.r, g: p.g, b: p.b };
    updateNeonColorUI();
    previewNeon();

    document.querySelectorAll('#neonPresets .swatch-item').forEach((s, i) => s.classList.toggle('active', i === index));
    updateNeonBtn();
}

function onNeonRGB(ch, val) {
    editNeonColor[ch] = parseInt(val);
    document.getElementById('neonVal' + ch.toUpperCase()).textContent = val;
    updateNeonColorUI();
    previewNeon();
    document.querySelectorAll('#neonPresets .swatch-item').forEach(s => s.classList.remove('active'));
    updateNeonBtn();
}

function updateNeonColorUI() {
    const swatch = document.getElementById('neonSwatch');
    if (swatch) swatch.style.background = `rgb(${editNeonColor.r},${editNeonColor.g},${editNeonColor.b})`;
    const disp = document.getElementById('neonRgbDisp');
    if (disp) disp.textContent = `R: ${editNeonColor.r}  G: ${editNeonColor.g}  B: ${editNeonColor.b}`;

    // Update sliders
    const sliders = document.querySelectorAll('.extra-detail .rgb-slider');
    if (sliders.length >= 3) {
        sliders[0].value = editNeonColor.r;
        sliders[1].value = editNeonColor.g;
        sliders[2].value = editNeonColor.b;
    }
}

function previewNeon() {
    try { mp.trigger('cef:tuning:previewNeon', editNeonMask, editNeonColor.r, editNeonColor.g, editNeonColor.b); } catch(e) {}
}

function updateNeonBtn() {
    const prices = (specialData.config.prices || {});
    const sc = specialData.current || {};
    const oldMask = sc.neonEnabled || 0;
    const oldColor = sc.neonColor || { r: 255, g: 255, b: 255 };
    const oldPacked = (oldColor.r << 16) | (oldColor.g << 8) | oldColor.b;
    const newPacked = (editNeonColor.r << 16) | (editNeonColor.g << 8) | editNeonColor.b;

    let price = 0;
    if (editNeonMask !== oldMask) price += prices.neon || 0;
    if (editNeonMask > 0 && newPacked !== oldPacked) price += prices.neonColor || 0;

    const btn = document.getElementById('applyNeonBtn');
    if (!btn) return;

    if (editNeonMask === oldMask && (editNeonMask === 0 || newPacked === oldPacked)) {
        btn.textContent = 'No changes';
        btn.disabled = true;
    } else if (price > 0 && playerInfo.cash < price) {
        btn.textContent = `Insufficient cash ($${price.toLocaleString()})`;
        btn.disabled = true;
    } else {
        btn.textContent = price > 0 ? `Apply — $${price.toLocaleString()}` : 'Apply';
        btn.disabled = false;
    }

    // Sync cart button
    const cartNeonBtn = document.getElementById('cartNeonBtn');
    if (cartNeonBtn) cartNeonBtn.disabled = btn.disabled;
}

function doApplyNeon() {
    try { mp.trigger('cef:tuning:applyNeon', editNeonMask, editNeonColor.r, editNeonColor.g, editNeonColor.b); } catch(e) {}
    specialData.current.neonEnabled = editNeonMask;
    specialData.current.neonColor = { ...editNeonColor };
    setTimeout(() => showNeonDetail(), 100);
}

                <div class="color-swatch" id="smokeSwatch" style="background:rgb(${editSmokeColor.r},${editSmokeColor.g},${editSmokeColor.b})"></div>
                <div class="color-swatch-label">Smoke Color<br><span class="rgb-val" id="smokeRgbDisp">R: ${editSmokeColor.r}  G: ${editSmokeColor.g}  B: ${editSmokeColor.b}</span></div>
            </div>

            <div class="btn-row">
                <button class="apply-btn" id="applySmokeBtn" onclick="doApplySmoke()">Apply</button>
                <button class="btn-cart" id="cartSmokeBtn" disabled onclick="addSmokeToCart()" title="Add to Cart">🛒</button>
            </div>
        </div>
    `;
    updateSmokeBtn();
}

function toggleSmoke() {
    editSmokeEnabled = !editSmokeEnabled;
    const tog = document.getElementById('smokeToggle');
    if (tog) tog.classList.toggle('on', editSmokeEnabled);
    previewSmoke();
    updateSmokeBtn();
}

function selectSmokePreset(index) {
    const presets = (specialData.config.neonPresets || []);
    const p = presets[index];
    if (!p) return;
    editSmokeColor = { r: p.r, g: p.g, b: p.b };
    if (!editSmokeEnabled) {
        editSmokeEnabled = true;
        const tog = document.getElementById('smokeToggle');
        if (tog) tog.classList.add('on');
    }
    updateSmokeColorUI();
    previewSmoke();
    document.querySelectorAll('#smokePresets .swatch-item').forEach((s, i) => s.classList.toggle('active', i === index));
    updateSmokeBtn();
}

function onSmokeRGB(ch, val) {
    editSmokeColor[ch] = parseInt(val);
    document.getElementById('smokeVal' + ch.toUpperCase()).textContent = val;
    updateSmokeColorUI();
    previewSmoke();
    document.querySelectorAll('#smokePresets .swatch-item').forEach(s => s.classList.remove('active'));
    updateSmokeBtn();
}

function updateSmokeColorUI() {
    const swatch = document.getElementById('smokeSwatch');
    if (swatch) swatch.style.background = `rgb(${editSmokeColor.r},${editSmokeColor.g},${editSmokeColor.b})`;
    const disp = document.getElementById('smokeRgbDisp');
    if (disp) disp.textContent = `R: ${editSmokeColor.r}  G: ${editSmokeColor.g}  B: ${editSmokeColor.b}`;
}

function previewSmoke() {
    try { mp.trigger('cef:tuning:previewSmoke', editSmokeEnabled ? 'true' : 'false', editSmokeColor.r, editSmokeColor.g, editSmokeColor.b); } catch(e) {}
}

function updateSmokeBtn() {
    const prices = (specialData.config.prices || {});
    const sc = specialData.current || {};
    const wasEnabled = !!sc.smokeEnabled;
    const oldColor = sc.smokeColor || { r: 255, g: 255, b: 255 };
    const oldPacked = (oldColor.r << 16) | (oldColor.g << 8) | oldColor.b;
    const newPacked = (editSmokeColor.r << 16) | (editSmokeColor.g << 8) | editSmokeColor.b;

    let price = 0;
    if (editSmokeEnabled && !wasEnabled) price += prices.smoke || 0;
    if (editSmokeEnabled && newPacked !== oldPacked) price += prices.smokeColor || 0;

    const btn = document.getElementById('applySmokeBtn');
    if (!btn) return;

    if (!editSmokeEnabled && !wasEnabled) {
        btn.textContent = 'Already off';
        btn.disabled = true;
    } else if (editSmokeEnabled && wasEnabled && newPacked === oldPacked) {
        btn.textContent = 'No changes';
        btn.disabled = true;
    } else if (!editSmokeEnabled && wasEnabled) {
        btn.textContent = 'Remove Tyre Smoke';
        btn.disabled = false;
    } else if (price > 0 && playerInfo.cash < price) {
        btn.textContent = `Insufficient cash ($${price.toLocaleString()})`;
        btn.disabled = true;
    } else {
        btn.textContent = price > 0 ? `Apply — $${price.toLocaleString()}` : 'Apply';
        btn.disabled = false;
    }

    // Sync cart button
    const cartSmokeBtn = document.getElementById('cartSmokeBtn');
    if (cartSmokeBtn) cartSmokeBtn.disabled = btn.disabled;
}

function doApplySmoke() {
    try { mp.trigger('cef:tuning:applySmoke', editSmokeEnabled ? 'true' : 'false', editSmokeColor.r, editSmokeColor.g, editSmokeColor.b); } catch(e) {}
    specialData.current.smokeEnabled = editSmokeEnabled;
    specialData.current.smokeColor = { ...editSmokeColor };
    setTimeout(() => showSmokeDetail(), 100);
}

// ═══ CART SYSTEM ═══
let cart = [];
let cartIdCounter = 0;
let cartVisible = false;

function addToCart(item) {
    // Deduplicate: replace existing item of same type/sub-type
    if (item.type === 'visual') {
        cart = cart.filter(c => !(c.type === 'visual' && c.params.modType === item.params.modType));
    } else if (item.type === 'color') {
        // Replace existing color entry only for same target (primary or secondary)
        cart = cart.filter(c => !(c.type === 'color' && c.colorTarget === item.colorTarget));
    } else {
        cart = cart.filter(c => c.type !== item.type);
    }
    item.id = ++cartIdCounter;
    cart.push(item);
    updateCartUI();
}

function removeFromCart(id) {
    cart = cart.filter(i => i.id !== id);
    updateCartUI();
}

function clearCart() {
    cart = [];
    updateCartUI();
}

function toggleCart() {
    cartVisible = !cartVisible;
    document.getElementById('cartOverlay').style.display = cartVisible ? 'flex' : 'none';
}

function updateCartUI() {
    const count = cart.length;
    const btn = document.getElementById('cartBtn');
    const badge = document.getElementById('cartBadge');

    if (count > 0) {
        btn.style.display = 'flex';
        badge.textContent = count;
    } else {
        btn.style.display = 'none';
        if (cartVisible) { cartVisible = false; document.getElementById('cartOverlay').style.display = 'none'; }
    }

    // Render items
    const container = document.getElementById('cartItems');
    if (count === 0) {
        container.innerHTML = '<div class="cart-empty">Cart is empty</div>';
    } else {
        container.innerHTML = cart.map(item => `
            <div class="cart-item">
                <span class="ci-label">${item.label}</span>
                <span class="ci-price">$${item.price.toLocaleString()}</span>
                <button class="ci-remove" onclick="removeFromCart(${item.id})">&times;</button>
            </div>
        `).join('');
    }

    // Total
    const total = cart.reduce((sum, i) => sum + i.price, 0);
    document.getElementById('cartTotal').textContent = '$' + total.toLocaleString();
    document.getElementById('cartCount').textContent = `(${count})`;

    const buyBtn = document.getElementById('cartBuyBtn');
    if (count === 0) {
        buyBtn.textContent = 'Cart is empty';
        buyBtn.disabled = true;
    } else if (total > playerInfo.cash) {
        buyBtn.textContent = `Insufficient cash ($${total.toLocaleString()})`;
        buyBtn.disabled = true;
    } else {
        buyBtn.textContent = `Buy All — $${total.toLocaleString()}`;
        buyBtn.disabled = false;
    }
}

function doBuyAll() {
    if (cart.length === 0) return;
    const total = cart.reduce((sum, i) => sum + i.price, 0);
    if (total > playerInfo.cash) return;

    // Send cart to server
    try { mp.trigger('cef:tuning:cartPurchase', JSON.stringify(cart)); } catch(e) {}

    // Update local state for each item
    for (const item of cart) {
        if (item.type === 'visual') {
            if (item.params.modIndex === -1) delete currentMods[item.params.modType];
            else currentMods[item.params.modType] = item.params.modIndex;
        } else if (item.type === 'wheels') {
            specialData.current.wheelType = item.params.wheelType;
            specialData.current.wheelIndex = item.params.wheelIndex;
        } else if (item.type === 'xenon') {
            specialData.current.xenonEnabled = item.params.enabled;
            specialData.current.xenonColor = item.params.colorId;
        } else if (item.type === 'plate') {
            specialData.current.plateStyle = item.params.plateStyle;
            editPlateStyle = item.params.plateStyle;
        } else if (item.type === 'neon') {
            specialData.current.neonEnabled = item.params.bitmask;
            specialData.current.neonColor = { r: item.params.r, g: item.params.g, b: item.params.b };
        } else if (item.type === 'smoke') {
            specialData.current.smokeEnabled = item.params.enabled;
            specialData.current.smokeColor = { r: item.params.r, g: item.params.g, b: item.params.b };
        } else if (item.type === 'color') {
            if (item.params.primRGB) colorData.primRGB = item.params.primRGB;
            if (item.params.secRGB) colorData.secRGB = item.params.secRGB;
        } else if (item.type === 'finish') {
            colorData.paintType = item.params.paintType;
        }
    }

    // Deduct cash locally
    playerInfo.cash -= total;
    document.getElementById('playerCash').textContent = '$' + playerInfo.cash.toLocaleString();

    // Clear cart
    cart = [];
    updateCartUI();

    // Rebuild categories and refresh current panel
    buildCategories();
    if (activeCategory && activeCatType) {
        setTimeout(() => selectCategory(activeCatType, activeCategory), 100);
    }
}

// ─── Add-to-Cart Helpers ───
function addVisualToCart() {
    if (selectedVisualIndex === null || !activeCategory) return;
    const mod = visualData[activeCategory];
    if (!mod) return;
    const idx = selectedVisualIndex;
    const installedIdx = currentMods[mod.modType] !== undefined ? currentMods[mod.modType] : -1;
    if (idx === installedIdx) return;
    const price = idx === -1 ? 0 : visualPricing.base + (idx * visualPricing.perMod);
    addToCart({
        type: 'visual',
        label: idx === -1 ? `${mod.name} (Stock)` : `${mod.name} #${idx + 1}`,
        price: price,
        params: { modType: mod.modType, modIndex: idx }
    });
}

function addWheelsToCart() {
    const prices = (specialData.config.prices || {});
    const installedType = (specialData.current || {}).wheelType || 0;
    const installedIdx = (specialData.current || {}).wheelIndex !== undefined ? (specialData.current || {}).wheelIndex : -1;
    if (editWheelType === installedType && editWheelIndex === installedIdx) return;
    const price = editWheelIndex === -1 ? 0 : (prices.wheels || 0);
    addToCart({
        type: 'wheels',
        label: editWheelIndex === -1 ? 'Stock Wheels' : `Wheel #${editWheelIndex + 1}`,
        price: price,
        params: { wheelType: editWheelType, wheelIndex: editWheelIndex }
    });
}

function addXenonToCart() {
    const prices = (specialData.config.prices || {});
    const sc = specialData.current || {};
    const wasEnabled = !!sc.xenonEnabled;
    const oldColor = sc.xenonColor !== undefined ? sc.xenonColor : -1;
    let price = 0;
    if (editXenonEnabled && !wasEnabled) price += prices.xenon || 0;
    if (editXenonEnabled && editXenonColor !== oldColor) price += prices.xenonColor || 0;
    if (price === 0 && editXenonEnabled === wasEnabled && editXenonColor === oldColor) return;
    const xenonColors = (specialData.config.xenonColors || []);
    const colorEntry = xenonColors.find(x => x.id === editXenonColor);
    addToCart({
        type: 'xenon',
        label: editXenonEnabled ? `Xenon ${colorEntry ? colorEntry.name : ''}` : 'Remove Xenon',
        price: price,
        params: { enabled: editXenonEnabled, colorId: editXenonColor }
    });
}

function addPlateToCart() {
    if (selectedPlateId === null || selectedPlateId === editPlateStyle) return;
    const prices = (specialData.config.prices || {});
    const plateStyles = (specialData.config.plateStyles || []);
    const style = plateStyles.find(p => p.id === selectedPlateId);
    addToCart({
        type: 'plate',
        label: style ? style.name : `Plate #${selectedPlateId}`,
        price: prices.plate || 0,
        params: { plateStyle: selectedPlateId }
    });
}

function addNeonToCart() {
    const prices = (specialData.config.prices || {});
    const sc = specialData.current || {};
    const oldMask = sc.neonEnabled || 0;
    const oldColor = sc.neonColor || { r: 255, g: 255, b: 255 };
    const oldPacked = (oldColor.r << 16) | (oldColor.g << 8) | oldColor.b;
    const newPacked = (editNeonColor.r << 16) | (editNeonColor.g << 8) | editNeonColor.b;
    let price = 0;
    if (editNeonMask !== oldMask) price += prices.neon || 0;
    if (editNeonMask > 0 && newPacked !== oldPacked) price += prices.neonColor || 0;
    if (editNeonMask === oldMask && (editNeonMask === 0 || newPacked === oldPacked)) return;
    const sides = ['L','R','F','B'];
    let sideStr = '';
    for (let i = 0; i < 4; i++) { if (editNeonMask & (1 << i)) sideStr += sides[i]; }
    addToCart({
        type: 'neon',
        label: sideStr ? `Neon ${sideStr} (${editNeonColor.r},${editNeonColor.g},${editNeonColor.b})` : 'Neon Off',
        price: price,
        params: { bitmask: editNeonMask, r: editNeonColor.r, g: editNeonColor.g, b: editNeonColor.b }
    });
}

function addSmokeToCart() {
    const prices = (specialData.config.prices || {});
    const sc = specialData.current || {};
    const wasEnabled = !!sc.smokeEnabled;
    const oldColor = sc.smokeColor || { r: 255, g: 255, b: 255 };
    const oldPacked = (oldColor.r << 16) | (oldColor.g << 8) | oldColor.b;
    const newPacked = (editSmokeColor.r << 16) | (editSmokeColor.g << 8) | editSmokeColor.b;
    if (!editSmokeEnabled && !wasEnabled) return;
    if (editSmokeEnabled && wasEnabled && newPacked === oldPacked) return;
    let price = 0;
    if (editSmokeEnabled && !wasEnabled) price += prices.smoke || 0;
    if (editSmokeEnabled && newPacked !== oldPacked) price += prices.smokeColor || 0;
    addToCart({
        type: 'smoke',
        label: editSmokeEnabled ? `Smoke (${editSmokeColor.r},${editSmokeColor.g},${editSmokeColor.b})` : 'Remove Smoke',
        price: price,
        params: { enabled: editSmokeEnabled, r: editSmokeColor.r, g: editSmokeColor.g, b: editSmokeColor.b }
    });
}

function addColorToCart() {
    let isPreset = false;
    for (const c of presetColors) {
        if (c.r === editRGB.r && c.g === editRGB.g && c.b === editRGB.b) { isPreset = true; break; }
    }
    const price = isPreset ? (colorPricing.preset || 0) : (colorPricing.custom || 0);
    addToCart({
        type: 'color',
        colorTarget: colorTarget,
        label: `${colorTarget === 'primary' ? 'Primary' : 'Secondary'} (${editRGB.r},${editRGB.g},${editRGB.b})`,
        price: price,
        params: {
            primRGB: colorTarget === 'primary' ? { ...editRGB } : { ...colorData.primRGB },
            secRGB: colorTarget === 'secondary' ? { ...editRGB } : { ...colorData.secRGB },
            paintType: colorData.paintType,
            type: isPreset ? 'preset' : 'custom'
        }
    });
}

function addFinishToCart() {
    if (selectedFinishId === null || selectedFinishId === (colorData.paintType || 0)) return;
    const price = colorPricing.paintType || 0;
    const ptEntry = paintTypes.find(p => p.id === selectedFinishId);
    addToCart({
        type: 'finish',
        label: ptEntry ? `${ptEntry.icon} ${ptEntry.name}` : `Finish #${selectedFinishId}`,
        price: price,
        params: {
            primRGB: { ...colorData.primRGB },
            secRGB: { ...colorData.secRGB },
            paintType: selectedFinishId,
            type: 'paintType'
        }
    });
}

function closeUI() {
    try { mp.trigger('cef:tuning:close'); } catch(e) {}
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeUI();
});
</script>
