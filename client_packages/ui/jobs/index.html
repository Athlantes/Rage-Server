<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: rgba(18, 18, 18, 0.95); /* Dark overlay background */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .container {
            width: 80%;
            max-width: 1100px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: -webkit-linear-gradient(#eee, #999);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        /* Grid Layout */
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Scrollbar Styling */
        .jobs-grid::-webkit-scrollbar { width: 6px; }
        .jobs-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        .jobs-grid::-webkit-scrollbar-track { background: #222; }

        /* Job Card */
        .job-card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            border-left: 5px solid #444;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .job-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background: #252525;
        }

        .job-card.active { border-left-color: #00ff88; } /* Color for active jobs */
        .job-card.locked { opacity: 0.6; filter: grayscale(1); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .job-icon {
            font-size: 2rem;
            color: #ccc;
            width: 50px;
            text-align: center;
        }

        .job-info h2 { margin: 0; font-size: 1.4rem; color: #fff; }
        .job-info span { font-size: 0.9rem; color: #F0C400; text-transform: uppercase; font-weight: bold; }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }

        /* Progress Bar */
        .progress-container {
            background: #333;
            height: 8px;
            border-radius: 4px;
            width: 100%;
            margin-top: 10px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #F0C400, #ff9a00);
            border-radius: 4px;
            width: 0%;
            transition: width 1s cubic-bezier(0.1, 0.7, 1.0, 0.1);
        }

        .progress-text {
            font-size: 0.8rem;
            color: #777;
            text-align: right;
            margin-top: 4px;
        }

        .job-desc {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.4;
            height: 40px; /* Fixed height for consistency */
            overflow: hidden;
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.3s;
        }
        .close-btn:hover { opacity: 1; color: #ff4d4d; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="close-btn" onclick="closeMenu()">&times;</div>
    
    <div class="container">
        <header>
            <div>
                <h1>Career Center</h1>
                <div class="subtitle">Track your professional progress</div>
            </div>
        </header>

        <div class="jobs-grid" id="jobsList">
            </div>
    </div>

    <script>
        function renderJobs(jobsJson) {
            const jobs = JSON.parse(jobsJson);
            const container = document.getElementById('jobsList');
            container.innerHTML = '';

            jobs.forEach(job => {
                // Calculate Progress % inside the current level
                // Next Level XP = Level^2 * 100
                // Current Base XP = (Level-1)^2 * 100
                // This ensures the bar fills up for the CURRENT level, not from 0
                
                const currentLevelBase = Math.pow(job.level - 1, 2) * 100; 
                const nextLevelTotal = Math.pow(job.level, 2) * 100;
                
                const range = nextLevelTotal - currentLevelBase;
                const progress = job.xp - currentLevelBase;
                
                let percent = (progress / range) * 100;
                if(percent > 100) percent = 100;
                if(percent < 0) percent = 0;

                const icon = getJobIcon(job.key);

                const html = `
                    <div class="job-card ${job.active ? 'active' : ''}">
                        <div class="card-header">
                            <div class="job-info">
                                <h2>${job.name}</h2>
                                <span>${job.rank}</span>
                            </div>
                            <div class="job-icon"><i class="${icon}"></i></div>
                        </div>
                        
                        <div class="stat-row">
                            <span>Level ${job.level}</span>
                            <span>${job.xp} / ${nextLevelTotal} XP</span>
                        </div>

                        <div class="progress-container">
                            <div class="progress-fill" style="width: ${percent}%"></div>
                        </div>
                        <div class="progress-text">${Math.floor(percent)}% to next promotion</div>

                        <div class="job-desc">${job.description}</div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function getJobIcon(key) {
            switch(key) {
                case 'garbage': return 'fas fa-trash-alt';
                case 'courier': return 'fas fa-box-open';
                case 'taxi': return 'fas fa-taxi';
                case 'police': return 'fas fa-shield-alt';
                default: return 'fas fa-briefcase';
            }
        }

        function closeMenu() {
            // Trigger client-side event to close
            if('mp' in window) {
                mp.trigger('client:closeJobMenu');
            }
        }
    </script>
</body>
</html>
