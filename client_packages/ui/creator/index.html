<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; font-family: 'Arial', sans-serif; user-select: none; }
        .creator-container {
            position: absolute; top: 50px; right: 50px;
            width: 350px; background: rgba(0, 0, 0, 0.85);
            color: white; padding: 20px; border-radius: 10px;
        }
        .header { text-align: center; font-size: 24px; margin-bottom: 20px; font-weight: bold; }
        .tabs { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .tabs button {
            background: none; border: none; color: #888; font-weight: bold; cursor: pointer;
        }
        .tabs button.active { color: #fff; border-bottom: 2px solid #0f0; }
        .panel { display: none; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        input[type=range] { width: 100%; }
        .clothing-selector { display: flex; align-items: center; justify-content: space-between; }
        .clothing-selector button { background: #333; color: white; border: none; width: 30px; height: 30px; cursor: pointer; }
        .save-btn {
            width: 100%; padding: 15px; background: #00aa00; color: white; 
            border: none; font-size: 18px; margin-top: 20px; cursor: pointer;
        }
        .gender-btn { width: 48%; padding: 10px; background: #333; color: white; border: none; cursor: pointer; }
        .gender-btn.active { background: #00aa00; }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../../creator/clothingConfig.js"></script> </head>
<body>
    <div class="creator-container">
        <div class="header">CITIZEN ID</div>
        
        <div class="tabs">
            <button onclick="setTab('gender')" class="active" id="tab-gender">Info</button>
            <button onclick="setTab('heritage')" id="tab-heritage">Face</button>
            <button onclick="setTab('style')" id="tab-style">Style</button>
            <button onclick="setTab('clothes')" id="tab-clothes">Clothes</button>
        </div>

        <div id="gender-panel" class="panel" style="display:block;">
            <div class="control-group">
                <label>Gender</label>
                <div style="display:flex; justify-content:space-between;">
                    <button class="gender-btn active" onclick="selectGender(0)" id="btn-male">Male</button>
                    <button class="gender-btn" onclick="selectGender(1)" id="btn-female">Female</button>
                </div>
            </div>
        </div>

        <div id="heritage-panel" class="panel">
            <div class="control-group">
                <label>Mother</label>
                <input type="range" min="21" max="45" value="21" oninput="updateHeritage()" id="mom">
            </div>
            <div class="control-group">
                <label>Father</label>
                <input type="range" min="0" max="20" value="0" oninput="updateHeritage()" id="dad">
            </div>
            <div class="control-group">
                <label>Resemblance</label>
                <input type="range" min="0.0" max="1.0" step="0.1" value="0.5" oninput="updateHeritage()" id="mix">
            </div>
        </div>

        <div id="style-panel" class="panel">
            <div class="control-group">
                <label>Hair Style</label>
                <input type="range" min="0" max="75" value="0" oninput="updateHair()" id="hairStyle">
            </div>
            <div class="control-group">
                <label>Hair Color</label>
                <input type="range" min="0" max="63" value="0" oninput="updateHair()" id="hairColor">
            </div>
        </div>

        <div id="clothes-panel" class="panel">
            <div class="control-group">
                <label>Top</label>
                <div class="clothing-selector">
                    <button onclick="updateClothing('tops', -1)">&lt;</button>
                    <span id="label-tops">Loading...</span>
                    <button onclick="updateClothing('tops', 1)">&gt;</button>
                </div>
            </div>
            <div class="control-group">
                <label>Pants</label>
                <div class="clothing-selector">
                    <button onclick="updateClothing('legs', -1)">&lt;</button>
                    <span id="label-legs">Loading...</span>
                    <button onclick="updateClothing('legs', 1)">&gt;</button>
                </div>
            </div>
            <div class="control-group">
                <label>Shoes</label>
                <div class="clothing-selector">
                    <button onclick="updateClothing('shoes', -1)">&lt;</button>
                    <span id="label-shoes">Loading...</span>
                    <button onclick="updateClothing('shoes', 1)">&gt;</button>
                </div>
            </div>
        </div>

        <button class="save-btn" onclick="saveCharacter()">FINISH</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
