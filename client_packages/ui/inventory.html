<!DOCTYPE html>
<html>
<head>
    <style>
        /* ... [Previous CSS] ... */
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 6px; background: transparent; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #0084ff; border-radius: 3px; box-shadow: 0 0 5px rgba(0, 132, 255, 0.5); }
        
        body {
            background-color: rgba(0, 0, 0, 0.7); 
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
            padding-bottom: 10px;
        }

        .header-row h2 {
            border-bottom: none;
            margin: 0; padding: 0;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px;
            transition: all 0.2s;
        }

        .search-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 132, 255, 0.1);
        }

        .search-icon { padding: 0 8px; color: var(--text-sub); }

        .search-input {
            background: transparent;
            border: none;
            color: white;
            padding: 6px 0;
            width: 140px;
            font-size: 12px;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.2); }

        .search-nav { display: flex; flex-direction: column; gap: 1px; padding-right: 2px; }

        .nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #aaa;
            cursor: pointer;
            width: 16px; height: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 8px; border-radius: 2px; transition: 0.1s;
        }
        .nav-btn:hover { background: var(--accent); color: #000; }
        
        .slot {
            width: var(--slot-size); height: var(--slot-size); 
            background: var(--bg-slot); border: 1px solid var(--border); 
            border-radius: 4px; position: relative; cursor: pointer; 
            transition: 0.2s;
        }
        .slot:hover { border-color: var(--accent); background: rgba(0, 162, 255, 0.1); }
        
        .slot.dimmed { opacity: 0.2; filter: grayscale(0.8); pointer-events: none; }
        .slot.search-match { 
            border-color: rgba(0, 132, 255, 0.5); 
            box-shadow: inset 0 0 10px rgba(0, 132, 255, 0.1);
            opacity: 1 !important;
            filter: none !important;
        }
        .slot.search-focus {
            border: 2px solid #0084ff;
            box-shadow: 0 0 15px rgba(0, 132, 255, 0.5);
            transform: scale(1.05);
            z-index: 10;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            height: 32px;
        }
        .btn-action:hover { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 8px rgba(0, 110, 255, 0.116); }
        .btn-action svg { display: block; }

        #context-menu {
            display: none;
            position: absolute;
            background: rgba(20, 20, 20, 0.98);
            border: 1px solid #0084ff;
            border-radius: 4px;
            width: 150px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 1000;
            flex-direction: column;
        }
        
        .ctx-item {
            padding: 10px 15px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s;
        }
        .ctx-item:hover { background: #0084ff; color: #000; }
        .ctx-item:last-child { border-bottom: none; }

        #split-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-box {
            background: rgba(20, 20, 20, 0.95);
            border-top: 4px solid #0084ff;
            padding: 20px;
            width: 300px;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-title { color: #0084ff; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; }
        
        .modal-input {
            width: 100%; padding: 10px;
            background: rgba(255,255,255,0.1); border: 1px solid #444;
            color: white; border-radius: 4px; outline: none; text-align: center;
            font-size: 18px; margin-bottom: 15px;
        }
        .modal-input:focus { border-color: #0084ff; }
        
        .modal-actions { display: flex; gap: 10px; }
        
        .btn { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-confirm { background: #0084ff; color: #000; }
        .btn-confirm:hover { background: #66b5ff; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }

        :root { --bg-dark: rgba(15, 15, 15, 0.95); --bg-slot: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); --accent: #0084ff; --text-main: #ffffff; --text-sub: #888888; --slot-size: 90px; }
        .inventory-wrapper { display: flex; gap: 20px; width: 1400px; height: 700px; }
        .col { background: var(--bg-dark); border-radius: 8px; border-top: 4px solid var(--accent); padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .col-left { width: 250px; flex-shrink: 0; }
        .col-mid { flex-grow: 1; }
        .col-right{ width: 400px; flex-shrink: 0; }
        h2 { margin: 0 0 15px 0; font-size: 16px; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, var(--slot-size)); grid-auto-rows: var(--slot-size); gap: 10px; overflow-y: auto; padding: 10px; justify-content: center; flex-grow: 1; min-height: 0; }
        
        .item-img { width: 70%; height: 70%; position: absolute; top: 15%; left: 15%; object-fit: contain; }
        .item-count { position: absolute; bottom: 2px; right: 4px; font-size: 11px; color: #aaa; background: rgba(0,0,0,0.5); padding: 0 2px; border-radius: 2px;}
        .equip-list { display: flex; flex-direction: column; gap: 10px; }
        .equip-slot { display: flex; align-items: center; background: var(--bg-slot); padding: 10px; border-radius: 4px; border: 1px solid var(--border); }
        .equip-label { font-size: 12px; color: var(--text-sub); width: 60px; text-transform: uppercase;}
        .equip-box { width: 40px; height: 40px; border: 1px dashed var(--text-sub); border-radius: 4px; margin-left: auto; position: relative; overflow: hidden; }
        .hotbar-container { margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; display: flex; flex-direction: column; align-items: center; }
        .hotbar-label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .hotbar-grid { display: flex; gap: 10px; justify-content: center; width: 100%; }
        .hotbar-slot { width: var(--slot-size); height: var(--slot-size); background: rgba(0, 132, 255, 0.05); border: 1px solid var(--border); border-radius: 4px; position: relative; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .hotbar-slot:hover { border-color: var(--accent); }
        .key-number { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--accent); font-weight: bold; }
        .weight-container { margin-top: auto; padding-top: 15px; }
        .weight-text { display: flex; justify-content: space-between; font-size: 12px; color: #ccc; margin-bottom: 5px; }
        .weight-bar-bg { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .weight-bar-fill { height: 100%; background: var(--accent); width: 20%; box-shadow: 0 0 10px var(--accent); }
        #notif-stack { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); width: 400px; display: flex; flex-direction: column-reverse; z-index: 1000; pointer-events: none; }
        .notif-card { background: rgba(0, 0, 0, 0.9); border-left: 4px solid #0084ff; color: white; padding: 15px; margin-top: 10px; border-radius: 4px; box-shadow: 0px 5px 20px rgba(0,0,0,0.5); opacity: 0; animation: slideUp 0.3s forwards; }
        .notif-title { font-size: 14px; font-weight: bold; color: #0084ff; text-transform: uppercase; margin-bottom: 4px; }
        .notif-msg { font-size: 13px; color: #ddd; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onclick="hideContextMenu()"> <div class="inventory-wrapper">
        <div class="col col-left">
            <h2>Character</h2>
            <div class="equip-list">
                <div class="equip-slot"><span class="equip-label">Mask</span><div class="equip-box" id="eq-1"></div></div>
                <div class="equip-slot"><span class="equip-label">Torso</span><div class="equip-box" id="eq-11"></div></div>
                <div class="equip-slot"><span class="equip-label">Legs</span><div class="equip-box" id="eq-4"></div></div>
                <div class="equip-slot"><span class="equip-label">Shoes</span><div class="equip-box" id="eq-6"></div></div>
            </div>
        </div>

        <div class="col col-mid">
            <div class="header-row">
                <h2>Inventory</h2>
                <div class="header-actions">
                    <div class="search-container">
                        <div class="search-icon">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </div>
                        <input type="text" id="search-input" class="search-input" placeholder="Search..." 
                               oninput="handleSearch(this.value)" 
                               onkeydown="checkNav(event)"
                               onfocus="setFocus(true)"
                               onblur="setFocus(false)">
                        
                        <div class="search-nav">
                            <button class="nav-btn" onclick="prevMatch()">▲</button>
                            <button class="nav-btn" onclick="nextMatch()">▼</button>
                        </div>
                    </div>

                    <button class="btn-action" onclick="requestStack()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                        </svg>
                        STACK
                    </button>
                    
                    <button class="btn-action" onclick="requestSort()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <polyline points="19 12 12 19 5 12"></polyline>
                        </svg>
                        SORT
                    </button>
                </div>
            </div>
            <div class="grid" id="inventory-grid"></div>

            <div class="hotbar-container">
                <div class="hotbar-label">Fast Access</div>
                <div class="hotbar-grid" id="hotbar-grid"></div>
            </div>

            <div class="weight-container">
                <div class="weight-text"><span>Total Weight</span><span>0kg / 40kg</span></div>
                <div class="weight-bar-bg"><div class="weight-bar-fill" style="width: 0%"></div></div>
            </div>
        </div>

        <div class="col col-right">
            <h2>Vicinity</h2>
            <div class="grid" id="ground-grid"></div>
        </div>
    </div>

    <div id="context-menu"></div>

    <div id="split-modal">
        <div class="modal-box">
            <div class="modal-title">Split Item</div>
            <input type="number" id="split-amount" class="modal-input" placeholder="Amount" min="1">
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeSplit()">Cancel</button>
                <button class="btn btn-confirm" onclick="confirmSplit()">Split</button>
            </div>
        </div>
    </div>

    <div id="notif-stack"></div>

    <script>
    const grid = document.getElementById('inventory-grid');
    const groundGrid = document.getElementById('ground-grid');
    const contextMenu = document.getElementById('context-menu');
    let currentSplitSlot = null;
    let draggedSlot = null;
    
    // --- SEARCH STATE ---
    let globalInventoryData = []; 
    let searchMatches = []; 
    let currentMatchIndex = -1; 

    // --- NEW: FOCUS SYNC ---
    function setFocus(state) {
        if ('mp' in window) {
            mp.trigger('client:setSearchFocus', state);
        }
    }

    function hideContextMenu() {
        contextMenu.style.display = 'none';
    }

    function loadInventory(data) {
        globalInventoryData = data.inventory; 

        // --- WEIGHT UI ---
        const pct = (parseFloat(data.weight) / data.maxWeight) * 100;
        document.querySelector('.weight-bar-fill').style.width = pct + '%';
        document.querySelector('.weight-text').innerHTML = `<span>Total Weight</span><span>${data.weight}kg / ${data.maxWeight}kg</span>`;

        // --- MAIN INVENTORY GRID ---
        grid.innerHTML = '';
        const maxUsedSlot = data.inventory.reduce((max, item) => (item.slot >= 0 && item.slot > max) ? item.slot : max, -1);
        const dynamicSize = Math.max(48, maxUsedSlot + 12);

        for (let i = 0; i < dynamicSize; i++) {
            const item = data.inventory.find(inv => inv.slot === i);
            let slotDiv = createSlotDiv(i, item);
            grid.appendChild(slotDiv);
        }

        // --- HOTBAR ---
        const hotbarContainer = document.getElementById('hotbar-grid');
        hotbarContainer.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const realSlotId = -51 - i;
            const item = data.inventory.find(inv => inv.slot === realSlotId);

            let slotDiv = document.createElement('div');
            slotDiv.className = 'hotbar-slot';
            slotDiv.innerHTML = `<span class="key-number">${i + 1}</span>`;
            
            slotDiv.ondragover = (e) => e.preventDefault();
            slotDiv.ondrop = (e) => handleDrop(e, realSlotId);

            if (item) {
                slotDiv.oncontextmenu = (e) => showContextMenu(e, item);
                let itemDiv = createItemDiv(item, realSlotId);
                slotDiv.appendChild(itemDiv);
            }
            hotbarContainer.appendChild(slotDiv);
        }

        // --- VICINITY ---
        groundGrid.innerHTML = '';
        const vicinityCol = document.querySelector('.col-right');
        vicinityCol.ondragover = (e) => e.preventDefault();
        vicinityCol.ondrop = (e) => handleDrop(e, 'GROUND');

        if (data.vicinity) {
            data.vicinity.forEach(gItem => {
                let slotDiv = document.createElement('div');
                slotDiv.className = 'slot';
                const groundId = 'ground_' + gItem.id;
                slotDiv.innerHTML = `
                    <img src="items/${gItem.itemId}.png" class="item-img" onerror="this.src='items/default.png'">
                    <span class="item-count">x${gItem.count}</span>
                `;
                slotDiv.draggable = true;
                slotDiv.ondragstart = (e) => {
                    draggedSlot = groundId; 
                    e.dataTransfer.effectAllowed = 'move';
                };
                groundGrid.appendChild(slotDiv);
            });
        }

        // --- EQUIPMENT ---
        const equipMap = { '-1':'eq-1', '-11':'eq-11', '-4':'eq-4', '-6':'eq-6' };
        Object.values(equipMap).forEach(divId => {
            const div = document.getElementById(divId);
            if(div) {
                div.innerHTML = '';
                div.ondragover = (e) => e.preventDefault();
                const targetSlot = parseInt(divId.replace('eq-', '-'));
                div.ondrop = (e) => handleDrop(e, targetSlot);
            }
        });
        
        data.inventory.forEach(item => {
            if (item.slot < 0 && item.slot > -50) {
                const divId = equipMap[item.slot.toString()];
                const slotDiv = document.getElementById(divId);
                if (slotDiv) {
                    slotDiv.oncontextmenu = (e) => showContextMenu(e, item);
                    let itemDiv = document.createElement('div');
                    itemDiv.className = 'item-inner';
                    itemDiv.innerHTML = `<img src="items/${item.itemId}.png" class="item-img" style="width:100%; height:100%; top:0; left:0;" onerror="this.src='items/default.png'">`;
                    itemDiv.draggable = true;
                    itemDiv.ondragstart = (e) => { draggedSlot = item.slot; };
                    slotDiv.appendChild(itemDiv);
                }
            }
        });

        // Re-apply search if exists
        const currentSearch = document.getElementById('search-input').value;
        if(currentSearch.length > 0) handleSearch(currentSearch);
    }

    // --- SEARCH LOGIC ---
    function handleSearch(query) {
        query = query.toLowerCase().trim();
        searchMatches = [];
        
        const allSlots = document.querySelectorAll('.slot');
        
        if (query.length === 0) {
            allSlots.forEach(el => {
                el.classList.remove('dimmed', 'search-match', 'search-focus');
            });
            currentMatchIndex = -1;
            return;
        }

        allSlots.forEach(el => {
            const slotIdx = parseInt(el.getAttribute('data-slot'));
            const item = globalInventoryData.find(i => i.slot === slotIdx);
            
            let isMatch = false;
            if (item) {
                if (item.itemId.toLowerCase().includes(query) || (item.name && item.name.toLowerCase().includes(query))) {
                    isMatch = true;
                }
            }

            if (isMatch) {
                el.classList.add('search-match');
                el.classList.remove('dimmed');
                searchMatches.push(slotIdx);
            } else {
                el.classList.remove('search-match', 'search-focus');
                el.classList.add('dimmed');
            }
        });

        if (searchMatches.length > 0) {
            currentMatchIndex = 0;
            highlightMatch(currentMatchIndex);
        } else {
            currentMatchIndex = -1;
        }
    }

    function checkNav(e) {
        if (e.key === 'Enter') {
            if (e.shiftKey) prevMatch();
            else nextMatch();
        }
        else if (e.key === 'ArrowDown') nextMatch();
        else if (e.key === 'ArrowUp') prevMatch();
    }

    function nextMatch() {
        if (searchMatches.length === 0) return;
        currentMatchIndex++;
        if (currentMatchIndex >= searchMatches.length) currentMatchIndex = 0;
        highlightMatch(currentMatchIndex);
    }

    function prevMatch() {
        if (searchMatches.length === 0) return;
        currentMatchIndex--;
        if (currentMatchIndex < 0) currentMatchIndex = searchMatches.length - 1;
        highlightMatch(currentMatchIndex);
    }

    function highlightMatch(index) {
        document.querySelectorAll('.search-focus').forEach(el => el.classList.remove('search-focus'));

        const targetSlot = searchMatches[index];
        const el = document.querySelector(`.slot[data-slot="${targetSlot}"]`);
        if (el) {
            el.classList.add('search-focus');
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function createSlotDiv(i, item) {
        let slotDiv = document.createElement('div');
        slotDiv.className = 'slot';
        slotDiv.setAttribute('data-slot', i);
        slotDiv.ondragover = (e) => e.preventDefault();
        slotDiv.ondrop = (e) => handleDrop(e, i);

        if (item) {
            slotDiv.oncontextmenu = (e) => showContextMenu(e, item);
            let itemDiv = createItemDiv(item, i);
            slotDiv.appendChild(itemDiv);
        }
        return slotDiv;
    }
    
    function createItemDiv(item, slotId) {
        let itemDiv = document.createElement('div');
        itemDiv.className = 'item-inner';
        
        let countDisplay = '';
        if (item.type === 'weapon' && item.data && item.data.ammo > 0) {
            countDisplay = `<span class="item-count" style="color:#0084ff;">${item.data.ammo}</span>`;
        } else if (item.count > 1) {
            countDisplay = `<span class="item-count">x${item.count}</span>`;
        }

        itemDiv.innerHTML = `
            <img src="items/${item.itemId}.png" class="item-img" onerror="this.src='items/default.png'">
            ${countDisplay}
        `;
        itemDiv.draggable = true;
        itemDiv.ondragstart = (e) => {
            draggedSlot = slotId;
            e.dataTransfer.effectAllowed = 'move';
        };
        return itemDiv;
    }

    function showContextMenu(e, item) {
        e.preventDefault();
        e.stopPropagation();

        contextMenu.innerHTML = '';
        
        let useLabel = "Use";
        let action = "use"; 
        
        if (item.type === 'food') useLabel = "Eat";
        else if (item.type === 'drink') useLabel = "Drink";
        else if (item.type === 'clothing') {
            useLabel = "Wear";
            action = "equip";
        } else if (item.type === 'weapon') {
            useLabel = "Equip";
        }

        if (item.slot >= 0 || item.slot < -50) { 
            addMenuOption(useLabel, () => {
                if (action === 'equip') mp.trigger('client:equipItem', item.slot);
                else mp.trigger('client:useItem', item.slot);
            });
            
            // --- NEW: Weapon Logic ---
            if (item.type === 'weapon') {
                // UNLOAD
                if (item.data && item.data.ammo > 0) {
                    addMenuOption("Unload Ammo", () => {
                        mp.trigger('server:unloadWeapon', item.slot);
                    });
                }
                
                // LOAD (Check if we have ammo)
                if (item.ammoItem) {
                    const hasAmmo = globalInventoryData.find(i => i.itemId === item.ammoItem);
                    if (hasAmmo) {
                        addMenuOption("Load Ammo", () => {
                             mp.trigger('server:loadWeapon', item.slot);
                        });
                    }
                }
            }
        }

        if (item.maxStack > 1 && item.count < item.maxStack) {
            addMenuOption("Stack", () => {
                mp.trigger('client:stackItem', item.slot);
            });
        }

        if (item.count > 1) {
            addMenuOption("Split", () => {
                currentSplitSlot = item.slot;
                document.getElementById('split-modal').style.display = 'flex';
                document.getElementById('split-amount').value = "";
                document.getElementById('split-amount').focus();
            });
        }

        addMenuOption("Drop", () => {
            mp.trigger('client:dropItem', item.slot);
        });

        contextMenu.style.left = e.pageX + 'px';
        contextMenu.style.top = e.pageY + 'px';
        contextMenu.style.display = 'flex';
    }

    function addMenuOption(label, callback) {
        const div = document.createElement('div');
        div.className = 'ctx-item';
        div.innerText = label;
        div.onclick = () => {
            callback();
            hideContextMenu();
        };
        contextMenu.appendChild(div);
    }

    function closeSplit() {
        document.getElementById('split-modal').style.display = 'none';
        currentSplitSlot = null;
    }

    function confirmSplit() {
        const amt = document.getElementById('split-amount').value;
        if (amt && currentSplitSlot !== null) {
            mp.trigger('client:splitItem', currentSplitSlot, amt);
        }
        closeSplit();
    }

    function handleDrop(e, targetSlot) {
        e.preventDefault();
        e.stopPropagation();
        if (draggedSlot === targetSlot) return;
        if ('mp' in window) {
            mp.trigger('gui:moveItem', draggedSlot, targetSlot);
        }
        draggedSlot = null;
    }

    function requestSort() {
        if ('mp' in window) {
            mp.trigger('client:reqSort');
        }
    }

    function requestStack() {
        if ('mp' in window) {
            mp.trigger('client:reqStack');
        }
    }

    function showNotification(title, message) {
        const container = document.getElementById('notif-stack');
        const card = document.createElement('div');
        card.className = 'notif-card';
        card.innerHTML = `<div class="notif-title">${title}</div><div class="notif-msg">${message}</div>`;
        container.appendChild(card);
        setTimeout(() => {
            card.style.opacity = '0';
            setTimeout(() => card.remove(), 500);
        }, 5000);
    }
    </script>
</body>
</html>
