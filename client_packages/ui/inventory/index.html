<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>

    /* ════════════════════════════════════════════════════════
       DESIGN TOKENS
       All values that define the visual language live here.
       ════════════════════════════════════════════════════════ */
    :root {
      /* ── Colors ── */
      --c-bg:             rgba(15, 15, 15, 0.96);
      --c-slot:           rgba(255, 255, 255, 0.05);
      --c-border:         rgba(255, 255, 255, 0.09);
      --c-border-hover:   rgba(255, 255, 255, 0.2);
      --c-accent:         #0084ff;
      --c-accent-dim:     rgba(0, 132, 255, 0.15);
      --c-accent-glow:    rgba(0, 132, 255, 0.45);
      --c-accent-soft:    rgba(0, 132, 255, 0.25);
      --c-text:           #ffffff;
      --c-text-dim:       #888888;
      --c-danger:         #ff4c4c;
      --c-warn:           #ff8c00;

      /* ── Sizing ── */
      --slot-size:        90px;

      /* ── Timing ── */
      --t-fast:           0.12s ease;
      --t-med:            0.2s  ease;
      --t-spring:         0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ════════════════════════════════════════════════════════
       RESET / GLOBALS
       ════════════════════════════════════════════════════════ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::-webkit-scrollbar           { width: 5px; background: transparent; }
    ::-webkit-scrollbar-track     { background: rgba(255, 255, 255, 0.04); border-radius: 3px; }
    ::-webkit-scrollbar-thumb     { background: var(--c-accent); border-radius: 3px; box-shadow: 0 0 6px var(--c-accent-glow); }

    body {
      background: rgba(0, 0, 0, 0.72);
      font-family: 'Segoe UI', sans-serif;
      color: var(--c-text);
      user-select: none;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* ════════════════════════════════════════════════════════
       LAYOUT — COLUMNS
       ════════════════════════════════════════════════════════ */
    .inventory-wrapper {
      display: flex;
      gap: 18px;
      width: 1400px;
      height: 700px;
    }

    .col {
      background: var(--c-bg);
      border-radius: 8px;
      border-top: 3px solid var(--c-accent);
      padding: 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), inset 0 0 0 1px var(--c-border);
    }
    .col-left  { width: 250px; flex-shrink: 0; }
    .col-mid   { flex-grow: 1; }
    .col-right { width: 380px; flex-shrink: 0; }

    h2 {
      font-size: 13px;
      text-transform: uppercase;
      color: var(--c-accent);
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    /* ════════════════════════════════════════════════════════
       HEADER ROW (inventory column)
       ════════════════════════════════════════════════════════ */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--c-border);
      margin-bottom: 14px;
      padding-bottom: 10px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* ════════════════════════════════════════════════════════
       SECTION TITLE (left & right columns)
       ════════════════════════════════════════════════════════ */
    .col-left h2,
    .col-right h2 {
      border-bottom: 1px solid var(--c-border);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    /* ════════════════════════════════════════════════════════
       SEARCH BAR
       ════════════════════════════════════════════════════════ */
    .search-container {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--c-border);
      border-radius: 5px;
      padding: 2px;
      transition: border-color var(--t-fast), box-shadow var(--t-fast);
    }
    .search-container:focus-within,
    .search-container--active {
      border-color: var(--c-accent);
      box-shadow: 0 0 12px var(--c-accent-soft);
    }

    .search-icon        { padding: 0 8px; color: var(--c-text-dim); }
    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--c-text);
      padding: 5px 0;
      width: 140px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.18); }

    .search-nav { display: flex; flex-direction: column; gap: 1px; padding-right: 2px; }
    .nav-btn {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #aaa;
      cursor: pointer;
      width: 16px;
      height: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 7px;
      border-radius: 2px;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .nav-btn:hover { background: var(--c-accent); color: #000; }

    /* ════════════════════════════════════════════════════════
       ACTION BUTTONS (Stack / Sort)
       ════════════════════════════════════════════════════════ */
    .btn-action {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--c-border);
      color: var(--c-text-dim);
      padding: 5px 11px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast);
    }
    .btn-action:hover {
      background: var(--c-accent);
      color: #000;
      border-color: var(--c-accent);
      box-shadow: 0 0 12px var(--c-accent-soft);
    }

    /* ════════════════════════════════════════════════════════
       INVENTORY GRID
       ════════════════════════════════════════════════════════ */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, var(--slot-size));
      grid-auto-rows: var(--slot-size);
      gap: 8px;
      overflow-y: auto;
      padding: 8px;
      justify-content: center;
      flex-grow: 1;
      min-height: 0;
    }

    /* ════════════════════════════════════════════════════════
       SLOT
       ════════════════════════════════════════════════════════ */
    .slot {
      width: var(--slot-size);
      height: var(--slot-size);
      background: var(--c-slot);
      border: 1px solid var(--c-border);
      border-radius: 5px;
      position: relative;
      cursor: pointer;
      transition:
        border-color   var(--t-fast),
        background     var(--t-fast),
        box-shadow     var(--t-fast),
        transform      var(--t-fast),
        opacity        var(--t-fast);
    }
    .slot:hover {
      border-color: var(--c-accent);
      background: var(--c-accent-dim);
    }

    /* Search states */
    .slot.dimmed {
      opacity: 0.18;
      filter: grayscale(0.6);
      pointer-events: none;
    }
    .slot.search-match {
      border-color: rgba(0, 132, 255, 0.55);
      box-shadow: inset 0 0 12px rgba(0, 132, 255, 0.12);
      opacity: 1 !important;
      filter: none !important;
    }
    .slot.search-focus {
      border: 2px solid var(--c-accent);
      box-shadow: 0 0 18px var(--c-accent-glow), inset 0 0 10px rgba(0, 132, 255, 0.1);
      transform: scale(1.04);
      z-index: 10;
    }

    /* ════════════════════════════════════════════════════════
       ITEM INSIDE SLOT
       ════════════════════════════════════════════════════════ */

    /* ── Rarity borders for car components ── */
    .item-img-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .rarity-border--common    { box-shadow: inset 0 0 0 2px #a0a0a0; }
    .rarity-border--uncommon  { box-shadow: inset 0 0 0 2px #2ecc71, 0 0 6px rgba(46,204,113,.35); }
    .rarity-border--rare      { box-shadow: inset 0 0 0 2px #3498db, 0 0 6px rgba(52,152,219,.40); }
    .rarity-border--epic      { box-shadow: inset 0 0 0 2px #9b59b6, 0 0 8px rgba(155,89,182,.50); }
    .rarity-border--legendary { box-shadow: inset 0 0 0 2px #f1c40f, 0 0 10px rgba(241,196,15,.55); }

    /* Rarity corner badge */
    .rarity-border--uncommon::after,
    .rarity-border--rare::after,
    .rarity-border--epic::after,
    .rarity-border--legendary::after {
      content: '';
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .rarity-border--uncommon::after  { background: #2ecc71; }
    .rarity-border--rare::after      { background: #3498db; }
    .rarity-border--epic::after      { background: #9b59b6; }
    .rarity-border--legendary::after { background: #f1c40f; box-shadow: 0 0 4px #f1c40f; }

    .item-img {
      width: 70%;
      height: 70%;
      position: absolute;
      top: 15%;
      left: 15%;
      object-fit: contain;
      pointer-events: none; /* drag is on the img element, not this */
    }
    .item-img[draggable="true"] { pointer-events: auto; }

    .item-count {
      position: absolute;
      bottom: 3px;
      right: 4px;
      font-size: 11px;
      color: #bbb;
      background: rgba(0,0,0,0.55);
      padding: 0 3px;
      border-radius: 2px;
      line-height: 1.4;
    }
    .item-count--ammo { color: var(--c-accent); }

    /* ════════════════════════════════════════════════════════
       EQUIPMENT PANEL (left column)
       ════════════════════════════════════════════════════════ */
    .equip-list { display: flex; flex-direction: column; gap: 10px; }

    .equip-slot {
      display: flex;
      align-items: center;
      background: var(--c-slot);
      padding: 10px 12px;
      border-radius: 5px;
      border: 1px solid var(--c-border);
      transition: border-color var(--t-fast);
    }
    .equip-slot:hover { border-color: var(--c-border-hover); }

    .equip-label {
      font-size: 11px;
      color: var(--c-text-dim);
      width: 55px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .equip-box {
      width: 44px;
      height: 44px;
      border: 1px dashed rgba(255,255,255,0.25);
      border-radius: 4px;
      margin-left: auto;
      position: relative;
      overflow: hidden;
      transition: border-color var(--t-fast), box-shadow var(--t-fast);
    }
    .equip-box:hover { border-color: var(--c-accent); box-shadow: 0 0 8px var(--c-accent-soft); }

    .equip-img {
      width: 100% !important;
      height: 100% !important;
      top: 0 !important;
      left: 0 !important;
    }

    /* ════════════════════════════════════════════════════════
       HOTBAR
       ════════════════════════════════════════════════════════ */
    .hotbar-container {
      margin-top: 12px;
      border-top: 1px solid var(--c-border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hotbar-label {
      font-size: 10px;
      color: var(--c-text-dim);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
    }
    .hotbar-grid { display: flex; gap: 8px; justify-content: center; }

    .hotbar-slot {
      width: var(--slot-size);
      height: var(--slot-size);
      background: rgba(0, 132, 255, 0.04);
      border: 1px solid var(--c-border);
      border-radius: 5px;
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: border-color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
    }
    .hotbar-slot:hover {
      border-color: var(--c-accent);
      background: var(--c-accent-dim);
    }

    .key-number {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 10px;
      color: var(--c-accent);
      font-weight: 700;
    }

    /* ════════════════════════════════════════════════════════
       WEIGHT BAR
       ════════════════════════════════════════════════════════ */
    .weight-container { margin-top: auto; padding-top: 14px; }

    .weight-text {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #ccc;
      margin-bottom: 6px;
    }

    .weight-bar-bg {
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .weight-bar-fill {
      height: 100%;
      background: var(--c-accent);
      box-shadow: 0 0 10px var(--c-accent-glow);
      border-radius: 3px;
      transition: width 0.4s ease, background 0.4s ease, box-shadow 0.4s ease;
    }
    .weight-bar-fill--heavy {
      background: var(--c-warn);
      box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
    }
    .weight-bar-fill--critical {
      background: var(--c-danger);
      box-shadow: 0 0 10px rgba(255, 76, 76, 0.5);
    }

    /* ════════════════════════════════════════════════════════
       CONTEXT MENU
       ════════════════════════════════════════════════════════ */
    #context-menu {
      position: fixed;
      background: rgba(18, 18, 18, 0.98);
      border: 1px solid var(--c-accent);
      border-radius: 5px;
      width: 155px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.9), 0 0 0 1px rgba(0,132,255,0.1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ctx-item {
      padding: 9px 14px;
      color: var(--c-text);
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background var(--t-fast), color var(--t-fast);
      white-space: nowrap;
    }
    .ctx-item:last-child { border-bottom: none; }
    .ctx-item:hover { background: var(--c-accent); color: #000; }

    /* Context menu Vue transition */
    .ctx-enter-active { animation: ctxIn 0.12s ease-out; }
    .ctx-leave-active { animation: ctxIn 0.1s ease-in reverse; }
    @keyframes ctxIn {
      from { opacity: 0; transform: scale(0.92) translateY(-5px); }
      to   { opacity: 1; transform: scale(1)    translateY(0);    }
    }

    /* ════════════════════════════════════════════════════════
       SPLIT MODAL
       ════════════════════════════════════════════════════════ */
    #split-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: rgba(18, 18, 18, 0.97);
      border-top: 3px solid var(--c-accent);
      padding: 22px;
      width: 290px;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.9);
    }

    .modal-title {
      color: var(--c-accent);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .modal-input {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--c-text);
      border-radius: 4px;
      outline: none;
      text-align: center;
      font-size: 20px;
      margin-bottom: 16px;
      transition: border-color var(--t-fast), box-shadow var(--t-fast);
    }
    .modal-input:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 10px var(--c-accent-soft);
    }

    .modal-actions { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: background var(--t-fast), transform var(--t-fast);
    }
    .btn:active { transform: scale(0.97); }
    .btn-confirm { background: var(--c-accent); color: #000; }
    .btn-confirm:hover { background: #3ba0ff; }
    .btn-cancel  { background: rgba(255,255,255,0.1); color: var(--c-text); }
    .btn-cancel:hover { background: rgba(255,255,255,0.18); }

    /* Modal Vue transition */
    .modal-enter-active { animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .modal-leave-active { animation: modalIn 0.15s ease reverse; }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1);    }
    }

    /* ════════════════════════════════════════════════════════
       NOTIFICATION STACK
       ════════════════════════════════════════════════════════ */
    #notif-stack {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      z-index: 3000;
      pointer-events: none;
    }

    .notif-inner {
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }

    .notif-card {
      background: rgba(10, 10, 10, 0.95);
      border-left: 3px solid var(--c-accent);
      color: var(--c-text);
      padding: 13px 16px;
      border-radius: 5px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.7), inset 0 0 0 1px var(--c-border);
    }
    .notif-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--c-accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .notif-msg { font-size: 13px; color: #ddd; }

    /* Notification Vue transition-group */
    .notif-enter-active {
      animation: notifIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .notif-leave-active {
      animation: notifIn 0.25s ease reverse;
      position: absolute;
      width: 100%;
    }
    .notif-move { transition: transform 0.3s ease; }
    @keyframes notifIn {
      from { opacity: 0; transform: translateY(16px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

  </style>
</head>
<body>

  <!-- Vue mounts here -->
  <div id="app"></div>

  <!--
    Loading order matters:
      1. Vue 3 global CDN  →  exposes window.Vue
      2. Component files   →  each adds a global const (InventorySlot, etc.)
      3. app.js            →  reads those globals, creates & mounts the app
  -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <script src="components/InventorySlot.js"></script>
  <script src="components/ContextMenu.js"></script>
  <script src="components/SplitModal.js"></script>
  <script src="components/NotifStack.js"></script>

  <script src="app.js"></script>

</body>
</html>
