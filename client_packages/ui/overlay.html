<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --bg-dark: rgba(10, 10, 10, 0.9);
            --bg-gradient: linear-gradient(135deg, rgba(20,20,20,0.95) 0%, rgba(10,10,10,0.9) 100%);
            --accent: #ffcc00;
            --text-main: #ffffff;
            --text-sub: #888888;
            --shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        body {
            background-color: transparent; 
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* --- TOP RIGHT HUD --- */
        .hud-container {
            position: fixed; top: 30px; right: 30px; 
            background: var(--bg-gradient);
            padding: 15px 25px; 
            border-radius: 6px; 
            border-right: 4px solid var(--accent); 
            box-shadow: var(--shadow);
            text-align: right;
            min-width: 200px;
            transition: opacity 0.3s ease;
        }

        .hud-username { 
            font-size: 14px; color: var(--accent); 
            font-weight: 800; text-transform: uppercase; letter-spacing: 1px; 
        }

        .hud-money { 
            font-size: 28px; font-weight: 700; color: white; 
            margin: 2px 0 8px 0; letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
        }
        .hud-money span { font-size: 18px; color: #4caf50; vertical-align: top; margin-right: 2px; }

        .hud-meta { 
            display: flex; justify-content: flex-end; gap: 10px; 
            font-size: 12px; font-weight: 600; color: var(--text-sub); 
        }
        .hud-date { background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 4px; }

        /* --- SPEEDOMETER --- */
        .speedo-container {
            position: fixed; bottom: 30px; right: 30px; width: 220px;
            background: var(--bg-gradient); color: white; 
            padding: 20px; border-radius: 6px; 
            border-bottom: 4px solid var(--accent);
            box-shadow: var(--shadow);
            display: none; transition: opacity 0.3s;
        }

        .speed-main { 
            display: flex; align-items: baseline; justify-content: flex-end; 
            margin-bottom: 5px;
        }
        .speed-val { font-size: 48px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
        .speed-unit { font-size: 14px; color: var(--accent); font-weight: 800; margin-left: 5px; }

        .speed-info { 
            display: flex; justify-content: space-between; 
            background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 4px;
            font-size: 12px; font-weight: 700; color: #ccc;
        }
        .locked { color: #ff4444; } .unlocked { color: #44ff44; } .fuel-low { color: #ffaa00; }

        /* --- NOTIFICATIONS --- */
        #notif-stack {
            position: fixed; bottom: 250px; left: 30px; width: 320px;
            display: flex; flex-direction: column-reverse; pointer-events: none;
        }
        .notif-card {
            background: rgba(15, 15, 15, 0.95); 
            border-left: 4px solid var(--accent);
            padding: 15px; margin-top: 10px; border-radius: 0 4px 4px 0;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            animation: notifSlide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative; overflow: hidden;
        }
        /* Subtle shine effect */
        .notif-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            transform: skewX(-20deg); pointer-events: none;
        }
        
        .notif-title { font-size: 13px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
        .notif-msg { font-size: 13px; color: #ddd; line-height: 1.4; }

        @keyframes notifSlide { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }

        /* --- JOB HUD --- */
        .job-hud {
            position: fixed; top: 40%; right: 30px; width: 260px;
            background: var(--bg-gradient);
            border-right: 4px solid var(--accent); 
            padding: 20px; border-radius: 6px; box-shadow: var(--shadow);
            display: none; text-align: right;
        }
        .job-label { font-size: 11px; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .job-instruction { font-size: 16px; font-weight: 700; color: white; margin: 5px 0 15px 0; line-height: 1.3; }
        
        .job-progress-bg { background: rgba(255,255,255,0.1); height: 6px; width: 100%; border-radius: 3px; overflow: hidden; }
        .job-progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s; box-shadow: 0 0 10px var(--accent); }
        .job-counter { margin-top: 6px; font-size: 12px; color: #aaa; font-weight: 600; }

        /* --- INTERACTION PROMPT --- */
        .interaction-box {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.9); padding: 12px 25px;
            border-radius: 50px; display: none; align-items: center;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .key-circle { 
            width: 28px; height: 28px; background: var(--accent); color: black; 
            border-radius: 50%; font-weight: 800; font-size: 14px; 
            display: flex; align-items: center; justify-content: center; margin-right: 15px; 
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }
        .inter-text { font-size: 14px; font-weight: 600; color: white; text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- HOTBAR --- */
        .pop-hotbar {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; background: rgba(0,0,0,0.8); padding: 8px 15px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
            opacity: 0; transition: opacity 0.3s;
        }
        .pop-slot { 
            width: 40px; height: 40px; background: rgba(255,255,255,0.05); 
            border-radius: 6px; display: flex; justify-content: center; align-items: center; position: relative;
            border: 1px solid transparent; transition: 0.2s;
        }
        .pop-slot.active { border-color: var(--accent); background: rgba(255, 204, 0, 0.1); transform: scale(1.1); }
        .pop-img { width: 28px; height: 28px; object-fit: contain; }
        .pop-key { position: absolute; top: -8px; right: -5px; background: var(--accent); color: black; font-size: 9px; font-weight: bold; padding: 1px 4px; border-radius: 4px; }

        /* --- ZONES --- */
        .zone-status {
            position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
            padding: 8px 20px; background: rgba(0,0,0,0.85); border-radius: 50px;
            display: none; animation: slideDown 0.3s forwards;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .zone-status.safe { border-bottom: 2px solid #4caf50; }
        .zone-status.noclip { border-bottom: 2px solid #2196f3; }
        .zone-text { font-size: 12px; font-weight: 800; letter-spacing: 1px; color: white; }

        @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="hud-container" id="hud-container">
        <div class="hud-username" id="hud-name">PLAYER</div>
        <div class="hud-money"><span>$</span><span id="hud-cash">0</span></div>
        <div class="hud-meta">
            <div class="hud-date" id="hud-date">00:00 | JAN 01</div>
        </div>
    </div>

    <div class="speedo-container" id="speedo">
        <div class="speed-main">
            <div class="speed-val" id="speed">0</div>
            <div class="speed-unit">KM/H</div>
        </div>
        <div class="speed-info">
            <span>FUEL <span id="fuel">100%</span></span>
            <span id="lock">OPEN</span>
        </div>
    </div>

    <div id="notif-stack"></div>

    <div id="zone-status" class="zone-status">
        <div class="zone-text" id="zone-label">ZONE ACTIVE</div>
    </div>

    <div class="interaction-box" id="interaction">
        <div class="key-circle">E</div>
        <div class="inter-text" id="inter-text">INTERACT</div>
    </div>

    <div class="job-hud" id="job-hud">
        <div class="job-label">CURRENT OBJECTIVE</div>
        <div class="job-instruction" id="job-text">Wait for instructions...</div>
        <div class="job-label">PROGRESS</div>
        <div class="job-progress-bg"><div class="job-progress-fill" id="job-bar"></div></div>
        <div class="job-counter" id="job-count">0 / 0</div>
    </div>

    <div class="pop-hotbar" id="pop-hotbar"></div>

    <script>
        // --- 1. HUD & SPEEDO ---
        function updateInfoHud(name, money, dateStr) {
            document.getElementById('hud-name').innerText = name;
            document.getElementById('hud-cash').innerText = new Intl.NumberFormat().format(money);
            document.getElementById('hud-date').innerText = dateStr;
        }

        function updateSpeedo(speed, fuel, isLocked) {
            const hudEl = document.getElementById('hud-container');
            if (hudEl && hudEl.style.opacity === '0') return;

            document.getElementById('speedo').style.display = 'block';
            document.getElementById('speed').innerText = Math.floor(speed);
            
            const f = document.getElementById('fuel');
            f.innerText = Math.floor(fuel) + '%';
            f.className = fuel < 20 ? 'fuel-low' : '';

            const l = document.getElementById('lock');
            l.innerText = isLocked ? "LOCKED" : "OPEN";
            l.className = isLocked ? "locked" : "unlocked";
        }

        function hideSpeedo() { 
            document.getElementById('speedo').style.display = 'none'; 
        }

        // --- 2. NOTIFICATIONS ---
        function showNotification(title, message) {
            const container = document.getElementById('notif-stack');
            const card = document.createElement('div');
            card.className = 'notif-card';
            card.innerHTML = `<div class="notif-title">${title}</div><div class="notif-msg">${message}</div>`;
            container.appendChild(card);
            
            // Auto Remove
            setTimeout(() => {
                card.style.opacity = '0';
                card.style.transform = 'translateX(-20px)';
                setTimeout(() => card.remove(), 400);
            }, 5000);
        }

        // --- 3. INTERACTION ---
        function setInteraction(visible, title, text) {
            const box = document.getElementById('interaction');
            if (visible) {
                // We combine title and text nicely: "TITLE: Text" or just "Text"
                const fullText = title ? `${title}: ${text}` : text;
                document.getElementById('inter-text').innerText = fullText;
                box.style.display = 'flex';
            } else {
                box.style.display = 'none';
            }
        }

        // --- 4. JOB HUD ---
        function updateJobUI(visible, text, current, max) {
            const hud = document.getElementById('job-hud');
            if (!visible) {
                hud.style.display = 'none';
                return;
            }
            hud.style.display = 'block';
            document.getElementById('job-text').innerText = text;
            const pct = max > 0 ? (current / max) * 100 : 0;
            document.getElementById('job-bar').style.width = pct + '%';
            document.getElementById('job-count').innerText = `${current} / ${max}`;
        }

        // --- 5. VISIBILITY TOGGLE ---
        function setGameHUD(visible) {
            const ids = ['hud-container', 'speedo', 'job-hud', 'interaction'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.style.opacity = visible ? '1' : '0';
                    el.style.pointerEvents = visible ? 'auto' : 'none';
                }
            });
        }

        // --- 6. HOTBAR ---
        let hotbarTimer = null;
        function updateHotbar(itemsJson) {
            const items = JSON.parse(itemsJson); 
            const container = document.getElementById('pop-hotbar');
            container.innerHTML = '';
            for(let i=0; i<5; i++) {
                const realSlot = -51 - i; 
                const item = items.find(x => x.slot === realSlot);
                let html = `<span class="pop-key">${i+1}</span>`;
                if(item) html += `<img src="items/${item.icon || item.itemId + '.png'}" class="pop-img" onerror="this.src='items/default.png'">`;
                
                let div = document.createElement('div');
                div.className = 'pop-slot';
                div.id = `pop-slot-${i}`;
                div.innerHTML = html;
                container.appendChild(div);
            }
        }
        function showHotbar(activeIndex) {
            const bar = document.getElementById('pop-hotbar');
            for(let i=0; i<5; i++) {
                const el = document.getElementById(`pop-slot-${i}`);
                if(el) el.classList.remove('active');
            }
            if(activeIndex !== undefined && activeIndex !== null) {
                const activeEl = document.getElementById(`pop-slot-${activeIndex}`);
                if(activeEl) activeEl.classList.add('active');
            }
            bar.style.opacity = '1';
            if(hotbarTimer) clearTimeout(hotbarTimer);
            hotbarTimer = setTimeout(() => { bar.style.opacity = '0'; }, 3000);
        }

        // --- 7. ZONES ---
        function updateZoneStatus(visible, type) {
            const el = document.getElementById('zone-status');
            const label = document.getElementById('zone-label');
            if (!visible) { el.style.display = 'none'; return; }

            el.style.display = 'block';
            el.className = 'zone-status'; 
            if (type === 'safe_zone') {
                el.classList.add('safe');
                label.innerText = "SAFE ZONE";
            } else if (type === 'no_collision') {
                el.classList.add('noclip');
                label.innerText = "NO COLLISION";
            }
        }
    </script>
</body>
</html>
