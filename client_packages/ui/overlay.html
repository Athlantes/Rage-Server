<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Central Online Blue HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00a8ff; 
            --danger: #ff4757;
            --success: #2ecc71;
            --food-color: #e67e22; /* Orange */
            --water-color: #00a8ff; /* Blue */
        }

        body {
            background: transparent !important;
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            user-select: none;
            width: 100vw; height: 100vh;
        }

        /* --- STATUS CONTAINER (Mic + Hunger + Thirst) --- */
        .status-container {
            position: fixed; 
            bottom: 40px; 
            left: 330px; 
            display: flex;
            align-items: center;
            gap: 15px; /* Spacing between circles */
            transition: opacity 0.3s ease;
        }

        /* --- MIC STATUS --- */
        .mic-status {
            color: rgba(255, 255, 255, 0.4); 
            font-size: 20px;
            background: rgba(0, 0, 0, 0.3);
            width: 35px; height: 35px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s ease-in-out;
        }

        .mic-status.active {
            color: #fff;
            background: var(--success); 
            box-shadow: 0 0 10px var(--success);
            transform: scale(1.1);
        }

        /* --- HUD CIRCLES (Food & Water) --- */
        .hud-circle {
            width: 35px; height: 35px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        
        .hud-circle i {
            font-size: 14px;
            z-index: 2;
        }
        
        /* SVG Rings */
        .progress-ring {
            position: absolute;
            top: 0; left: 0;
            transform: rotate(-90deg);
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform-origin: 50% 50%;
        }

        /* Food Specifics */
        .food i { color: #fff; }
        .food .progress-ring__circle { stroke: var(--food-color); }

        /* Water Specifics */
        .water i { color: #fff; }
        .water .progress-ring__circle { stroke: var(--water-color); }

        /* --- PAYDAY BOX (MOVED ABOVE CIRCLES) --- */
        .payday-box {
            position: fixed;   
            bottom: 90px;      /* Raised up to sit above status circles */
            left: 330px;       /* Aligned with Left side */
            
            background: rgba(0, 0, 0, 0);
            padding: 5px 0px; 
            text-align: left;
            border-left: 3px solid var(--primary);
            padding-left: 10px;
            font-family: 'Poppins', sans-serif; 
            color: white;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
        
        .payday-title {
            font-size: 10px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
            letter-spacing: 1px;
            line-height: 1;
        }

        #payday-timer {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            line-height: 1.1;
        }

        /* --- HUD CONTAINER (TOP RIGHT) --- */
        .hud-container {
            position: fixed; top: 30px; right: 35px;
            display: flex; flex-direction: column; 
            align-items: flex-end; gap: 2px;
        }

        .hud-top-row {
            display: flex; flex-direction: row;
            align-items: center; gap: 15px;
        }

        .hud-money-col {
            display: flex; flex-direction: column; text-align: right;
            padding-top: 5px; 
        }

        .server-logo {
            width: 90px; height: auto; object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .hud-row-money {
            display: flex; align-items: center; justify-content: flex-end;
            line-height: 1;
        }

        .money-val { font-size: 32px; font-weight: 700; color: #fff; letter-spacing: -1px; }
        .money-sym { color: var(--success); font-size: 22px; margin-right: 2px; font-weight: 800; }
        .bank-val { font-size: 22px; font-weight: 600; color: #dcdcdc; letter-spacing: -0.5px; }
        .bank-sym { color: var(--primary); font-size: 18px; margin-right: 4px; }

        .meta-row {
            font-size: 12px; font-weight: 700; color: #eee;
            text-transform: uppercase; letter-spacing: 1px;
            opacity: 0.9; text-align: right; margin-top: 0px; 
            white-space: nowrap; 
        }
        .meta-sep { color: var(--primary); margin: 0 6px; }
        .id-val { color: var(--primary); }

        /* --- WEAPON HUD --- */
        .weapon-hud {
            position: fixed; top: 130px; right: 35px;
            text-align: right; 
            display: flex; /* Changed from none to flex */
            flex-direction: column; align-items: flex-end;
            opacity: 0; /* Start hidden */
            transition: opacity 0.3s ease-in-out; /* Add the fade animation */
        }
        .weapon-name {
            font-size: 14px; font-weight: 800; color: var(--primary);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .weapon-ammo-box {
            display: flex; align-items: baseline; gap: 5px;
            color: white; font-weight: 700;
        }
        .ammo-clip { font-size: 28px; line-height: 1; }
        .ammo-clip.low { color: var(--danger); animation: pulse 1s infinite; }
        .ammo-sep { font-size: 18px; color: #888; }
        .ammo-total { font-size: 18px; color: #ccc; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- SPEEDOMETER --- */
        .speedo-container {
            position: fixed; bottom: 35px; right: 35px;
            text-align: right; display: none; 
            flex-direction: column; align-items: flex-end;
        }
        .speed-val {
            font-size: 90px; font-weight: 900; color: white;
            line-height: 0.8; font-style: italic;
        }
        .speed-unit {
            font-size: 16px; font-weight: 800; color: var(--primary);
            letter-spacing: 2px; margin-right: 5px; margin-bottom: 5px;
        }
        .fuel-track {
            width: 180px; height: 6px; background: rgba(255, 255, 255, 0.2);
            border-radius: 3px; margin-top: 5px; position: relative;
        }
        .fuel-fill {
            height: 100%; background: #fff; width: 100%;
            border-radius: 3px; box-shadow: 0 0 10px rgba(255,255,255,0.8);
            transition: width 0.3s;
        }
        .fuel-fill.low { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .fuel-fill.crit { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        .car-status {
            display: flex; gap: 15px; margin-top: 5px;
            font-size: 12px; font-weight: 800; color: white;
        }
        .lock-icon.locked { color: var(--danger); }
        .lock-icon.open { color: var(--success); }

        /* --- JOB HUD --- */
        .job-hud {
            position: fixed; top: 35%; right: 35px; width: 300px;
            display: none; text-align: right;
        }
        .job-label {
            font-size: 11px; font-weight: 800; color: var(--primary);
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 2px;
        }
        .job-text {
            font-size: 15px; font-weight: 700; color: white;
            line-height: 1.3; margin-bottom: 10px;
        }
        .job-details {
            display: flex; justify-content: flex-end; gap: 20px; margin-bottom: 8px;
        }
        .jd-item { display: flex; flex-direction: column; align-items: flex-end; }
        .jd-lbl { font-size: 9px; color: #ccc; font-weight: 700; text-transform: uppercase; }
        .jd-val { font-size: 14px; color: white; font-weight: 700; }
        .jd-val.green { color: var(--success); }
        .job-prog-track {
            width: 100%; height: 4px; background: rgba(255,255,255,0.2);
            border-radius: 2px; margin-top: 5px;
        }
        .job-prog-fill {
            height: 100%; background: var(--primary); width: 0%;
            box-shadow: 0 0 10px var(--primary); transition: width 0.3s;
        }
        .job-count { font-size: 10px; color: #ddd; font-weight: 700; margin-top: 3px; }

        /* --- NOTIFICATIONS --- */
        #notif-stack {
            position: fixed; bottom: 250px; left: 30px; width: 300px;
            display: flex; flex-direction: column-reverse; pointer-events: none;
        }
        .notif-card {
            background: rgba(0, 0, 0, 0.4); 
            border-left: 3px solid var(--primary);
            padding: 10px 15px; margin-top: 10px; border-radius: 4px;
            animation: slideIn 0.3s ease-out;
        }
        .notif-title { font-size: 12px; font-weight: 800; color: var(--primary); text-transform: uppercase; margin-bottom: 2px; }
        .notif-msg { font-size: 13px; color: white; font-weight: 500; line-height: 1.3; }
        @keyframes slideIn { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }

        /* --- INTERACTION --- */
        .inter-box {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
            display: none; align-items: center; gap: 10px;
        }
        .inter-key {
            width: 30px; height: 30px; background: white; color: #000;
            border-radius: 50%; font-weight: 800; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .inter-lbl {
            font-size: 14px; font-weight: 800; color: white;
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- HOTBAR --- */
        .hotbar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; opacity: 0; transition: opacity 0.3s;
        }
        .hb-slot {
            width: 45px; height: 45px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        .hb-slot.active { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 0 15px rgba(0, 168, 255, 0.4); }
        .hb-img { width: 32px; height: 32px; object-fit: contain; }
        .hb-idx { position: absolute; top: 2px; right: 4px; font-size: 9px; color: #fff; font-weight: bold; }

        /* --- ZONES --- */
        .zone-text {
            position: fixed; top: 120px; left: 50%; transform: translateX(-50%);
            font-size: 14px; font-weight: 900; color: white; letter-spacing: 2px;
            text-transform: uppercase; display: none;
        }
        .zone-text.safe { color: var(--success); }
        .zone-text.noclip { color: var(--primary); }

        /* --- COOLDOWN CONTAINER --- */
        .cooldown-container {
            position: fixed;
            top: 220px;
            right: 35px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            pointer-events: none;
        }

        .cd-item {
            display: flex;
            align-items: baseline;  /* Aligns text by their base line */
            justify-content: flex-end;
            gap: 6px;               /* Space between items */
            
            background: none;
            border: none;
            padding: 2px 0;
            
            animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* TIMER (18px) */
        .cd-timer {
            font-family: 'Poppins', sans-serif;
            font-variant-numeric: tabular-nums;
            font-size: 14px;       
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        /* DOT (18px) - Matches Timer */
        .cd-sep {
            color: var(--primary);
            font-size: 14px;        /* Increased to match timer */
            opacity: 1;             /* Full opacity for visibility */
            margin: 0 1px;
            line-height: 1;
        }

        /* NAME (18px) - Matches Timer */
        .cd-name {
            font-size: 14px;        /* Increased to match timer */
            font-weight: 700;
            color: #ddd;            /* Slightly off-white to distinguish from timer */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        /* ICON (Adjusted to fit new size) */
        .cd-icon {
            font-size: 14px;        /* Slightly smaller than text looks better for icons */
            color: var(--primary); 
            width: 20px;
            text-align: center;
            transform: translateY(-1px); /* Micro-adjustment to center visually */
        }

        /* --- CENTER POPUP --- */
        .center-popup {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            min-width: 320px;
            max-width: 420px;
            padding: 22px 28px 18px;
            text-align: center;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .center-popup.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        .center-popup .popup-accent {
            width: 40px; height: 3px;
            background: var(--primary);
            margin: 0 auto 14px;
        }
        .center-popup .popup-title {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 4px;
        }
        .center-popup .popup-subtitle {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .center-popup .popup-rewards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .center-popup .popup-reward {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
        }
        .center-popup .popup-reward i {
            font-size: 14px;
        }
        .center-popup .popup-reward .reward-val {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }
        .center-popup .popup-reward.money i { color: var(--success); }
        .center-popup .popup-reward.money .reward-val { color: var(--success); }
        .center-popup .popup-reward.xp i { color: var(--primary); }
        .center-popup .popup-reward.xp .reward-val { color: var(--primary); }
        .center-popup .popup-reward.levelup i { color: #f0c400; }
        .center-popup .popup-reward.levelup .reward-val { color: #f0c400; }
        .center-popup .popup-reward.generic i { color: #ccc; }
        .center-popup .popup-reward.generic .reward-val { color: #ccc; }

        .center-popup .popup-progress {
            margin-top: 14px;
            width: 100%; height: 3px;
            overflow: hidden;
        }
        .center-popup .popup-progress .popup-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width linear;
        }

        /* ── DISPATCH FARE HUD ── */
        .fare-hud {
            position: fixed;
            bottom: 90px;
            left: 330px;
            display: none;
            flex-direction: column;
            gap: 2px;
            border-left: 3px solid #ffc300;
            padding-left: 10px;
            animation: fareIn 0.35s ease-out;
        }

        @keyframes fareIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .fare-hud.visible {
            display: flex;
        }

        .fare-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffc300;
            opacity: 0.85;
            line-height: 1;
        }

        .fare-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .fare-meta {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            line-height: 1;
        }

        .fare-dist {
            font-size: 11px;
            font-weight: 700;
            color: #ffc300;
            margin-top: 1px;
        }

    </style>
</head>
<body>

    <div class="hud-container" id="hud-container">
        <div class="hud-top-row">
            <div class="hud-money-col">
                <div class="hud-row-money">
                    <span class="money-sym">$</span><span class="money-val" id="hud-cash">0</span>
                </div>
                <div class="hud-row-money">
                    <span class="bank-sym">$</span><span class="bank-val" id="hud-bank-val">0</span>
                </div>
            </div>
            
            <img src="items/server_logo.png" class="server-logo" alt="Server Logo">
        </div>

        <div class="meta-row">
            <span class="id-val">ID: <span id="hud-id">0</span></span>
            <span class="meta-sep">|</span>
            <span id="hud-name">PLAYER</span>
            <span class="meta-sep">|</span>
            <span id="hud-date">00:00</span>
        </div>
    </div>
    
    <div class="weapon-hud" id="weapon-hud">
        <div class="weapon-name" id="weapon-name">PISTOL</div>
        <div class="weapon-ammo-box">
            <span class="ammo-clip" id="weapon-clip">0</span>
            <span class="ammo-sep">/</span>
            <span class="ammo-total" id="weapon-total">0</span>
        </div>
    </div>

    <div class="cooldown-container" id="cooldown-stack">
    </div>

    <div class="status-container">
        <div class="mic-status" id="mic-icon">
            <i class="fas fa-microphone"></i>
        </div>

        <div class="hud-circle food">
            <svg class="progress-ring" width="35" height="35">
                <circle class="progress-ring__circle" stroke="white" stroke-width="2" fill="transparent" r="16" cx="17.5" cy="17.5"/>
            </svg>
            <i class="fas fa-hamburger"></i>
        </div>

        <div class="hud-circle water">
            <svg class="progress-ring" width="35" height="35">
                <circle class="progress-ring__circle" stroke="white" stroke-width="2" fill="transparent" r="16" cx="17.5" cy="17.5"/>
            </svg>
            <i class="fas fa-tint"></i>
        </div>
    </div>

    <div class="payday-box">
        <div class="payday-title">PAYDAY IN</div>
        <div id="payday-timer"></div>
    </div>

    <!-- DISPATCH FARE HUD — shown after driver accepts a call -->
    <div class="fare-hud" id="fare-hud">
        <div class="fare-label"><i class="fas fa-taxi" style="margin-right:4px;"></i>Active Fare</div>
        <div class="fare-name" id="fare-name">—</div>
        <div class="fare-meta" id="fare-location">—</div>
        <div class="fare-dist" id="fare-dist">—</div>
    </div>

    <div class="speedo-container" id="speedo">
        <div class="speed-val" id="speed">0</div>
        <div class="speed-unit">KM/H</div>
        <div class="fuel-track"><div class="fuel-fill" id="fuel-fill"></div></div>
        <div class="car-status">
            <span id="fuel-text">100%</span>
            <span id="lock-icon" class="lock-icon locked"><i class="fas fa-lock"></i> LOCKED</span>
        </div>
    </div>

    <div class="job-hud" id="job-hud">
        <div class="job-label">Objective</div>
        <div class="job-text" id="job-text">Wait...</div>
        <div class="job-details">
            <div class="jd-item"><span class="jd-lbl">Dist</span><span class="jd-val" id="job-dist">0m</span></div>
            <div class="jd-item"><span class="jd-lbl">Earned</span><span class="jd-val green" id="job-cash">$0</span></div>
        </div>
        <div class="job-prog-track"><div class="job-prog-fill" id="job-bar"></div></div>
        <div class="job-count" id="job-count">0 / 0</div>
    </div>

    <div id="notif-stack"></div>
    <div class="inter-box" id="interaction"><div class="inter-key">E</div><div class="inter-lbl" id="inter-text">INTERACT</div></div>
    <div class="hotbar" id="pop-hotbar"></div>
    <div class="zone-text" id="zone-status"><span id="zone-label">ZONE</span></div>

    <div class="center-popup" id="center-popup">
        <div class="popup-accent"></div>
        <div class="popup-title" id="popup-title"></div>
        <div class="popup-subtitle" id="popup-subtitle"></div>
        <div class="popup-rewards" id="popup-rewards"></div>
        <div class="popup-progress"><div class="popup-progress-fill" id="popup-progress-fill"></div></div>
    </div>

    <script>
        // --- COOLDOWN SYSTEM ---
        let activeCooldowns = {}; // Stores end timestamps
        let cooldownInterval = null;

        // Map internal keys to Display Name & Icon
        const COOLDOWN_CONFIG = {
            'dumpster': { label: 'Dumpster', icon: 'fas fa-trash' },

            // ── RoS Wanted ───────────────────────────────────────────────────
            'speeding':           { label: 'Speeding',           icon: 'fas fa-gauge-high',    color: '#ffc300' },
            'reckless_driving':   { label: 'Reckless Driving',   icon: 'fas fa-car-burst',     color: '#ffc300' },
            'trespassing':        { label: 'Trespassing',        icon: 'fas fa-person-shelter', color: '#ffc300' },
            'petty_theft':        { label: 'Petty Theft',        icon: 'fas fa-hand',           color: '#ffc300' },
            'minor_possession':   { label: 'Drug Possession',    icon: 'fas fa-capsules',       color: '#ffc300' },
            'public_disturbance': { label: 'Public Disturbance', icon: 'fas fa-bullhorn',       color: '#ffc300' },

            // ── NoS Wanted ───────────────────────────────────────────────────
            'armed_robbery':      { label: 'Armed Robbery',      icon: 'fas fa-gun',            color: '#ff4757' },
            'assault':            { label: 'Assault',            icon: 'fas fa-hand-fist',      color: '#ff4757' },
            'murder':             { label: 'Murder',             icon: 'fas fa-skull',          color: '#ff4757' },
            'fleeing_officer':    { label: 'Fleeing Officer',    icon: 'fas fa-person-running', color: '#ff4757' },
            'drug_trafficking':   { label: 'Drug Trafficking',   icon: 'fas fa-syringe',        color: '#ff4757' },
            'vehicle_theft':      { label: 'Vehicle Theft',      icon: 'fas fa-car-on',         color: '#ff4757' },
        };

        function updateCooldowns(json) {
            try {
                activeCooldowns = JSON.parse(json);
                renderCooldowns();
                
                // Start active timer if not running
                if (!cooldownInterval) {
                    cooldownInterval = setInterval(renderCooldowns, 1000);
                }
            } catch (e) {
                console.error("CD Error", e);
            }
        }

        function renderCooldowns() {
            const container = document.getElementById('cooldown-stack');
            if (!container) return;

            const now = Date.now();
            let hasActive = false;
            let html = '';

            for (const [key, expiry] of Object.entries(activeCooldowns)) {
                if (expiry > now) {
                    hasActive = true;
                    const diff = expiry - now;
                    
                    // Format Time mm:ss
                    const totalSeconds = Math.floor(diff / 1000);
                    const m = Math.floor(totalSeconds / 60);
                    const s = totalSeconds % 60;
                    const timeStr = `${m}:${s.toString().padStart(2, '0')}`;

                    // Get Config
                    const conf = COOLDOWN_CONFIG[key] || { label: key, icon: 'fas fa-clock' };
                    const nameColor = conf.color ? `color:${conf.color}` : '';
                    const iconColor = conf.color ? `style="color:${conf.color}"` : '';

                    html += `
                        <div class="cd-item">
                            <span class="cd-name" style="${nameColor}">${conf.label}</span>
                            <span class="cd-sep">&bull;</span>
                            <span class="cd-timer">${timeStr}</span>
                            <i class="cd-icon ${conf.icon}" ${iconColor}></i>
                        </div>
                    `;
                }
            }

            container.innerHTML = html;

            // Stop timer if no cooldowns left
            if (!hasActive && cooldownInterval) {
                clearInterval(cooldownInterval);
                cooldownInterval = null;
            }
        }

        // --- CIRCLE SYSTEM ---
        const radius = 16;
        const circumference = radius * 2 * Math.PI;
        
        // Initialize circles
        document.querySelectorAll('.progress-ring__circle').forEach(circle => {
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = 0;
        });

        function setCircleProgress(type, percent) {
            const circle = document.querySelector(`.hud-circle.${type} .progress-ring__circle`);
            if(circle) {
                // percent is 0-100. 100 means full bar (offset 0), 0 means empty (offset = circumference)
                // If we want "filled" to mean "healthy" (100%), then 100% = 0 offset.
                const offset = circumference - (percent / 100) * circumference;
                circle.style.strokeDashoffset = offset;

                // Optional: Fade circle opacity slightly when full to look cleaner
                const parent = circle.parentElement.parentElement;
                if(percent >= 98) parent.style.opacity = '0.7';
                else parent.style.opacity = '1';
            }
        }

        function toggleMic(isActive) {
            const el = document.getElementById('mic-icon');
            if (isActive) el.classList.add('active');
            else el.classList.remove('active');
        }
        
        // Updated to accept hunger/thirst
        function updateInfoHud(id, name, money, bank, dateStr, hunger, thirst) {
            document.getElementById('hud-id').innerText = id;
            document.getElementById('hud-name').innerText = name;
            document.getElementById('hud-cash').innerText = new Intl.NumberFormat().format(money);
            document.getElementById('hud-bank-val').innerText = new Intl.NumberFormat().format(bank);
            document.getElementById('hud-date').innerText = dateStr;

            // Update Circles
            setCircleProgress('food', hunger !== undefined ? hunger : 100);
            setCircleProgress('water', thirst !== undefined ? thirst : 100);
        }

        // --- UPDATED PAYDAY TIMER ---
        function updatePaydayTimer(minutesLeft) {
            // Ensure minutesLeft is a valid number
            const val = (minutesLeft !== undefined && minutesLeft !== null) ? minutesLeft : 60;
            const display = (val <= 0) ? "NOW" : val + " MIN";
            
            const el = document.getElementById('payday-timer');
            if(el) {
                el.innerText = display;
                if(val <= 5 && val > 0) el.style.color = "#e74c3c"; 
                else if(val <= 0) el.style.color = "#2ecc71";
                else el.style.color = "#ffffff";
            }
        }

        function updateWeaponStats(visible, name, clip, total) {
            const el = document.getElementById('weapon-hud');
            
            if (!visible) { 
                el.style.opacity = '0'; // Fade out
                return; 
            }
            
            el.style.opacity = '1'; // Fade in
            document.getElementById('weapon-name').innerText = name;
            
            const clipEl = document.getElementById('weapon-clip');
            clipEl.innerText = clip;
            if(clip <= 3 && clip >= 0) clipEl.classList.add('low');
            else clipEl.classList.remove('low');
            
            document.getElementById('weapon-total').innerText = total;
        }

        function updateSpeedo(speed, fuel, isLocked) {
            document.getElementById('speedo').style.display = 'flex';
            document.getElementById('speed').innerText = Math.floor(speed);
            const fVal = Math.floor(fuel);
            const bar = document.getElementById('fuel-fill');
            bar.style.width = fVal + '%';
            bar.className = 'fuel-fill'; 
            if(fVal < 20) bar.classList.add('crit');
            else if(fVal < 40) bar.classList.add('low');
            document.getElementById('fuel-text').innerText = fVal + '%';
            const lIcon = document.getElementById('lock-icon');
            if(isLocked) {
                lIcon.innerHTML = '<i class="fas fa-lock"></i> LOCKED';
                lIcon.className = 'lock-icon locked';
            } else {
                lIcon.innerHTML = '<i class="fas fa-lock-open"></i> OPEN';
                lIcon.className = 'lock-icon open';
            }
        }

        function hideSpeedo() { document.getElementById('speedo').style.display = 'none'; }

        function updateJobUI(visible, text, current, max, earned = 0, dist = 0) {
            const hud = document.getElementById('job-hud');
            if(!hud) return;
            if (!visible) { hud.style.display = 'none'; return; }
            hud.style.display = 'block';
            document.getElementById('job-text').innerText = text || "Loading...";
            document.getElementById('job-cash').innerText = '$' + new Intl.NumberFormat().format(earned || 0);
            let distStr = (dist >= 1000) ? (dist / 1000).toFixed(2) + " km" : Math.floor(dist) + " m";
            document.getElementById('job-dist').innerText = distStr;
            const pct = max > 0 ? (current / max) * 100 : 0;
            document.getElementById('job-bar').style.width = pct + '%';
            document.getElementById('job-count').innerText = `${current} / ${max}`;
        }

        function updateDistance(dist) {
            const el = document.getElementById('job-dist');
            if (el) {
                let distStr = (dist >= 1000) ? (dist / 1000).toFixed(2) + " km" : Math.floor(dist) + " m";
                el.innerText = distStr;
            }
        }

        function showNotification(title, message) {
            const stack = document.getElementById('notif-stack');
            const el = document.createElement('div');
            el.className = 'notif-card';
            el.innerHTML = `<div class="notif-title">${title}</div><div class="notif-msg">${message}</div>`;
            stack.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, 5000);
        }

        // Parse GTA-style color codes: ~b~, ~r~, ~g~, ~w~, ~y~, ~p~, ~o~
        // Also supports hex: ~#FF5500~
        function parseColorCodes(str) {
            const colorMap = {
                'b': '#5b9bd5', 'r': '#e74c3c', 'g': '#2ecc71',
                'w': '#ffffff', 'y': '#f1c40f', 'p': '#9b59b6', 'o': '#e67e22'
            };
            // Replace ~X~ or ~#hex~ with span open/close
            return str.replace(/~([a-zA-Z]|#[0-9a-fA-F]{3,6})~/g, (match, code) => {
                if (code === 'w') return '</span>'; // white = reset
                const color = code.startsWith('#') ? code : colorMap[code.toLowerCase()];
                if (!color) return match;
                return `<span style="color:${color}">`;
            });
        }

        function setInteraction(visible, title, text) {
            const box = document.getElementById('interaction');
            if(visible) {
                const raw = title ? `${title}: ${text}` : text;
                document.getElementById('inter-text').innerHTML = parseColorCodes(raw);
                box.style.display = 'flex';
            } else { box.style.display = 'none'; }
        }

        function setGameHUD(visible) {
            const ids = ['hud-container', 'speedo', 'job-hud', 'interaction', 'weapon-hud'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.style.opacity = visible ? '1' : '0';
                    el.style.pointerEvents = visible ? 'auto' : 'none';
                }
            });
            // Also hide/show the new status containers
            const statusBox = document.querySelector('.status-container');
            if(statusBox) statusBox.style.opacity = visible ? '1' : '0';
            
            const paydayBox = document.querySelector('.payday-box');
            if(paydayBox) paydayBox.style.opacity = visible ? '1' : '0';
        }

        let hotbarTimer = null;
        function updateHotbar(itemsJson) {
            const items = JSON.parse(itemsJson); 
            const container = document.getElementById('pop-hotbar');
            container.innerHTML = '';
            for(let i=0; i<5; i++) {
                const realSlot = -51 - i; 
                const item = items.find(x => x.slot === realSlot);
                let html = `<span class="hb-idx">${i+1}</span>`;
                if(item) html += `<img src="items/${item.icon || item.itemId + '.png'}" class="hb-img" onerror="this.src='items/default.png'">`;
                let div = document.createElement('div');
                div.className = 'hb-slot';
                div.id = `pop-slot-${i}`;
                div.innerHTML = html;
                container.appendChild(div);
            }
        }
        function showHotbar(activeIndex) {
            const bar = document.getElementById('pop-hotbar');
            for(let i=0; i<5; i++) {
                const el = document.getElementById(`pop-slot-${i}`);
                if(el) el.classList.remove('active');
            }
            if(activeIndex !== undefined && activeIndex !== null) {
                const activeEl = document.getElementById(`pop-slot-${activeIndex}`);
                if(activeEl) activeEl.classList.add('active');
            }
            bar.style.opacity = '1';
            if(hotbarTimer) clearTimeout(hotbarTimer);
            hotbarTimer = setTimeout(() => { bar.style.opacity = '0'; }, 3000);
        }

        function updateZoneStatus(visible, type) {
            const el = document.getElementById('zone-status');
            const label = document.getElementById('zone-label');
            if (!visible) { el.style.display = 'none'; return; }
            el.style.display = 'block';
            el.className = 'zone-text'; 
            if (type === 'safe_zone') { el.classList.add('safe'); label.innerText = "SAFE ZONE"; } 
            else if (type === 'no_collision') { el.classList.add('noclip'); label.innerText = "NO COLLISION"; }
            else { label.innerText = type.replace('_', ' '); }
        }

        // --- CENTER POPUP SYSTEM ---
        let popupTimer = null;
        const ICON_MAP = {
            money: 'fas fa-dollar-sign',
            xp: 'fas fa-star',
            levelup: 'fas fa-arrow-up',
            generic: 'fas fa-gift'
        };

        /**
         * Show a center-bottom popup.
         * @param {string} title - Main title (e.g. "PAYDAY")
         * @param {string} subtitle - Description line
         * @param {string} rewardsJson - JSON array of { type: "money"|"xp"|"levelup"|"generic", value: "$1000" }
         * @param {number} duration - How long to show in ms (default 6000)
         */
        function showCenterPopup(title, subtitle, rewardsJson, duration) {
            const popup = document.getElementById('center-popup');
            const dur = duration || 6000;

            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-subtitle').innerText = subtitle;

            // Build rewards
            const rewardsEl = document.getElementById('popup-rewards');
            rewardsEl.innerHTML = '';
            try {
                const rewards = JSON.parse(rewardsJson);
                rewards.forEach(r => {
                    const type = r.type || 'generic';
                    const icon = ICON_MAP[type] || ICON_MAP.generic;
                    const div = document.createElement('div');
                    div.className = 'popup-reward ' + type;
                    div.innerHTML = '<i class="' + icon + '"></i><span class="reward-val">' + r.value + '</span>';
                    rewardsEl.appendChild(div);
                });
            } catch(e) {}

            // Progress bar (auto-closing indicator)
            const fill = document.getElementById('popup-progress-fill');
            fill.style.transition = 'none';
            fill.style.width = '100%';
            // Force reflow
            void fill.offsetWidth;
            fill.style.transition = 'width ' + dur + 'ms linear';
            fill.style.width = '0%';

            // Show
            popup.classList.add('visible');

            // Auto-hide
            if (popupTimer) clearTimeout(popupTimer);
            popupTimer = setTimeout(() => {
                popup.classList.remove('visible');
            }, dur);
        }
    </script>
