<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Central Online - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="auth-wrapper">
        <h1 class="server-title">Central Online</h1>
        
        <div id="notification" class="notification hidden"></div>

        <div id="login-panel">
            <h2>Welcome Back</h2>
            <p class="sub-text">Sign in to continue your story</p>

            <div class="input-group">
                <input type="text" id="login-user" placeholder="Username">
                <i class="fas fa-user"></i>
            </div>
            <div class="input-group">
                <input type="password" id="login-pass" placeholder="Password">
                <i class="fas fa-lock"></i>
            </div>

            <button class="btn-primary" onclick="attemptLogin()">
                <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i> Login
            </button>

            <div class="toggle-link">
                New to the city? <span onclick="switchTab('register')">Create Account</span>
            </div>

            <div id="quick-access-area" class="quick-access hidden">
                <div class="qa-title">Quick Access</div>
                <div id="recent-list" class="recent-list">
                    </div>
            </div>
        </div>

        <div id="register-panel" class="hidden">
            <h2>Identity Creation</h2>
            <p class="sub-text">Begin your new life in Central Online</p>

            <div class="input-group">
                <input type="text" id="reg-user" placeholder="Choose Username">
                <i class="fas fa-user"></i>
            </div>
            <div class="input-group">
                <input type="password" id="reg-pass" placeholder="Password">
                <i class="fas fa-lock"></i>
            </div>
            <div class="input-group">
                <input type="password" id="reg-repass" placeholder="Confirm Password">
                <i class="fas fa-check-circle"></i>
            </div>

            <button class="btn-primary" onclick="attemptRegister()">
                <i class="fas fa-user-plus" style="margin-right: 8px;"></i> Register
            </button>

            <div class="toggle-link">
                Already a citizen? <span onclick="switchTab('login')">Access Account</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
